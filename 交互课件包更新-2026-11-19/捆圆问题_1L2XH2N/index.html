<body>
<div id="app">
 <header class="header"><h1>捆圆问题</h1><div class="toolbar">
  <button id="help" type="button">说明</button><button id="pen-toggle" type="button" aria-pressed="false">批注</button><button id="undo" type="button" disabled>撤销</button><button id="reset" type="button">重置</button><button id="fullscreen" type="button">全屏</button>
 </div></header>
 <div class="body">
  <aside class="sidebar" aria-label="题目设置">
   <section><div class="preset-title"><h2 class="section-title">排列</h2><button type="button" id="random-question" class="random-question">随机出题</button></div><div class="presets" id="presets">
    <button data-preset="square" type="button">正方形</button><button data-preset="rectangle" type="button">长方形</button>
    <button data-preset="triangle" type="button">三角形</button><button data-preset="diamond" type="button">菱形</button>
    <button data-preset="hexagon" type="button" class="selected">六边形</button><button data-preset="row" type="button">单排</button>
   </div></section>
   <section><div class="row-title"><h2 class="section-title">每行个数</h2><div class="row-actions"><button type="button" id="remove-row" aria-label="删除末行" title="删除末行">−</button><button type="button" id="add-row" aria-label="增加一行" title="增加一行">＋</button></div></div><div id="row-editor"></div></section>
   <section class="diameter-section"><div class="diameter-line"><label for="diameter">直径</label><div class="diameter-step"><button type="button" id="diam-minus" aria-label="直径减小">−</button><input id="diameter" type="text" inputmode="none" readonly value="7" aria-label="圆的直径" aria-haspopup="dialog"><button type="button" id="diam-plus" aria-label="直径增大">＋</button></div><span class="unit">cm</span></div><input id="diam-range" type="range" min="1" max="20" step="0.5" value="7" aria-label="调整圆的直径"></section>
   <div class="quantity"><span>圆的总数</span><span><strong id="quantity">7</strong> 个</span></div>
   <div class="sidebar-bottom"><button type="button" id="assemble" class="primary">拼合</button><button type="button" id="restore">还原</button></div>
  </aside>
  <main class="main">
   <div id="question" class="question"></div>
   <div class="board-wrap" id="board-wrap">
    <svg class="board" id="board" role="group" aria-label="捆圆模型，可拖动蓝色线段和红色圆弧"></svg>
   </div>
   <section class="calculation" aria-label="计算绳长">
    <div class="calculation-line"><label class="answer-group" for="answer-line">线段<input id="answer-line" type="text" inputmode="none" readonly aria-haspopup="dialog" aria-label="线段部分长度"><span class="unit">cm</span></label><span>＋</span><label class="answer-group" for="answer-arc">圆弧<input id="answer-arc" type="text" inputmode="none" readonly aria-haspopup="dialog" aria-label="圆弧部分长度"><span class="unit">cm</span></label><span>＝</span><label class="answer-group" for="answer-total">绳长<input id="answer-total" type="text" inputmode="none" readonly aria-haspopup="dialog" aria-label="绳长"><span class="unit">cm</span></label><div class="calc-buttons"><button class="primary" type="button" id="check">验算</button><button type="button" id="formula-toggle">算式</button></div></div>
    <div class="formula" id="formula"></div><div class="calc-status" id="calc-status" aria-live="polite"></div>
   </section>
  </main>
 </div>
 <div id="pen-tools" aria-label="批注工具"><button class="color-button chosen" type="button" data-color="#ed3349" style="background:#ed3349" aria-label="红色批注"></button><button class="color-button" type="button" data-color="#1468ef" style="background:#1468ef" aria-label="蓝色批注"></button><button class="color-button" type="button" data-color="#efa000" style="background:#efa000" aria-label="黄色批注"></button><button class="pen-action" type="button" id="ink-undo">撤笔</button><button class="pen-action" type="button" id="ink-clear">清空</button><button class="pen-action" type="button" id="pen-close">完成</button></div>
 <svg id="ink-layer" aria-label="批注画布"></svg>
 <div class="number-pad" id="number-pad" role="dialog" aria-labelledby="number-pad-title"><div class="number-pad-title" id="number-pad-title"></div><div class="number-pad-value" id="number-pad-value" aria-live="polite">0</div><div class="number-pad-keys"><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="backspace" class="command" aria-label="退格">退格</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="clear" class="command">清空</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="." id="decimal-key">.</button><button type="button" data-key="0" class="wide">0</button><button type="button" data-key="cancel" class="command">取消</button><button type="button" data-key="confirm" class="command primary">确定</button></div></div>
 <div class="modal" id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="dialog"><h2 id="help-title">课件说明</h2><p>选择排列，点击“随机出题”更换同类题目；也可调整每行个数、行数和直径。点击输入框，用数字键盘填写。</p><p>先逐条点击绳线显色，再拖动拼合；再次点击取消显色后，该段不能拖动。线段向内拼合，圆弧可吸附到任意一个圆上，拼成整圆。</p><p>“拼合”自动演示，“还原”保留题目重新操作。“验算”检查答案，“算式”显示过程。带“≈”的数保留两位小数。</p><p>“撤销”回退一步；“重置”恢复默认题目。“批注”可选三色，支持撤笔和清空。</p><div class="dialog-footer"><button type="button" id="help-close" class="primary">知道了</button></div></div></div>
 <div id="toast" class="toast" role="status"></div>
</div>
