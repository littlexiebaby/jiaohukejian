    <style>
        /* 强制全局使用宋体，最符合小学试卷标准规范 */
        body {
            font-family: 'SimSun', '宋体', 'STSong', 'Songti SC', 'Noto Serif CJK SC', serif;
            color: #1f2937;
        }

        /* 强制覆盖 MathJax 内嵌文本的字体为宋体 (解决 % 符号显示不规范的问题) */
        svg text {
            font-family: 'SimSun', '宋体', 'STSong', 'Songti SC', 'Noto Serif CJK SC', serif !important;
        }

        /* A4 Paper styling - STRICT 1 PAGE LOCK */
        .page-container {
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            box-sizing: border-box;
            background: white;
            margin: 0 auto;
            padding: var(--page-pad-y, 18mm) var(--page-pad-x, 14mm);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            position: relative;
        }

        /* Answer toggling logic */
        .math-answer {
            color: #e11d48; /* Red for answers */
            display: block;
            visibility: hidden;
        }
        .math-answer-inline {
            display: inline-block;
            visibility: hidden;
        }
        /* 强制答案区SVG数学符号为红色，解决html2canvas无法解析currentColor的问题 */
        .math-answer svg,
        .math-answer-inline svg {
            fill: #e11d48 !important;
        }
        .show-answers .math-answer {
            visibility: visible;
        }
        .show-answers .math-answer-inline {
            visibility: visible;
        }
        .show-answers .blank-line {
            display: none;
        }

        /* Layout Grids */
        .grid-s1 { display: grid; column-gap: var(--s1-col-gap, 1rem); row-gap: var(--s1-row-gap, 1.5rem); font-size: var(--paper-font-size, 17px) !important; }
        .grid-s2 { display: grid; column-gap: var(--s2-col-gap, 1.5rem); row-gap: var(--s2-row-gap, 3.6rem); padding-bottom: var(--s2-pad-bottom, 3.6rem); font-size: var(--paper-font-size, 17px) !important; }
        .grid-s3 { display: grid; column-gap: var(--s3-col-gap, 1.5rem); row-gap: var(--s3-row-gap, 3.5rem); padding-bottom: var(--s3-pad-bottom, 3.5rem); font-size: var(--paper-font-size, 17px) !important; }
        .grid-s1, .grid-s2, .grid-s3 {
            margin-left: 8px;
            width: calc(100% - 8px);
        }
        .page-container > .text-center { margin-bottom: var(--header-mb, 2rem) !important; }
        #section-1-container { margin-bottom: var(--section1-mb, 2rem) !important; }
        #section-2-container { margin-bottom: var(--section2-mb, 2.5rem) !important; }
        .page-container h2 { margin-bottom: var(--section-title-mb, 1.5rem) !important; }
        .problem-box {
            min-height: var(--problem-min-h, 66px) !important;
            padding-left: var(--problem-pad-x, 0.5rem) !important;
            padding-right: var(--problem-pad-x, 0.5rem) !important;
        }
        .grid-s3 .problem-box { min-height: var(--s3-problem-min-h, var(--problem-min-h, 66px)) !important; }
        .math-answer, .math-answer-inline { font-size: var(--answer-font-size, 18px) !important; }
        .grid-s2 .math-answer { min-height: var(--s2-answer-min-h, 26px); }
        .grid-s3 .math-answer {
            margin-top: var(--s3-answer-mt, 0.5rem) !important;
            min-height: var(--s3-answer-min-h, 30px);
        }
        .math-answer .math-fit {
            padding-left: var(--answer-pad-x, 0.5rem) !important;
            padding-right: var(--answer-pad-x, 0.5rem) !important;
        }
        .math-fit {
            min-width: 0;
            max-width: 100%;
            text-align: center;
        }
        .problem-box > .math-fit {
            display: block;
            width: 100%;
        }
        .math-fit-row {
            white-space: nowrap;
        }
        .math-fit mjx-container {
            font-size: var(--math-fit-scale, 1em) !important;
            max-width: 100%;
            overflow: visible !important;
            text-align: center !important;
        }
        .math-fit mjx-container svg {
            overflow: visible !important;
        }
        /* 关键：消除 Grid 默认 min-width:auto，防止长公式撑大单元格溢出页面 */
        .grid-s1 > *, .grid-s2 > *, .grid-s3 > * {
            min-width: 0;
            overflow: hidden;
        }
        /* PDF 导出专用：用固定在视口左上角的 A4 副本生成 PDF，避免受左侧控制栏、
           预览滚动容器、margin:auto 和毫米转像素取整影响。 */
        .pdf-export-stage {
            position: fixed;
            left: 0;
            top: 0;
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            background: #fff;
            pointer-events: none;
            z-index: 9998;
        }
        .pdf-export-stage .page-container {
            width: 210mm !important;
            height: 297mm !important;
            margin: 0 !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .pdf-export-stage .grid-s1 > *,
        .pdf-export-stage .grid-s2 > *,
        .pdf-export-stage .grid-s3 > * {
            overflow: visible !important;
            padding-right: 6px;
            padding-bottom: 2px;
            box-sizing: border-box;
        }
        .pdf-export-stage mjx-container,
        .pdf-export-stage mjx-container svg {
            overflow: visible !important;
        }

        /* Editable elements */
        [contenteditable="true"] {
            outline: 2px dashed transparent;
            transition: outline 0.2s;
            border-radius: 4px;
            cursor: text;
        }
        [contenteditable="true"]:hover, [contenteditable="true"]:focus {
            outline: 2px dashed #93c5fd;
            background-color: #f8fafc;
        }

        /* Sidebar scrollbar style (Light Tech) */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        /* Number Input styling */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* Print optimization */
        @media print {
            body { background: white; margin: 0; padding: 0; height: auto; overflow: visible; display: block; }
            .no-print { display: none !important; }
            main { overflow: visible !important; height: auto !important; padding: 0 !important; display: block !important; background: white; }
            .page-container { box-shadow: none; margin: 0; padding: var(--page-pad-y, 18mm) var(--page-pad-x, 14mm); width: 210mm; height: 297mm; overflow: hidden; page-break-after: avoid; }
            @page { size: A4; margin: 0; }
        }

        /* Loading overlay */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
