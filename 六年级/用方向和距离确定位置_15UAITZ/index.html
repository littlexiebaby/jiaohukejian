            box-sizing: border-box;
        }

        /* 强健的玻璃面板（提供高透明度降级，即使不支持 backdrop-filter 的老旧内置浏览器也极其清晰） */
        .glass-panel {
            background: #FFFFFF;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        }

        ::-webkit-scrollbar { display: none; }
        
        /* 量角器容器 (尺寸 520px，支持触控拖拽) */
        #protractor-wrapper {

            width: 520px;
            height: 520px;
            z-index: 100;
            transform-origin: center center;
            -webkit-transform-origin: center center;
            touch-action: none;
        }

        .svg-text-glow {
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.95);
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        @-webkit-keyframes anim-grow-south { 0% { height: 0; } 100% { height: 160px; } }
        @keyframes anim-grow-south { 0% { height: 0; } 100% { height: 160px; } }

        @-webkit-keyframes anim-grow-west { 0% { width: 0; } 100% { width: 160px; } }
        @keyframes anim-grow-west { 0% { width: 0; } 100% { width: 160px; } }

        @-webkit-keyframes anim-grow-east { 0% { width: 0; } 100% { width: 160px; } }
        @keyframes anim-grow-east { 0% { width: 0; } 100% { width: 160px; } }

        @-webkit-keyframes anim-pop-label {
            0% { opacity: 0; -webkit-transform: scale(0.4); transform: scale(0.4); }

            100% { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }
        }
        @keyframes anim-pop-label {

                <circle cx="78" cy="43" r="1.5" fill="#64748B" />

                <polygon points="43,11 37,43 43,40" fill="#EF4444" />

                <text x="43" y="62" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5" paint-order="stroke" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="central">南</text>
                <text x="67" y="43" fill="#475569" stroke="#FFFFFF" stroke-width="2.5" paint-order="stroke" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="central">东</text>
