        const container = document.getElementById('canvasContainer');
        const conceptModal = document.getElementById('conceptModal');
        const modalContent = document.getElementById('modalContent');

        // 坐标系布局参数 (增大 top/right 解决溢出，减小 bottom/left 将图表向左下移动)
        const padding = { top: 60, right: 80, bottom: 50, left: 60 };

        // === 3. 核心初始化与渲染 ===
        function init() {
            window.addEventListener('resize', resizeCanvas);
            
            // 交互事件：支持鼠标点击和触摸屏点按
            canvas.addEventListener('mousedown', handlePlotting);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 防止滚动
                handlePlotting(e.touches[0]);
            }, {passive: false});

            renderUI();

            // 修复画布不可见问题：延迟执行重绘，确保Flexbox完成容器实际宽高的计算
            setTimeout(resizeCanvas, 100);
            setTimeout(resizeCanvas, 500);
        }

        function switchType(type) {
            state.currentType = type;
            state.currentIndex = 0;
            resetPlotState();
            
            // 更新按钮样式
            document.getElementById('btnDirect').className = `glass-btn px-6 py-2 rounded-xl font-bold text-lg ${type === 'direct' ? 'active-direct' : 'text-gray-600'}`;
            document.getElementById('btnInverse').className = `glass-btn px-6 py-2 rounded-xl font-bold text-lg ${type === 'inverse' ? 'active-inverse' : 'text-gray-600'}`;
            
            renderUI();
        }

        function switchExample(index) {
            state.currentIndex = index;
            resetPlotState();
            renderUI();
        }

        function resetPlotState() {
            state.plottedPoints = [false, false, false, false, false];
            state.lineRevealed = false;
            document.getElementById('conclusionBox').classList.add('hidden');
            document.getElementById('conclusionBox').classList.remove('scale-100');
            document.getElementById('conclusionBox').classList.add('scale-95');
        }

        function renderUI() {
            renderExampleList();
            renderTable();
            // 不再调用 renderDefinition，改为在弹窗中渲染
            updateStatus();
            resizeCanvas(); // 内部会调用 drawGraph()
        }

        // 新增：弹窗控制逻辑
        function openModal() {
            modalContent.innerHTML = mathDefinitions[state.currentType];
            conceptModal.classList.remove('modal-leave');
            conceptModal.classList.add('modal-enter');
        }

        function closeModal() {
            conceptModal.classList.remove('modal-enter');
            conceptModal.classList.add('modal-leave');
        }

        function renderExampleList() {
            const list = document.getElementById('exampleList');
            list.innerHTML = '';
            const examples = curriculumData[state.currentType];
            
            examples.forEach((ex, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === state.currentIndex;
                const activeClasses = isActive 
                    ? (state.currentType === 'direct' ? 'bg-macaron-pink/40 border-macaron-pink font-bold shadow-sm' : 'bg-macaron-blue/40 border-macaron-blue font-bold shadow-sm')
                    : 'bg-white/40 border-white/50 text-gray-600 hover:bg-white/60';
                
                btn.className = `text-left px-4 py-3 rounded-xl border transition-all ${activeClasses}`;
                btn.innerHTML = ex.title;
                btn.onclick = () => switchExample(idx);
                list.appendChild(btn);
            });
        }

        function renderTable() {
            const ex = curriculumData[state.currentType][state.currentIndex];
            const table = document.getElementById('dataTable');
            document.getElementById('tableTitle').innerText = `📊 数据表：${ex.title}`;
            
            let html = `
                <tr>
                    <th>${ex.xLabel} (X)</th>
                    ${ex.data.map((d, i) => `<td class="${state.plottedPoints[i] ? 'plotted-cell' : ''}" id="td-x-${i}">${d.x}</td>`).join('')}
                </tr>
                <tr>
                    <th>${ex.yLabel} (Y)</th>
                    ${ex.data.map((d, i) => `<td class="${state.plottedPoints[i] ? 'plotted-cell' : ''}" id="td-y-${i}">${d.y}</td>`).join('')}
                </tr>
            `;
            table.innerHTML = html;
        }

        function updateStatus() {
            const plottedCount = state.plottedPoints.filter(p => p).length;
            const statusEl = document.getElementById('plotStatus');
            statusEl.innerText = `(已描点: ${plottedCount}/5)`;
            
            if (plottedCount === 5) {
                statusEl.innerText = `(描点完成 🌟)`;
                statusEl.className = "ml-3 text-sm font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full";
                
                // 显示连线和总结
                if (!state.lineRevealed) {
                    setTimeout(() => {
                        state.lineRevealed = true;
                        drawGraph();
                        showConclusion();
                    }, 500);
                }
            } else {
                statusEl.className = "ml-3 text-sm font-normal text-macaron-red bg-white/50 px-3 py-1 rounded-full";
            }
        }

        function showConclusion() {
            const ex = curriculumData[state.currentType][state.currentIndex];
            const box = document.getElementById('conclusionBox');
            document.getElementById('conclusionText').innerText = ex.conclusion;
            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 50);
        }

        function revealLine() {
            state.plottedPoints = [true, true, true, true, true]; // 自动填满点
            state.lineRevealed = true;
            renderTable();
            updateStatus();
            drawGraph();
            showConclusion();
        }

        // === 4. Canvas 绘图与交互数学逻辑 ===

        function resizeCanvas() {
            // 支持高分屏 (Retina)
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            
            // 修复画布不可见：防御性检查，如果容器宽高为0，则直接跳过避免报错
            if (rect.width === 0 || rect.height === 0) return;
            
            // 依据容器的实际物理像素设定 Canvas 内部尺寸
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            
            // 不再动态设置 canvas.style.width 和 height，完全交由 CSS 绝对定位处理
            canvas._cssWidth = rect.width;
            canvas._cssHeight = rect.height;

            drawGraph();
        }

        // 核心坐标映射函数：数学数据 (dx, dy) 转换为 Canvas 像素坐标 (px, py)
        function getPxFromData(dx, dy, ex, plotW, plotH) {
            const px = padding.left + (dx / ex.maxX) * plotW;
            const py = canvas._cssHeight - padding.bottom - (dy / ex.maxY) * plotH;
            return { x: px, y: py };
        }

        // 将 Canvas 像素坐标 (px, py) 转换为 数学数据 (dx, dy)
        function getDataFromPx(px, py, ex, plotW, plotH) {
            const dx = ((px - padding.left) / plotW) * ex.maxX;
            const dy = ((canvas._cssHeight - padding.bottom - py) / plotH) * ex.maxY;
            return { x: dx, y: dy };
        }

        function drawGraph() {
            const w = canvas._cssWidth;
            const h = canvas._cssHeight;
            // 确保宽度和高度有效，避免在隐藏或缩小时引发错误
            if (w === 0 || h === 0) return;

            const ex = curriculumData[state.currentType][state.currentIndex];
            
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;

            ctx.clearRect(0, 0, w, h);

            // 1. 绘制网格线
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(200, 200, 200, 0.4)";
            ctx.beginPath();
            
            // 垂直网格线 (X轴刻度)
            for (let i = 0; i <= ex.maxX; i += ex.stepX) {
                const px = getPxFromData(i, 0, ex, plotW, plotH).x;
                ctx.moveTo(px, padding.top);
                ctx.lineTo(px, h - padding.bottom);
            }
            // 水平网格线 (Y轴刻度)
            for (let i = 0; i <= ex.maxY; i += ex.stepY) {
                const py = getPxFromData(0, i, ex, plotW, plotH).y;
                ctx.moveTo(padding.left, py);
                ctx.lineTo(w - padding.right, py);
            }
            ctx.stroke();

            // 2. 绘制坐标轴 (加粗)
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#5A6270"; // macaron-dark
            ctx.beginPath();
            // Y轴
            ctx.moveTo(padding.left, padding.top - 10);
            ctx.lineTo(padding.left, h - padding.bottom);
            // X轴
            ctx.lineTo(w - padding.right + 10, h - padding.bottom);
            ctx.stroke();

            // 绘制箭头
            ctx.fillStyle = "#5A6270";
            // Y箭头
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top - 15);
            ctx.lineTo(padding.left - 5, padding.top);
            ctx.lineTo(padding.left + 5, padding.top);
            ctx.fill();
            // X箭头
            ctx.beginPath();
            ctx.moveTo(w - padding.right + 15, h - padding.bottom);
            ctx.lineTo(w - padding.right, h - padding.bottom - 5);
            ctx.lineTo(w - padding.right, h - padding.bottom + 5);
            ctx.fill();

            // 3. 绘制文字刻度与标签 (将字号从12px放大至20px，加粗)
            ctx.font = "bold 20px 'Microsoft YaHei'";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            
            // X轴刻度
            for (let i = 0; i <= ex.maxX; i += ex.stepX) {
                const px = getPxFromData(i, 0, ex, plotW, plotH).x;
                // 解决0点重合问题，增加文字间距
                if(i !== 0) ctx.fillText(i, px, h - padding.bottom + 15);
            }
            ctx.fillText(ex.xLabel, w - padding.right + 10, h - padding.bottom + 35);

            // Y轴刻度
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            for (let i = 0; i <= ex.maxY; i += ex.stepY) {
                const py = getPxFromData(0, i, ex, plotW, plotH).y;
                // 解决Y轴的0点重合问题，增加文字间距
                if(i !== 0) ctx.fillText(i, padding.left - 12, py);
            }
            ctx.textAlign = "center";
            ctx.fillText(ex.yLabel, padding.left, padding.top - 25);

            // 补充唯一原点 O
            ctx.textAlign = "right";
            ctx.textBaseline = "top";
            ctx.fillText("0", padding.left - 12, h - padding.bottom + 12);

            // 4. 绘制连线 (仅当 state.lineRevealed 为 true 时)
            if (state.lineRevealed) {
                ctx.lineWidth = 3;
                ctx.strokeStyle = state.currentType === 'direct' ? '#FF6B81' : '#40E0D0'; // 正红，反蓝
                ctx.beginPath();
                
                if (state.currentType === 'direct') {
                    // 正比例：y = kx，直线穿过原点
                    const p1 = ex.data[0];
                    const k = p1.y / p1.x;
                    const startPx = getPxFromData(0, 0, ex, plotW, plotH);
                    const endPx = getPxFromData(ex.maxX, k * ex.maxX, ex, plotW, plotH);
                    ctx.moveTo(startPx.x, startPx.y);
                    ctx.lineTo(endPx.x, endPx.y);
                } else {
                    // 反比例：xy = k (曲线)
                    const p1 = ex.data[0];
                    const k = p1.x * p1.y;
                    
                    // 为了平滑，从很小的x开始画
                    let started = false;
                    const step = ex.maxX / 100; // 采样100个点
                    for (let x = 0.1; x <= ex.maxX + step; x += step) {
                        const y = k / x;
                        if (y <= ex.maxY * 1.5) { // 限制在视口内稍微出头
                            const p = getPxFromData(x, y, ex, plotW, plotH);
                            if (!started) {
                                ctx.moveTo(p.x, p.y);
                                started = true;
                            } else {
                                ctx.lineTo(p.x, p.y);
                            }
                        }
                    }
                }
                ctx.stroke();
            }

            // 5. 绘制学生描出的点
            ex.data.forEach((d, i) => {
                if (state.plottedPoints[i]) {
                    const p = getPxFromData(d.x, d.y, ex, plotW, plotH);
                    
                    // 画点外圈光晕
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = state.currentType === 'direct' ? "rgba(255, 107, 129, 0.3)" : "rgba(64, 224, 208, 0.3)";
                    ctx.fill();
                    
                    // 画实心点
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = state.currentType === 'direct' ? "#FF6B81" : "#0097a7";
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = "#fff";
                    ctx.stroke();
                }
            });
        }

        // 交互逻辑：点击/触摸描点
        function handlePlotting(e) {
            if (state.plottedPoints.every(v => v)) return; // 已经全部描完

            const rect = canvas.getBoundingClientRect();
            // 计算鼠标/触点在canvas上的像素坐标
            const clickPx = e.clientX - rect.left;
            const clickPy = e.clientY - rect.top;

            const ex = curriculumData[state.currentType][state.currentIndex];
            const w = canvas._cssWidth;
            const h = canvas._cssHeight;
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;

            // 允许的误差半径 (像素) - 放宽一点方便触屏小学生操作
            const toleranceRadius = 25; 

            let hitIndex = -1;

            // 遍历未描出的数据点，检查距离
            ex.data.forEach((d, i) => {
                if (!state.plottedPoints[i]) {
                    const target = getPxFromData(d.x, d.y, ex, plotW, plotH);
                    const dist = Math.sqrt(Math.pow(clickPx - target.x, 2) + Math.pow(clickPy - target.y, 2));
                    
                    if (dist < toleranceRadius) {
                        hitIndex = i;
                    }
                }
            });

            if (hitIndex !== -1) {
                // 击中！更新状态
                state.plottedPoints[hitIndex] = true;
                
                // 播放动画效果
                showBubbleBubble(clickPx, clickPy);
                
                renderTable(); // 更新表格背景色
                updateStatus(); // 检查是否完成
                drawGraph();    // 重新绘制
            }
        }

        // 在点击位置显示气泡反馈
        function showBubbleBubble(x, y) {
            const bubble = document.createElement('div');
            bubble.className = 'feedback-bubble';
            bubble.innerText = '👍 准确!';
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            container.appendChild(bubble);
            
            setTimeout(() => {
                if(container.contains(bubble)) container.removeChild(bubble);
            }, 1000);
        }

        // 页面加载完毕执行
        window.onload = init;

    </script>
</body>
</html>
