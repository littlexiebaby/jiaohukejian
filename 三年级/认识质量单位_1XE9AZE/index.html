<main id="app">
 <header class="header"><h1>认识质量单位</h1><nav class="tools" aria-label="课件工具"><button class="tool" id="help-button">说明</button><button class="tool" id="pen-button" aria-pressed="false">批注</button><button class="tool" id="undo-button" disabled>撤销</button><button class="tool" id="reset-button">重置</button><button class="tool" id="fullscreen-button">全屏</button></nav></header>

 </aside>
 <div class="experiment">

 <section class="work" aria-label="称重实验">
  <div class="model-area"><div id="stage" aria-label="把物品拖到秤上"><svg id="scale-svg" viewBox="0 0 720 720" role="img" aria-label="电子秤"></svg></div><p class="scale-label" id="scale-label"></p></div>
  <div class="read-area"><div class="approx" id="approx"></div><div class="readline" aria-live="polite" aria-atomic="true"><output id="read-number">0</output><span id="read-unit">克</span></div><div class="units" aria-label="质量单位"><button data-unit="g" class="active" aria-pressed="true">克</button><button data-unit="kg" aria-pressed="false">千克</button><button data-unit="t" aria-pressed="false">吨</button></div><div class="actions"><button id="hide-button" class="warm" aria-pressed="false">隐藏读数</button><button id="record-button" disabled>记录</button><button id="clear-button" disabled>清空</button></div><p id="problem" role="status"></p></div>
 </section>
 </div></div>
 <div class="overlay" id="scale-overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="scale-title"><div class="panel-head"><h2 id="scale-title">选择秤</h2><button class="close" data-close="scale-overlay">关闭</button></div><div class="scale-grid" id="scale-grid"></div></section></div>
 <div class="overlay" id="help-overlay" hidden><section class="dialog help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="panel-head"><h2 id="help-title">课件说明</h2><button class="close" data-close="help-overlay">关闭</button></div><p>从左侧物品栏拖到秤上，重复拖动可合称。点物品可先调大小、切换幼年和成年，再拖上秤。</p><p>点秤上的物品可再次调整或移除。点上方秤名换秤，注意量程和分度值。</p><p>隐藏读数练习读刻度；盘秤、弹簧秤的刻度可放大。稳定后点“记录”，记录表上行是物品，下行是质量。</p><p>1千克＝1000克，1吨＝1000千克。质量为教学示例，不能整格读出的结果标“约”。</p><p>记录可单独删除或全部清除。批注有三色并可撤笔、清笔；撤销恢复上一步，重置恢复初始状态。</p></section></div>
 <div class="overlay" id="records-overlay" hidden><section class="dialog records-dialog" role="dialog" aria-modal="true" aria-labelledby="records-title"><div class="panel-head"><h2 id="records-title">记录表</h2><button class="close" data-close="records-overlay">关闭</button></div><div class="record-scroll"><table id="record-table" aria-label="称重记录，第一行物品，第二行质量"><tbody id="record-body"></tbody></table><p class="empty" id="records-empty">还没有记录</p></div><div class="record-footer"><button id="clear-records-button" class="danger">全部清除</button></div></section></div>
 <div class="overlay" id="zoom-overlay" hidden><section class="dialog zoom-dialog" role="dialog" aria-modal="true" aria-labelledby="zoom-title"><div class="panel-head"><h2 id="zoom-title">刻度</h2><button class="close" data-close="zoom-overlay">关闭</button></div><svg id="zoom-svg" viewBox="135 250 450 450" role="img" aria-label="放大的刻度"></svg></section></div>
 <svg id="ink" viewBox="0 0 1600 900" aria-label="批注画布"></svg>
 <div id="pen-tools" hidden><button class="color active-color" data-color="#f04444" style="background:#f04444" aria-label="红色笔"></button><button class="color" data-color="#2285ef" style="background:#2285ef" aria-label="蓝色笔"></button><button class="color" data-color="#e7ae0b" style="background:#e7ae0b" aria-label="黄色笔"></button><button class="pen-action" id="undo-ink-button">撤笔</button><button class="pen-action" id="clear-ink-button">清笔</button><button class="pen-action" id="finish-ink-button">完成</button></div>
 <div id="ghost" hidden><div class="object-art"><img id="ghost-image" alt=""></div></div><div id="toast" role="status" hidden></div>
</main>
