<body>
<main class="app" id="app">
 <header class="topbar">
  <div class="topbar-left">
   <div class="selector-wrap"><button id="netToggle" class="selector-toggle" aria-expanded="false" aria-controls="netPanel">展开图 · 141型① ▾</button><div id="netPanel" class="selector-panel glass" hidden></div></div>
   <!-- 长方体与正方体切换（放置在展开图按钮右侧） -->
   <div class="shape-switch-group" role="group" aria-label="立体图形类型切换">
    <button id="btnCuboid" class="shape-tab-btn active" type="button">长方体</button>
    <button id="btnCube" class="shape-tab-btn" type="button">正方体</button>
   </div>
  </div>
  <h1 id="appTitle">长方体展开图探究</h1>
  <div class="tools"><button id="helpButton">课件说明</button><button id="resetButton">重置</button><button id="fullscreenButton">全屏</button></div>
 </header>
 <section id="stage" class="stage glass" aria-label="展开图与折叠模型">
  <canvas id="scene" aria-label="拖入方向标签，折叠后拖动360度自由旋转长方体"></canvas>
  <div id="feedback" role="status" aria-live="polite"></div><div id="fatal" class="fatal" hidden></div>
  <!-- 参数调节浮动面板（仅长方体显示，默认折叠，纯文字标签） -->
  <div id="paramWidget" class="param-widget" aria-label="尺寸参数调节">
   <button id="paramToggleBtn" class="param-toggle-btn" aria-expanded="false" type="button" title="点击展开/收起尺寸调节">
    <span id="paramModeName">长方体尺寸调节</span>
   </button>
   <div id="paramBody" class="param-body" hidden>
    <div id="cuboidSliders" class="param-group">
     <div class="param-row">
      <label for="sliderLen" class="param-label">长</label>
      <input type="range" id="sliderLen" min="1" max="10" step="1" value="3" class="dim-slider" aria-label="长方体长度">
      <span id="valLen" class="dim-val">3</span>
     </div>
     <div class="param-row">
      <label for="sliderWid" class="param-label">宽</label>
      <input type="range" id="sliderWid" min="1" max="10" step="1" value="2" class="dim-slider" aria-label="长方体宽度">
      <span id="valWid" class="dim-val">2</span>
     </div>
     <div class="param-row">
      <label for="sliderHei" class="param-label">高</label>
      <input type="range" id="sliderHei" min="1" max="10" step="1" value="6" class="dim-slider" aria-label="长方体高度">
      <span id="valHei" class="dim-val">6</span>
     </div>
    </div>
   </div>
  </div>
 </section>
 <footer class="bottom glass">
  <div id="labels" class="labels" aria-label="方向标签"></div>
  <div class="control-row">
   <!-- 折叠校验模式切换：严格校验 / 自由折叠 -->
   <div class="fold-mode-group" role="group" aria-label="折叠校验模式切换">
    <button id="btnStrictFold" class="fold-mode-btn active" type="button" title="严格校验：相对位置正确才允许折叠">严格校验</button>
    <button id="btnFreeFold" class="fold-mode-btn" type="button" title="自由折叠：放满6个面即可折叠">自由折叠</button>
   </div>
   <button id="foldButton" class="primary">开始折叠</button>
   <div class="progress-wrap"><span>展开</span><div class="progress-stack"><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="折叠进度"><output id="percent">0%</output></div><span>折叠</span></div>
   <button id="restoreButton" class="restore">展开还原</button>
  </div>
 </footer>
<div id="noticeModal" class="notice-overlay" hidden><section class="notice-card" role="alertdialog" aria-modal="true" aria-labelledby="noticeTitle" aria-describedby="noticeMessage"><h2 id="noticeTitle">再试一试</h2><p id="noticeMessage"></p><button id="noticeConfirm" type="button">我知道了</button></section></div>
<!-- 课件使用说明弹窗 -->
<div id="helpModal" class="help-overlay" hidden><section class="help-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="help-header"><h2 id="helpTitle">课件使用说明</h2><button id="helpCloseX" class="help-close-x" type="button" aria-label="关闭说明">✕</button></div><div class="help-content"><div class="help-item"><span class="help-badge">1</span><div class="help-text"><strong>选择展开图与图形</strong>：左上角可切换 11 种展开图，并可一键切换长方体与正方体。</div></div><div class="help-item"><span class="help-badge">2</span><div class="help-text"><strong>拖拽方向标签</strong>：将底部「上、下、前、后、左、右」拖入展开图各个面。</div></div><div class="help-item"><span class="help-badge">3</span><div class="help-text"><strong>尺寸调节与折叠模式</strong>：长方体可在左下角调节长宽高；底部可随时切换「严格校验」或「自由折叠」模式。</div></div><div class="help-item"><span class="help-badge">4</span><div class="help-text"><strong>立体折叠与观察</strong>：点击「开始折叠」或拖动进度条，折好后可 360° 自由旋转观察立体模型。</div></div></div><div class="help-footer"><button id="helpConfirmBtn" class="help-btn" type="button">我知道了</button></div></section></div>
</main>
