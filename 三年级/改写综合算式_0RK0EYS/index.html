<!DOCTYPE html>
<html lang="zh-CN" class="h-full select-none">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>改写综合算式</title>
  
  <script src="_site/math/daohang/ku/tailwindcss.js"></script>
  <script src="_site/math/daohang/ku/confetti.browser.min.js"></script>

  <style>
    * {
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
      font-family: "KaiTi", "楷体", "STKaiti", "KaiTi_GB2312", serif;
      box-sizing: border-box;
      touch-action: none !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(135deg, #FFF5F7 0%, #F5F3FF 50%, #F0FDF4 100%);
      touch-action: none !important;
    }

    /* 课件规范拟态：优化为高性能半透明背景，去除吃显卡的大面积实时高斯模糊，确保老旧一体机丝滑流畅 */
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 20px rgba(31, 38, 135, 0.05);
    }

    .pure-btn {
      transition: all 0.18s ease;
      touch-action: manipulation !important;
    }
    .pure-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================
       课件要求.md 专属配色方案：
       pink: '#FFB6C1', blue: '#40E0D0', green: '#98FB98',
       yellow: '#FFEA00', purple: '#E6E6FA', red: '#FF6B81'
       ========================================== */

    /* 严格统一人机交互中所有数字与算式字体大小 (课件统一规格 40px，移动端 28px)，强制单行绝不折行 */
    .unified-num-size {
      font-size: 40px !important;
      line-height: 1 !important;
      font-family: 'Times New Roman', "KaiTi", serif !important;
      font-weight: 900 !important;
      white-space: nowrap !important;
    }

    /* 1. 上层第一步圆圈：马卡龙粉红 (pink: #FFB6C1, 边框 red: #FF6B81) */
    .circle-pink-lg {
      background: linear-gradient(135deg, #FFF0F5 0%, #FFB6C1 100%);
      color: #881337;
      border: 4.5px solid #FF6B81;
      box-shadow: 0 6px 16px rgba(255, 107, 129, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      font-family: 'Times New Roman', "KaiTi", serif;
    }

    /* 2. 中层主算式外部圆圈：马卡龙蓝青 (blue: #40E0D0) */
    .circle-blue-lg {
      background: linear-gradient(135deg, #E0FDFB 0%, #40E0D0 100%);
      color: #0F172A;
      border: 4.5px solid #00CED1;
      box-shadow: 0 6px 16px rgba(64, 224, 208, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      font-family: 'Times New Roman', "KaiTi", serif;
    }

    /* 树状图圆圈统一标准尺寸规格 (所有 5 个格子完全一致，84px × 84px) */
    .tree-node-circle {
      width: 84px !important;
      height: 84px !important;
      min-width: 84px !important;
      min-height: 84px !important;
      max-width: 84px !important;
      max-height: 84px !important;
      border-radius: 9999px !important;
      box-sizing: border-box !important;
      flex-shrink: 0 !important;
    }

    /* 3. 中层目标插槽圆 (格①)：马卡龙淡紫 (purple: #E6E6FA) */
    .slot-purple-lg {
      background: #F5F3FF;
      border: 4.5px dashed #A855F7;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      cursor: pointer;
      color: #7E22CE;
      font-size: 26px;
      font-weight: 900;
      box-sizing: border-box;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .slot-purple-lg.active-hover {
      background: #E6E6FA !important;
      border-color: #9333EA !important;
      border-style: solid !important;
      border-width: 5px !important;
      box-shadow: 0 0 24px rgba(147, 51, 234, 0.6) !important;
    }
    .slot-purple-filled {
      background: linear-gradient(135deg, #FAF5FF 0%, #E6E6FA 100%);
      color: #581C87;
      border: 4.5px solid #A855F7;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      font-family: 'Times New Roman', "KaiTi", serif;
      box-sizing: border-box;
    }

    /* 4. 底层最终结果圆 (格②)：马卡龙薄荷绿 (green: #98FB98) */
    .slot-green-lg {
      background: #F0FDF4;
      border: 4.5px dashed #10B981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      cursor: pointer;
      color: #047857;
      font-size: 24px;
      font-weight: 900;
      box-sizing: border-box;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .slot-green-lg.active-hover {
      background: #98FB98 !important;
      border-color: #059669 !important;
      border-style: solid !important;
      border-width: 5px !important;
      box-shadow: 0 0 24px rgba(5, 150, 105, 0.6) !important;
    }
    .slot-green-filled {
      background: linear-gradient(135deg, #ECFDF5 0%, #98FB98 100%);
      color: #064E3B;
      border: 4.5px solid #059669;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      font-family: 'Times New Roman', "KaiTi", serif;
      box-sizing: border-box;
    }

    /* 5. 第一步 ① 徽标：马卡龙珊瑚红 (red: #FF6B81) */
    .step-badge-one-lg {
      background: #FF6B81;
      color: #FFFFFF;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(255, 107, 129, 0.45);
      border-radius: 9999px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      width: 34px;
      height: 34px;
    }

    /* 6. 数字卡片：与题目紧密相随，无容器外框，马卡龙明黄 (yellow: #FFEA00) */
    .answer-chip-pure {
      background: linear-gradient(135deg, #FFFFE0 0%, #FFEA00 100%);
      border: 4px solid #F59E0B;
      color: #78350F;
      box-shadow: 0 5px 15px rgba(245, 158, 11, 0.25);
      border-radius: 9999px;
      cursor: grab;
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      padding: 6px 24px;
      font-family: 'Times New Roman', "KaiTi", serif;
      transition: transform 0.15s ease, border-color 0.15s ease;
      touch-action: none !important;
    }
    .answer-chip-pure:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .answer-chip-pure.selected {
      border-color: #FF6B81 !important;
      box-shadow: 0 0 0 5px #FFE4E6, 0 8px 24px rgba(255, 107, 129, 0.4) !important;
      transform: scale(1.08);
    }
    .answer-chip-pure.used {
      opacity: 0.22;
      pointer-events: none !important;
      filter: grayscale(0.85);
    }

    /* 硬件加速 120fps 极速 Ghost (绝对禁止 transition 避免拖动延迟卡顿) */
    .ghost-raf-flying {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      z-index: 999999 !important;
      pointer-events: none !important;
      touch-action: none !important;
      will-change: transform !important;
      transition: none !important;
      transform: translate3d(-9999px, -9999px, 0);
    }

    /* 上方第一步脉动提示 */
    .draggable-step1-lg {
      cursor: grab;
      touch-action: none !important;
      transition: transform 0.2s ease, opacity 0.4s ease-out;
    }
    .draggable-step1-lg.pulsing {
      animation: pulse-macaron 2s infinite ease-in-out;
    }
    @keyframes pulse-macaron {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 107, 129, 0)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 16px rgba(255, 107, 129, 0.6)); }
    }

    /* 第一步算式拖入第二步之后的淡出动画 */
    .fade-out-anim {
      animation: formulaFadeOutAnim 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
      pointer-events: none !important;
    }
    @keyframes formulaFadeOutAnim {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-12px) scale(0.92);
      }
    }

    .fade-out-disappear {
      opacity: 0 !important;
      transform: translateY(-12px) scale(0.92) !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    /* 插槽填入成功弹性微动高亮动画 (纯透明度与高光，绝不改变元素位置与尺寸) */
    .slot-bounce-in {
      animation: slotBounceInAnim 0.3s ease-out forwards;
    }
    @keyframes slotBounceInAnim {
      0% {
        opacity: 0.6;
        filter: brightness(1.2);
      }
      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* 亮红色大字号提示 */
    .prompt-red-hero {
      color: #FF6B81 !important;
      font-size: 38px !important;
      font-weight: 900 !important;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(255, 107, 129, 0.18);
    }

    .shake-alert {
      animation: shake-anim 0.35s ease-in-out;
    }
    @keyframes shake-anim {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
    }

    .math-font {
      font-family: 'Times New Roman', "KaiTi", serif;
      font-weight: 900;
    }

    /* 树状图格②平滑位移过渡动画：缓缓从底部过渡到右侧形成完整综合算式 */
    .tree-slot2-flying {
      transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1), top 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    /* 第一步算式标注：无外部容器与背景包围，在算式底部画横线写上①，完全符合课本规范 */
    .formula-step1-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      vertical-align: middle;
      padding: 0 4px;
      margin: 0 4px;
      flex-shrink: 0;
    }
    .formula-step1-line-group {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .formula-step1-line {
      width: 100%;
      height: 3.5px;
      background-color: #FF6B81;
      border-radius: 9999px;
    }
    .formula-step1-badge {
      color: #FF6B81;
      font-weight: 900;
      font-size: 20px;
      line-height: 1;
      margin-top: 2px;
      font-family: 'Times New Roman', "KaiTi", serif;
    }
    /* 选择正确后，底部的横线和①平滑淡出，使原本的算式过渡为纯净正确的综合算式 */
    .formula-step1-line-group.fade-out {
      opacity: 0 !important;
      transform: translateY(8px) !important;
      visibility: hidden !important;
    }

    /* 平滑小括号展开与淡入过渡动画 */
    .bracket-smooth {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.4s ease, transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), margin 0.45s ease;
      font-family: 'Times New Roman', "KaiTi", serif;
      font-weight: 900;
      line-height: 1;
    }
    .bracket-smooth.bracket-hidden {
      max-width: 0 !important;
      opacity: 0 !important;
      transform: scale(0.5) !important;
      margin: 0 !important;
      pointer-events: none !important;
    }
    .bracket-smooth.bracket-visible {
      max-width: 44px !important;
      opacity: 1 !important;
      transform: scale(1) !important;
      margin: 0 3px !important;
    }

    /* 需要加括号的题：小括号缓慢张开并璀璨高亮出示专属动画 (整整1.6秒缓慢高亮) */
    @keyframes bracketHighlightAppearAnim {
      0% {
        max-width: 0;
        opacity: 0;
        transform: scale(0.3);
        color: #FF4757;
        filter: drop-shadow(0 0 0 rgba(255, 71, 87, 0));
      }
      35% {
        max-width: 44px;
        opacity: 1;
        transform: scale(1.22);
        color: #FF4757;
        filter: drop-shadow(0 0 16px rgba(255, 71, 87, 0.9));
      }
      65% {
        max-width: 44px;
        opacity: 1;
        transform: scale(1.14);
        color: #FF4757;
        filter: drop-shadow(0 0 12px rgba(255, 71, 87, 0.8));
      }
      100% {
        max-width: 44px;
        opacity: 1;
        transform: scale(1);
        color: #1e293b;
        filter: drop-shadow(0 0 0 rgba(255, 71, 87, 0));
      }
    }

    /* 移动端专属小括号璀璨高亮出示动画 */
    @keyframes bracketHighlightAppearAnimMobile {
      0% {
        max-width: 0;
        opacity: 0;
        transform: scale(0.3);
        color: #FF4757;
        filter: drop-shadow(0 0 0 rgba(255, 71, 87, 0));
      }
      35% {
        max-width: 26px;
        opacity: 1;
        transform: scale(1.18);
        color: #FF4757;
        filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.9));
      }
      65% {
        max-width: 26px;
        opacity: 1;
        transform: scale(1.1);
        color: #FF4757;
        filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.8));
      }
      100% {
        max-width: 26px;
        opacity: 1;
        transform: scale(1);
        color: #1e293b;
        filter: drop-shadow(0 0 0 rgba(255, 71, 87, 0));
      }
    }

    .bracket-highlight-appear {
      animation: bracketHighlightAppearAnim 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
      display: inline-block !important;
      margin: 0 3px !important;
      line-height: 1 !important;
    }

    /* 树状图圆圈平滑褪去过渡：变成综合算式时平滑过渡为正常纯数字，不再需要圆圈与阴影 */
    .tree-node-to-normal {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      color: #1e293b !important;
      transition: background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease, color 0.8s ease !important;
    }

    /* 替换动画交替高亮呼吸脉冲效果 (慢节奏 0.78s) */
    .alternate-flash-pulse {
      animation: altPulseAnim 0.78s ease-in-out;
    }
    @keyframes altPulseAnim {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* 交替高亮鲜明对比样式：珊瑚红光晕(算式) vs 璀璨金黄光晕(得数)，优化阴影半径以降低显卡负载 */
    .alt-highlight-formula {
      background: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%) !important;
      border: 3.5px solid #FF4757 !important;
      box-shadow: 0 0 16px rgba(255, 71, 87, 0.65) !important;
      border-radius: 20px !important;
      padding: 4px 16px !important;
      margin: 0 8px !important;
      transform: scale(1.04);
      transition: all 0.28s ease !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .alt-highlight-num {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%) !important;
      border: 3.5px solid #F59E0B !important;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.75) !important;
      border-radius: 20px !important;
      padding: 4px 22px !important;
      margin: 0 8px !important;
      color: #B45309 !important;
      transform: scale(1.06);
      transition: all 0.28s ease !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* 树状图与分步算式最终综合算式特大字号样式：充分利用展示区空间，中心绝对对齐，安全呼吸间距 */
    .final-formula-wrap {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .final-formula-wrap .unified-num-size {
      font-size: 54px !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .final-formula-wrap .math-font {
      font-size: 54px !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .final-formula-wrap .math-op {
      font-size: 54px !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 16px !important;
      user-select: none !important;
    }
    .final-formula-wrap .formula-step1-wrap {
      margin: 0 6px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .final-formula-wrap .formula-main-expr {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      line-height: 1 !important;
    }
    .final-formula-wrap .formula-step1-line {
      height: 4.5px !important;
    }
    .final-formula-wrap .formula-step1-badge {
      font-size: 24px !important;
      margin-top: 3px !important;
    }
    .final-formula-wrap .bracket-smooth.bracket-visible {
      max-width: 44px !important;
      margin: 0 3px !important;
    }

    /* 分步算式等宽列对齐：初始2个算式字号与最终综合算式完全一致(54px)，上下严格对齐 */
    .step-initial-formula-wrap .unified-num-size {
      font-size: 54px !important;
      line-height: 1 !important;
    }
    .step-initial-formula-wrap .step-col-badge {
      width: 52px;
      min-width: 52px;
      font-size: 32px !important;
    }
    .step-initial-formula-wrap .step-col-num {
      width: 112px;
      min-width: 112px;
    }
    .step-initial-formula-wrap .step-col-op {
      width: 56px;
      min-width: 56px;
    }

    /* 树状图初始文字字号：与最终综合算式完全保持一致(54px) */
    .tree-diagram-wrap .unified-num-size {
      font-size: 54px !important;
      line-height: 1 !important;
    }
    .tree-diagram-wrap .circle-pink-lg,
    .tree-diagram-wrap .circle-blue-lg,
    .tree-diagram-wrap .slot-purple-filled,
    .tree-diagram-wrap .slot-green-filled {
      font-size: 54px !important;
      line-height: 1 !important;
    }
    .tree-diagram-wrap .tree-node-circle {
      width: 88px !important;
      height: 88px !important;
      min-width: 88px !important;
      min-height: 88px !important;
      max-width: 88px !important;
      max-height: 88px !important;
    }

    .step-col-num {
      width: 96px;
      min-width: 96px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
    }
    .step-col-op {
      width: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
    }
    .step-col-badge {
      width: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .prompt-red-hero { font-size: 24px !important; }

<body class="h-screen w-screen flex flex-col p-2 sm:p-3 text-slate-800 relative">

  <!-- 全屏主布局 -->
  <div id="app-root" class="w-full h-full flex flex-col gap-2 max-w-6xl mx-auto justify-between">
    
    <!-- 顶栏：纯文字 -->
    <header class="w-full flex flex-wrap items-center justify-between gap-2 px-3 py-2 glass-card rounded-2xl shrink-0 z-20">
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="tab-tree" onclick="switchType('tree')" class="pure-btn px-4 py-2 rounded-xl text-base sm:text-lg font-black bg-rose-400 text-white shadow-sm border border-rose-300">
          树状图
        </button>
        <button id="tab-step" onclick="switchType('step')" class="pure-btn px-4 py-2 rounded-xl text-base sm:text-lg font-black bg-white text-slate-700 border border-slate-200 shadow-sm">
          分步算式
        </button>
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto py-0.5" style="scrollbar-width: none; -ms-overflow-style: none;">
        <div id="questions-nav" class="flex items-center gap-1.5" style="scrollbar-width: none; -ms-overflow-style: none;"></div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="undoAction()" class="pure-btn px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-black text-sm sm:text-base shadow-sm">
          撤销
        </button>
        <button onclick="resetCurrentQuestion()" class="pure-btn px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-black text-sm sm:text-base shadow-sm">
          重置
        </button>
        <button onclick="toggleFullscreen()" id="btn-fullscreen" class="pure-btn px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-black text-sm sm:text-base shadow-sm">
          全屏
        </button>
      </div>
    </header>

    <!-- 核心展示舞台 -->
    <main class="w-full flex-1 glass-card rounded-3xl p-2 sm:p-4 flex flex-col items-center justify-between relative overflow-hidden">
      
      <!-- 简明题目标签条 -->
      <div class="w-full flex items-center justify-between px-4 py-1.5 bg-rose-50/70 border border-rose-200/80 rounded-xl shrink-0 text-base sm:text-lg text-rose-950 font-black">
        <div class="flex items-center gap-3">
          <span id="title-tag" class="px-2.5 py-0.5 rounded-lg bg-rose-400 text-white text-sm font-black">第1题</span>
          <span id="title-text">树状图改写综合算式</span>
        </div>
        <span id="step-hint" class="text-xs sm:text-sm text-rose-800 font-bold">观察模型，改写为综合算式</span>
      </div>

      <!-- 核心展示与反馈居中组：图表区与反馈提示紧密上下靠近，垂直居中于视口 -->
      <div class="w-full flex-1 flex flex-col items-center justify-center gap-2 sm:gap-4 my-auto overflow-visible">
        <!-- 核心图形展示区 (树状图/分步算式/综合算式 + 随题附带的数字卡片) -->
        <div id="diagram-container" class="w-full flex flex-col items-center justify-center relative overflow-visible shrink-0">
          <!-- 动态渲染 -->
        </div>

        <!-- 亮红色提醒与回答正确标签区 (紧随综合算式正下方，绝不沉在页面底部) -->
        <div id="interactive-feedback-zone" class="w-full shrink-0 flex flex-col items-center justify-center min-h-[40px] sm:min-h-[50px] relative text-center">
          <!-- 动态反馈 -->
        </div>
      </div>

    </main>

  </div>
