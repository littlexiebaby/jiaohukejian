#scene [data-annotation="thickness"]{cursor:copy}#scene .probe{cursor:grab}.wood-length-btn{display:none;font-size:21px;padding:8px 12px;height:41px}.wood-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}.wood-row{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:25px}.wood-row input{width:88px;height:43px;border:1px solid #b6c6dd;border-radius:5px;text-align:center;font:inherit;background:#fff;-webkit-user-select:text;user-select:text;touch-action:manipulation}.wood-error{color:#b02035;min-height:27px;margin-top:15px;font-size:22px}.dialog .dialogFoot{gap:12px}#woodModal .dialog{width:680px}

.param{display:flex;gap:10px;align-items:center;white-space:nowrap}.param label{white-space:nowrap}.stepper{display:flex;gap:5px;align-items:center}.stepper button{width:33px;padding:4px 0;height:39px;font-size:28px}.param input{width:66px;height:41px;border:1px solid #b6c6dd;border-radius:5px;text-align:center;background:#fff;font-size:25px;padding:4px;-webkit-user-select:text;user-select:text;touch-action:manipulation;-moz-appearance:textfield}.param input::-webkit-inner-spin-button{appearance:none}.stepper input{width:42px}.unit{font-size:22px}.apply{background:var(--blue);color:#fff;padding:10px 18px;font-size:23px}.apply:hover{background:#2055be}.switches{display:flex;gap:12px;border-left:1px solid var(--line);padding-left:20px}.switches button{font-size:22px;padding:9px 11px;border-color:#b7cae7}.switches button:before{content:"";display:inline-block;border:1.5px solid currentColor;width:17px;height:17px;border-radius:50%;vertical-align:-2px;margin-right:7px}.switches button[aria-pressed=true]:before{background:#fff;box-shadow:inset 0 0 0 4px var(--blue)}
#notice{position:absolute;bottom:100px;left:50%;transform:translate(-50%,6px);padding:9px 20px;background:#fff3f1;color:#b13540;border:1px solid #efb6ba;border-radius:7px;font-size:23px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,transform .22s,visibility .22s;z-index:12}#notice.open{opacity:1;visibility:visible;transform:translate(-50%,0)}

.modal{position:absolute;inset:0;z-index:40;background:#15325b35;display:flex;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s;align-items:center;justify-content:center}.modal.open{opacity:1;visibility:visible;pointer-events:auto}.dialog{width:760px;background:white;border:1px solid #b5caec;border-radius:13px;padding:28px 35px 27px;box-shadow:0 12px 60px #172f5b20;transform:translateY(10px);transition:transform .25s}.modal.open .dialog{transform:translateY(0)}.dialog h2{font-size:32px;margin:0 0 19px}.dialog p{font-size:26px;line-height:1.65;margin:9px 0}.dialog .dialogFoot{display:flex;justify-content:flex-end;margin-top:18px}.dialog button{font-size:24px;padding:9px 26px}.dialog .fine{font-size:22px;color:#4e6584}

<body>
<main id="app" aria-label="重叠问题交互课件">
  <header class="topbar"><h1>重叠问题</h1><nav class="tools" aria-label="课件工具">
    <button id="helpBtn">说明</button><button id="penBtn" aria-pressed="false">批注</button><button id="undoBtn" disabled>撤销</button><button id="resetBtn">重置</button><button id="fullBtn">全屏</button>
  </nav></header>
  <div class="modebar"><div class="tabs" role="group" aria-label="题目类型"><button id="ringBtn" class="selected" aria-pressed="true">铁环</button><button id="woodBtn" aria-pressed="false">木条</button></div>
    <div class="legend"><span><i class="swatch"></i>完整长度</span><span><i class="swatch red"></i>重叠部分</span></div>
  </div>
  <svg id="scene" viewBox="0 0 1240 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="点击铁环覆盖长方形，将色块向下拖动，点击红色部分去重，再拖动拼接"></svg>
  <footer class="footer">
    <div class="param"><label for="countInput">数量</label><div class="stepper"><button id="minusBtn" aria-label="减少数量">−</button><input id="countInput" type="number" min="1" max="8" step="1" value="4" inputmode="numeric" aria-label="物体数量"><button id="plusBtn" aria-label="增加数量">+</button></div></div>
    <div class="param"><label for="lengthInput" id="lengthParamLabel">单个长度</label><input id="lengthInput" type="number" value="4" min="0.1" max="500" step="0.1" inputmode="decimal"><button id="woodLengthBtn" class="wood-length-btn">逐根设置</button><span class="unit">厘米</span></div>
    <div class="param"><label for="overlapInput" id="materialParamLabel">铁环厚度</label><input id="overlapInput" type="number" value="5" min="0.1" max="2499" step="0.1" inputmode="decimal"><span class="unit" id="materialParamUnit">毫米</span></div>
    <button id="applyBtn" class="apply">应用</button>
    <div class="switches"><button id="singleBtn" aria-pressed="true">单个长度</button><button id="totalBtn" aria-pressed="false">总长度</button></div>
  </footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="penTools"><span class="pen-note">笔色</span><button class="penColor active" data-color="#ef3e56" style="background:#ef3e56" aria-label="红色笔"></button><button class="penColor" data-color="#1675ef" style="background:#1675ef" aria-label="蓝色笔"></button><button class="penColor" data-color="#0aa37c" style="background:#0aa37c" aria-label="绿色笔"></button><button id="inkUndoBtn" class="textBtn">撤笔</button><button id="inkClearBtn" class="textBtn">清笔</button></div>
  <svg id="inkLayer" xmlns="http://www.w3.org/2000/svg" aria-label="批注画布"></svg>
  <section id="helpModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="dialog"><h2 id="helpTitle">课件说明</h2>
    <p>点击铁环或木条覆盖色块，红色表示重叠。点击任意红色去掉一份，原地保留虚线框和标签。</p>
    <p>色块可上下拖开或拖回，也可左右拼接，靠近端点自动吸附。每处连接只去掉一份重叠。</p>
    <p>拖动厚度线或“5毫米”可复制尺段，原标注保留；并排两份比较重叠。木条可“逐根设置”长度。</p>
    <p class="fine">修改数据后点“应用”；长度按钮控制标注。撤销退回操作，重置恢复默认4个铁环。批注支持换色、撤笔和清笔。</p>
    <div class="dialogFoot"><button id="closeHelpBtn">知道了</button></div>
  </div></section>
  <section id="woodModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="woodTitle"><div class="dialog"><h2 id="woodTitle">木条长度</h2><div id="woodGrid" class="wood-grid"></div><div id="woodError" class="wood-error" role="status"></div><div class="dialogFoot"><button id="cancelWoodBtn">取消</button><button id="applyWoodBtn" class="apply">应用</button></div></div></section>
  <section id="keypadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="keypadTitle"><div class="dialog"><div class="keypad-head"><h2 id="keypadTitle">输入数字</h2><button id="keypadClearBtn">清空</button></div><input id="keypadInput" class="keypad-value" type="text" inputmode="none" autocomplete="off" spellcheck="false" aria-labelledby="keypadTitle" aria-describedby="keypadError"><div class="keypad-grid" role="group" aria-label="数字键盘"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key=".">.</button><button data-key="0">0</button><button data-key="backspace" aria-label="退格">⌫</button></div><div id="keypadError" class="keypad-error" role="status"></div><div class="dialogFoot"><button id="keypadCancelBtn">取消</button><button id="keypadConfirmBtn" class="apply">确定</button></div></div></section>
</main>
