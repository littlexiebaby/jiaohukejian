    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四连方</title>
    <script src="_site/math/daohang/ku/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macaron: { pink: '#FFB6C1', blue: '#40E0D0', green: '#98FB98', yellow: '#FFD700', purple: '#DDA0DD', red: '#FF6B81' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #F0F8FF 0%, #FFFFFF 50%, #FFF5EE 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(135, 135, 135, 0.15);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            color: #555;
            font-weight: bold;
        }
        
        .btn-glass:active {
            transform: scale(0.95);
        }

        .btn-active {
            background: #40E0D0 !important;
            color: white !important;
            border-color: #20B2AA !important;
        }

        #grid-container {
            background-image: 
                linear-gradient(rgba(150, 150, 150, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(150, 150, 150, 0.2) 1px, transparent 1px);
        }

        .grid-cell {
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.05);
            transition: background-color 0.2s;
        }
        
        .grid-cell.temp-selected {
            background-color: rgba(255, 182, 193, 0.5); 
            border: 2px dashed #FF6B81;
        }

        .grid-cell.target-area {
            background: repeating-linear-gradient(
                -45deg,
                rgba(0, 0, 0, 0.04),
                rgba(0, 0, 0, 0.04) 8px,
                rgba(0, 0, 0, 0.08) 8px,
                rgba(0, 0, 0, 0.08) 16px
            );
            background-color: rgba(220, 220, 220, 0.5); 
            border: 2px dashed #888;
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.2);
        }

        .tetromino-piece {
            position: absolute;
            cursor: grab;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            touch-action: none;
        }
        
        .tetromino-piece:active {
            cursor: grabbing;
        }

        .tetromino-piece.selected {
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
            z-index: 50 !important;
        }

        .piece-block {
            position: absolute;
            box-sizing: border-box;
            border: 2px solid #000 !important; 
            border-radius: 2px;
        }

        @keyframes slideUpFade {
            0% { transform: translate(-50%, 20px); opacity: 0; }
            10% { transform: translate(-50%, 0); opacity: 1; }
            90% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, -20px); opacity: 0; }
        }
        .toast {
            animation: slideUpFade 3s forwards;
            pointer-events: none;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #40E0D0;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .collection-item-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.5);
            padding: 0.5rem;
            border-radius: 0.5rem;
        }
        
        .mini-board {
            position: relative;
            background: transparent;
        }
        
        .animating-transform {
            transition: transform 0.6s ease-in-out !important;
        }

        .btn-cute {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid transparent;
            border-bottom-width: 6px;
            border-radius: 9999px;
            transition: all 0.1s;
            font-weight: 900;
        }
        .btn-cute:active {
            transform: translateY(3px);
            border-bottom-width: 3px;
        }
        .btn-cute:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            border-bottom-width: 6px;
            filter: grayscale(100%);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C1; 
            border-radius: 4px;
        }
    </style>

<body class="h-screen w-screen flex flex-col p-2 box-border">

    <div id="toast-container" class="fixed top-10 left-1/2 z-[100]"></div>

    <!-- Top Area (77%, 增加了5%空间给探索发现区) -->
    <div class="flex-grow flex gap-2 relative h-[77%] mb-1">
        <!-- Main Board -->
        <div class="flex-grow relative glass-panel rounded-2xl overflow-hidden flex flex-col shadow-lg">
            
            <div class="h-12 w-full flex items-center justify-between px-4 border-b border-white/40 bg-white/30 z-10 shrink-0">
                <div class="flex gap-2">
                    <button id="tab-mode1" class="btn-glass px-4 py-1 rounded-full btn-active text-sm shadow">探索发现</button>
                    <button id="tab-mode2" class="btn-glass px-4 py-1 rounded-full text-sm shadow">挑战闯关</button>
                </div>
            </div>

            <div id="board-area" class="flex-grow relative overflow-hidden bg-white/20 touch-none">
                <div id="grid-container" class="absolute top-0 left-0 w-full h-full transform-origin-top-left"></div>
                <div id="pieces-container" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
                
                <!-- 使用手册按钮 -->
                <button id="btn-manual" class="absolute bottom-3 left-3 z-30 btn-cute px-3 py-1.5 md:px-4 md:py-2 flex items-center gap-2 shadow-md" style="border-color: #40E0D0; color: #20B2AA;">
                    <span class="text-lg md:text-xl drop-shadow-sm">📖</span>
                    <span class="font-bold text-xs md:text-sm tracking-wider">使用手册</span>
                </button>
            </div>
        </div>

        <!-- Sidebar 图鉴箱宽度增加4% -->
        <div id="sidebar" class="w-[116px] md:w-[185px] shrink-0 glass-panel rounded-2xl flex flex-col overflow-hidden shadow-lg transition-all duration-300">
            <div class="h-12 w-full flex items-center justify-center border-b border-white/40 bg-white/30 font-bold text-gray-700 text-sm">
                图鉴箱
            </div>
            <div id="collection-list" class="flex-grow overflow-y-auto p-2 flex flex-col items-center"></div>
            <div class="p-2 border-t border-white/40 bg-white/20 text-center text-xs text-gray-500 font-bold">
                共5种，集齐了吗？
            </div>
        </div>
    </div>

    <!-- Bottom Control Area (23%, 高度减少了5%) -->
    <div class="h-[23%] min-h-[140px] max-h-[190px] shrink-0 glass-panel rounded-[2rem] p-2 flex flex-row w-full shadow-lg relative bottom-[2px] mx-1 border-4 border-white/60 bg-gradient-to-r from-pink-50 via-white to-cyan-50 z-20 overflow-hidden items-center">

        <!-- Left Zone: Generators (Mode 2) -->
        <div id="left-zone" class="hidden flex-1 flex-col justify-center items-start gap-2 md:gap-3 pl-1 md:pl-4 border-r border-gray-200/50 pr-2">
            <!-- Random Fragments 整体放大20% -->
            <div class="flex flex-col xl:flex-row items-start xl:items-center gap-1.5 bg-white/80 p-1.5 md:p-2 rounded-xl md:rounded-2xl px-2.5 md:px-4 shadow-sm border border-gray-100 w-full max-w-[265px]">
                <span class="text-sm md:text-base font-bold text-gray-600 whitespace-nowrap">散块:</span>
                <select id="random-size" class="text-sm md:text-base outline-none bg-transparent font-bold text-macaron-red cursor-pointer flex-grow w-full">
                    <option value="8">8格</option>
                    <option value="12">12格</option>
                    <option value="16" selected>16格</option>
                    <option value="20">20格</option>
                    <option value="24">24格</option>
                    <option value="28">28格</option>
                    <option value="32">32格</option>
                    <option value="36">36格</option>
                    <option value="40">40格</option>
                    <option value="44">44格</option>
                    <option value="48">48格</option>
                </select>
                <button id="btn-gen-random" class="btn-cute px-3 py-1 md:px-4 md:py-1.5 text-sm md:text-base font-bold text-orange-500 border-yellow-300 bg-yellow-50 whitespace-nowrap mt-1 xl:mt-0">✨ 出题</button>
            </div>
            <!-- Rectangle Mode 整体放大20% -->
            <div class="flex flex-col xl:flex-row items-start xl:items-center gap-1.5 bg-white/80 p-1.5 md:p-2 rounded-xl md:rounded-2xl px-2.5 md:px-4 shadow-sm border border-gray-100 w-full max-w-[265px]">
                <span class="text-sm md:text-base font-bold text-gray-600 whitespace-nowrap">规则:</span>
                <select id="rect-size" class="text-sm md:text-base outline-none bg-transparent font-bold text-macaron-blue cursor-pointer flex-grow w-full">
                    <option value="4,4">4 × 4</option>
                    <option value="5,4">5 × 4</option>
                    <option value="6,4">6 × 4</option>

                </select>

        <!-- Mid Zone: Inventory (Mode 2), flex-[2] 给更多空间 -->
        <div id="mid-zone" class="hidden flex-[2] justify-center items-center px-1">

            <div id="inventory-area" class="flex flex-wrap justify-center gap-3 md:gap-5 bg-white/40 px-4 md:px-8 py-3 md:py-4 rounded-[1.5rem] shadow-inner border border-white/80 w-auto min-h-[96px]">
                <!-- Spawner buttons injected here -->
            </div>
        </div>

        <!-- Right Zone: Actions -->
        <div id="right-zone" class="flex-1 flex justify-center items-center pr-1 md:pr-4 pl-1 md:pl-2 w-full">

                <!-- 新增：缩放按钮组 -->
                <div class="flex flex-col justify-center gap-1 shrink-0">
                    <button id="btn-zoom-in" class="btn-cute p-0.5 md:p-1 px-2 md:px-3 flex items-center justify-center shadow-sm" style="border-color: #98FB98; color: #3CB371;" title="放大">

                    <button id="btn-zoom-out" class="btn-cute p-0.5 md:p-1 px-2 md:px-3 flex items-center justify-center shadow-sm" style="border-color: #98FB98; color: #3CB371;" title="缩小">
                        <span class="text-sm md:text-base font-black">➖</span>
                    </button>
                </div>
                
                <button id="btn-rotate" class="btn-cute p-1 md:px-4 md:py-2 flex flex-1 items-center justify-center gap-1 shadow-sm disabled:opacity-50" style="border-color: #FFD700; color: #DAA520;">
                    <span class="text-base md:text-xl drop-shadow-sm">💫</span>
                    <span class="font-bold text-xs md:text-sm tracking-wider whitespace-nowrap hidden sm:inline">旋转</span>
                </button>
                <button id="btn-flip" class="btn-cute p-1 md:px-4 md:py-2 flex flex-1 items-center justify-center gap-1 shadow-sm disabled:opacity-50" style="border-color: #40E0D0; color: #20B2AA;">

                    <span class="font-bold text-xs md:text-sm tracking-wider whitespace-nowrap hidden sm:inline">翻折</span>

                <button id="btn-delete" class="btn-cute p-1 md:px-4 md:py-2 flex flex-1 items-center justify-center gap-1 shadow-sm disabled:opacity-50" style="border-color: #FF6B81; color: #FF4757;">

                    <span class="font-bold text-xs md:text-sm tracking-wider whitespace-nowrap hidden sm:inline">删除</span>
                </button>
                <button id="btn-clear" class="btn-cute p-1 md:px-4 md:py-2 flex flex-1 items-center justify-center gap-1 shadow-sm" style="border-color: #DDA0DD; color: #BA55D3;">
                    <span class="text-base md:text-xl drop-shadow-sm">🧹</span>
                    <span class="font-bold text-xs md:text-sm tracking-wider whitespace-nowrap hidden sm:inline">清空</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 使用手册弹窗 -->
    <div id="manual-modal" class="fixed inset-0 modal-overlay flex items-center justify-center hidden">
        <div class="modal-content w-11/12 max-w-md p-6 relative flex flex-col gap-4">
            <button id="btn-close-modal" class="absolute top-3 right-3 text-gray-400 hover:text-macaron-red transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-2xl font-black text-center text-macaron-blue mb-2">📖 课件使用手册</h2>
            <div class="overflow-y-auto max-h-[60vh] text-gray-700 text-sm space-y-4 pr-2 font-bold">
                <div>
                    <h3 class="text-macaron-red text-lg mb-1">🎮 模式一：探索发现</h3>
                    <ul class="list-disc pl-5 space-y-1">
                        <li>在上方网格中点击空白格子，连接 <span class="text-macaron-blue">4个</span> 组成四连方。</li>
                        <li>成功拼组的四连方会自动收集到右侧 <strong>图鉴箱</strong> 中。</li>
                        <li>选中拼好的四连方，可以通过下方按钮进行 <strong>旋转</strong>、<strong>翻折</strong>、<strong>删除</strong>。</li>
                        <li>尝试找出所有 <span class="text-macaron-blue">5种</span> 不同的四连方吧！</li>
                    </ul>
                </div>
                <div>
                    <h3 class="text-orange-500 text-lg mb-1">🏆 模式二：挑战闯关</h3>
                    <ul class="list-disc pl-5 space-y-1">
                        <li>左下角可以选择出题方式：<strong>不规则散块</strong> 或 <strong>长方形规则</strong>。</li>
                        <li>点击 <span class="text-yellow-500">✨ 出题</span>，上方区域会出现需要填满的“凹槽”。</li>
                        <li>点击下方中间的 <strong>积木图鉴</strong>，即可生成对应的四连方积木。</li>
                        <li>拖动积木，利用旋转和翻折，将上方凹槽 <strong>完美填满</strong> 即可通关！</li>
                    </ul>
                </div>
            </div>
            <div class="mt-4 flex justify-center">
                <button id="btn-modal-ok" class="btn-cute px-8 py-2 text-white" style="background-color: #40E0D0; border-color: transparent; border-bottom-color: #20B2AA;">我知道啦</button>
            </div>
        </div>
    </div>
