<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量角器炮塔游戏</title>
    <!-- 引入 Tailwind CSS -->
    <script src="_site/math/daohang/ku/tailwindcss.js"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script src="_site/math/daohang/ku/react.development.js"></script>
    <script src="_site/math/daohang/ku/react-dom.development.js"></script>
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="_site/math/daohang/ku/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e8f5e9;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        /* 动画定义 */
        @keyframes firework-pop {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        @keyframes firework-ring {
            0% { r: 0; opacity: 1; stroke-width: 3; }
            100% { r: 60px; opacity: 0; stroke-width: 0; }
        }
        .anim-firework { animation: firework-pop 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .anim-ring { animation: firework-ring 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 修复 ReferenceError: 显式从 window 对象获取 React 和 ReactDOM
        const React = window.React;
        const ReactDOM = window.ReactDOM;
        const { useState, useEffect, useRef, useCallback } = React;

        // --- CSS 动画样式注入组件 ---
        const GlobalStyles = () => (
            <style>{`
                @keyframes firework-pop {
                    0% { transform: translate(0, 0) scale(1.5); opacity: 1; }
                    50% { opacity: 1; } /* 保持前50%时间完全可见 */
                    100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; } /* 稍微留一点大小 */
                }
                @keyframes firework-ring {
                    0% { r: 0; opacity: 0.8; stroke-width: 6; }
                    100% { r: 100px; opacity: 0; stroke-width: 0; } /* 扩大冲击波半径 */
                }
                /* 动画时间延长至 1.2s，曲线调整为更自然的抛物线感觉 */
                .anim-firework { animation: firework-pop 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
                .anim-ring { animation: firework-ring 0.8s ease-out forwards; }
            `}</style>
        );

        // --- 图标组件 ---
        const IconVolume2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        );
        const IconVolumeX = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        );
        const IconRotateCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );
        const IconTarget = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        );
        const IconTrophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );

        // --- 音效管理器 ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();

                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                if (type === 'shoot') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); 
                    gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        };

        // --- 怪兽组件 ---
        const CuteMonster = ({ type, x, y, rotation }) => {
            const SHAPE_COUNT = 23; 
            
            const colorPalettes = [
                { main: '#F3A683', light: '#F7D794', dark: '#E15F41', detail: '#303952' }, // 柔和橙
                { main: '#778BEB', light: '#786FA6', dark: '#546DE5', detail: '#FAD390' }, // 矢车菊蓝
                { main: '#E77F67', light: '#F8A5C2', dark: '#C44569', detail: '#F19066' }, // 珊瑚红
                { main: '#3DC1D3', light: '#63CDDA', dark: '#303952', detail: '#F5CD79' }, // 冰川青
                { main: '#F5CD79', light: '#F7D794', dark: '#E66767', detail: '#596275' }, // 奶油黄
                { main: '#786FA6', light: '#A29BFE', dark: '#574B90', detail: '#81ECEC' }, // 薰衣草紫
                { main: '#CF6A87', light: '#F8A5C2', dark: '#C44569', detail: '#F7F1E3' }, // 玫瑰红
                { main: '#63CDDA', light: '#81ECEC', dark: '#3DC1D3', detail: '#546DE5' }, // 薄荷绿
                { main: '#596275', light: '#95A5A6', dark: '#303952', detail: '#FF7675' }, // 考拉灰
                { main: '#FFAF40', light: '#FFFA65', dark: '#FF9F43', detail: '#FFFFFF' }, // 金橘色
            ];

            const shapeIndex = type % SHAPE_COUNT;
            const colorIndex = Math.floor(type / SHAPE_COUNT) % colorPalettes.length;
            const theme = colorPalettes[colorIndex];
            const gradId = `grad-${type}`;
            const strokeColor = "#2d3436"; 
            const strokeWidth = 2.5;

            const Highlight = ({ cx = -10, cy = -14, r = 5 }) => (
                <ellipse cx={cx} cy={cy} rx={r} ry={r*0.6} fill="white" opacity="0.45" transform="rotate(-30)" />
            );

            const Eyes = ({ y = -4, dist = 9, size = 3.5, type = 'normal' }) => {
                if (type === 'wink') {
                    return (
                        <g transform={`translate(0, ${y})`}>
                            <circle cx={-dist} cy="0" r={size} fill="#333" />
                            <circle cx={-dist+1.5} cy="-1.5" r={size*0.4} fill="white" />
                            <path d={`M${dist-size},0 Q${dist},${size} ${dist+size},0`} stroke="#333" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                        </g>
                    );
                }
                if (type === 'happy') {
                    return (
                        <g transform={`translate(0, ${y})`}>
                            <path d={`M${-dist-size},0 Q${-dist},${-size} ${-dist+size},0`} stroke="#333" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                            <path d={`M${dist-size},0 Q${dist},${-size} ${dist+size},0`} stroke="#333" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                        </g>
                    );
                }
                if (type === 'robot') {
                    return (
                        <g transform={`translate(0, ${y})`}>
                            <rect x={-dist-5} y="-4" width="10" height="8" fill="#333" rx="1"/>
                            <rect x={dist-5} y="-4" width="10" height="8" fill="#333" rx="1"/>
                            <circle cx={-dist} cy="0" r="2" fill="#0f0" />
                            <circle cx={dist} cy="0" r="2" fill="#0f0" />
                        </g>
                    );
                }
                return (
                    <g transform={`translate(0, ${y})`}>
                        <circle cx={-dist} cy="0" r={size} fill="#333" />
                        <circle cx={-dist+1.5} cy="-1.5" r={size*0.4} fill="white" />
                        <circle cx={dist} cy="0" r={size} fill="#333" />
                        <circle cx={dist+1.5} cy="-1.5" r={size*0.4} fill="white" />
                    </g>
                );
            };

            const Mouth = ({ y = 8, type = 'smile' }) => {
                if (type === 'beak') return <path d={`M-3,${y-2} L0,${y+3} L3,${y-2} Z`} fill="#f1c40f" stroke="#333" strokeWidth="1.5" />;
                if (type === 'snout') return (
                    <g transform={`translate(0, ${y})`}>
                        <ellipse cx="0" cy="0" rx="9" ry="6" fill={theme.detail} stroke={strokeColor} strokeWidth={1.5} opacity="0.3"/>
                        <ellipse cx="0" cy="0" rx="9" ry="6" fill="none" stroke={strokeColor} strokeWidth={1.5} />
                        <circle cx="-3" cy="0" r="1.5" fill="#333" />
                        <circle cx="3" cy="0" r="1.5" fill="#333" />
                    </g>
                );
                if (type === 'cat') return (
                    <g transform={`translate(0, ${y})`}>
                        <path d="M-3,-2 Q0,0 3,-2" stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round"/>
                        <line x1="0" y1="-2" x2="0" y2="0" stroke="#333" strokeWidth="2" />
                    </g>
                );
                return <path d={`M-4,${y} Q0,${y+4} 4,${y}`} stroke="#333" strokeWidth="2" fill="none" strokeLinecap="round" />;
            };

            const renderCreature = () => {
                switch(shapeIndex) {
                    case 0: return (<g><path d="M-20,-15 L-25,-32 L-5,-22 Z" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round"/><path d="M20,-15 L25,-32 L5,-22 Z" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round"/><circle cx="0" cy="0" r="24" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-28,4 L-12,4 M-26,-2 L-14,0 M28,4 L12,4 M26,-2 L14,0" stroke={strokeColor} strokeWidth="1.5" /><Eyes y={-4} /><Mouth y={6} type="cat" /></g>);
                    case 1: return (<g><path d="M-20,-10 C-35,-10 -35,10 -22,15 L-18,5 Z" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M20,-10 C35,-10 35,10 22,15 L18,5 Z" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="0" rx="24" ry="22" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="6" rx="10" ry="7" fill="white" /><circle cx="0" cy="4" r="3" fill="#333" /><path d="M0,7 L0,10" stroke="#333" strokeWidth="1.5" /><path d="M-3,10 Q0,12 3,10" stroke="#333" strokeWidth="1.5" fill="none" /><Eyes y={-6} dist={8} /></g>);
                    case 2: return (<g><path d="M-8,-20 C-15,-55 -2,-55 -2,-20" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M8,-20 C15,-55 2,-55 2,-20" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="2" rx="20" ry="18" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-2} dist={8} /><Mouth y={7} type="cat" /><rect x="-2" y="9" width="4" height="3" fill="white" stroke="#333" strokeWidth="0.5" /></g>);
                    case 3: return (<g><circle cx="-18" cy="-18" r="9" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="18" cy="-18" r="9" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="0" cy="0" r="25" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="8" rx="10" ry="7" fill="#FAD390" /><circle cx="0" cy="6" r="3" fill="#333" /><path d="M-3,10 Q0,12 3,10" stroke="#333" strokeWidth="1.5" fill="none" /><Eyes y={-6} /></g>);
                    case 4: return (<g><path d="M-15,-20 L-22,-28 L-10,-24" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round"/><path d="M15,-20 L22,-28 L10,-24" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round"/><ellipse cx="0" cy="0" rx="24" ry="20" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-6} dist={10} /><Mouth y={6} type="snout" /></g>);
                    case 5: return (<g><path d="M0,-35 L5,-28 L12,-32 L14,-25 L22,-26 L20,-18 L28,-16 L24,-10 L32,-6 L26,0 L32,6 L24,10 L28,16 L20,18 L22,26 L14,25 L12,32 L5,28 L0,35 L-5,28 L-12,32 L-14,25 L-22,26 L-20,18 L-28,16 L-24,10 L-32,6 L-26,0 L-32,-6 L-24,-10 L-28,-16 L-20,-18 L-22,-26 L-14,-25 L-12,-32 L-5,-28 Z" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="0" cy="0" r="20" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-3} /><circle cx="0" cy="5" r="2" fill="#333" /><Mouth y={8} type="cat" /></g>);
                    case 6: return (<g><path d="M-20,-10 C-40,-20 -40,20 -20,15 Z" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M20,-10 C40,-20 40,20 20,15 Z" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="0" cy="0" r="24" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-6} dist={8} /><path d="M-2,2 Q-2,15 0,20 Q2,25 8,22" stroke={theme.dark} strokeWidth="5" fill="none" strokeLinecap="round" /></g>);
                    case 7: return (<g><path d="M-18,-15 L-30,-35 L-8,-22 Z" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M18,-15 L30,-35 L8,-22 Z" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M0,24 L-22,-10 L22,-10 Z" fill="white" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round" /><path d="M-22,-12 Q0,-20 22,-12 L0,24 Z" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinejoin="round"/><circle cx="0" cy="22" r="3" fill="#333" /><Eyes y={5} dist={7} size={2.5} /></g>);
                    case 8: return (<g><circle cx="-12" cy="-18" r="9" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="12" cy="-18" r="9" fill={theme.main} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="4" rx="26" ry="20" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-18} dist={12} size={4} /><Mouth y={8} /></g>);
                    case 9: return (<g><ellipse cx="0" cy="0" rx="20" ry="25" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="5" rx="14" ry="18" fill="white" stroke={strokeColor} strokeWidth={1} /><Eyes y={-6} dist={6} /><path d="M-3,2 L0,5 L3,2" fill="#f39c12" stroke="#333" strokeWidth="1" /><path d="M-20,5 Q-28,15 -20,20" fill="none" stroke={strokeColor} strokeWidth={2} /><path d="M20,5 Q28,15 20,20" fill="none" stroke={strokeColor} strokeWidth={2} /></g>);
                    case 10: return (<g><circle cx="0" cy="4" r="22" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-22,4 Q-28,4 -20,12" fill="none" stroke={strokeColor} strokeWidth={2} strokeLinecap="round"/><path d="M22,4 Q28,4 20,12" fill="none" stroke={strokeColor} strokeWidth={2} strokeLinecap="round"/><path d="M0,-18 Q5,-26 0,-28 Q-5,-26 0,-22" fill="none" stroke={strokeColor} strokeWidth={2} /><Eyes y={-2} dist={8} /><Mouth y={6} type="beak" /></g>);
                    case 11: return (<g><ellipse cx="0" cy="0" rx="22" ry="24" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-15,-20 L-20,-28 L-10,-22" stroke={strokeColor} strokeWidth={2} fill="none"/><path d="M15,-20 L20,-28 L10,-22" stroke={strokeColor} strokeWidth={2} fill="none"/><circle cx="-9" cy="-5" r="8" fill="white" opacity="0.6" stroke={strokeColor} strokeWidth={1} /><circle cx="9" cy="-5" r="8" fill="white" opacity="0.6" stroke={strokeColor} strokeWidth={1} /><Eyes y={-5} dist={9} size={3} /><Mouth y={4} type="beak" /></g>);
                    case 12: return (<g><circle cx="-22" cy="-14" r="10" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="22" cy="-14" r="10" fill={theme.dark} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="0" cy="0" r="22" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><ellipse cx="0" cy="2" rx="6" ry="8" fill="#333" /><Eyes y={-6} dist={9} /></g>);
                    /* Case 13 (Panda) Removed */
                    case 13: return (<g><line x1="-8" y1="-10" x2="-12" y2="-25" stroke={strokeColor} strokeWidth="2" /><line x1="8" y1="-10" x2="12" y2="-25" stroke={strokeColor} strokeWidth="2" /><circle cx="-12" cy="-25" r="4" fill="white" stroke={strokeColor} strokeWidth="1.5" /><circle cx="-12" cy="-25" r="1.5" fill="black" /><circle cx="12" cy="-25" r="4" fill="white" stroke={strokeColor} strokeWidth="1.5" /><circle cx="12" cy="-25" r="1.5" fill="black" /><ellipse cx="0" cy="5" rx="25" ry="16" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-25,0 L-35,-10 M-35,-10 L-40,-5 M-35,-10 L-30,-15" stroke={theme.dark} strokeWidth="3" strokeLinecap="round" /><path d="M25,0 L35,-10 M35,-10 L40,-5 M35,-10 L30,-15" stroke={theme.dark} strokeWidth="3" strokeLinecap="round" /><Mouth y={10} type="smile" /></g>);
                    case 14: return (<g><circle cx="0" cy="-18" r="12" fill={theme.light} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-20} dist={5} /><path d="M-22,0 Q-22,-15 0,-15 Q22,-15 22,0 Q22,10 0,10 Q-22,10 -22,0" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-10,-5 L-5,2 L5,2 L10,-5 L0,-10 Z" fill="none" stroke={strokeColor} strokeWidth={1.5} opacity="0.3" /></g>);
                    case 15: return (<g><path d="M0,-30 L0,-20" stroke={strokeColor} strokeWidth="2" /><path d="M-22,10 Q-22,-25 0,-25 Q22,-25 22,10 Q22,22 10,22 Q0,18 -10,22 Q-22,22 -22,10 Z" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><circle cx="0" cy="-2" r="9" fill="white" stroke={strokeColor} strokeWidth={1.5} /><circle cx="0" cy="-2" r="4" fill="#333" /><circle cx="3" cy="-5" r="2" fill="white" /><Mouth y={12} /></g>);
                    case 16: return (<g><path d="M-20,15 L-20,-10 Q-20,-28 0,-28 Q20,-28 20,-10 L20,15 L12,10 L0,16 L-12,10 Z" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-6} type="happy" /><circle cx="-12" cy="0" r="3" fill="#ffaaaa" opacity="0.5" /><circle cx="12" cy="0" r="3" fill="#ffaaaa" opacity="0.5" /></g>);
                    case 17: return (<g><rect x="-20" y="-24" width="40" height="34" rx="4" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><line x1="0" y1="-24" x2="0" y2="-34" stroke={strokeColor} strokeWidth="2" /><circle cx="0" cy="-34" r="3" fill="#e74c3c" stroke={strokeColor} strokeWidth={1.5} /><Eyes y={-8} type="robot" /><line x1="-10" y1="4" x2="10" y2="4" stroke="#333" strokeWidth="2" strokeDasharray="3 2" /></g>);
                    case 18: return (<g><path d="M-18,15 Q-24,28 -12,28" stroke={theme.main} strokeWidth="5" strokeLinecap="round" fill="none"/><path d="M18,15 Q24,28 12,28" stroke={theme.main} strokeWidth="5" strokeLinecap="round" fill="none"/><path d="M-6,18 Q-6,32 0,28" stroke={theme.main} strokeWidth="5" strokeLinecap="round" fill="none"/><path d="M6,18 Q6,32 0,28" stroke={theme.main} strokeWidth="5" strokeLinecap="round" fill="none"/><circle cx="0" cy="0" r="20" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-5} dist={6} /><Mouth y={6} /></g>);
                    case 19: return (<g><path d="M-10,0 Q-35,-15 -45,-5 Q-35,20 -10,12" fill={theme.dark} stroke={strokeColor} strokeWidth={1.5} /><path d="M10,0 Q35,-15 45,-5 Q35,20 10,12" fill={theme.dark} stroke={strokeColor} strokeWidth={1.5} /><circle cx="0" cy="0" r="14" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-10,-10 L-12,-20 L-4,-14" fill={theme.dark} /><path d="M10,-10 L12,-20 L4,-14" fill={theme.dark} /><Eyes y={-2} dist={4} size={2} /><path d="M-3,5 L-3,8 L-1,5" fill="white" /><path d="M3,5 L3,8 L1,5" fill="white" /></g>);
                    case 20: return (<g><path d="M-22,15 Q-25,25 -10,25 Q0,20 10,25 Q25,25 22,15 Q25,-15 0,-25 Q-25,-15 -22,15" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><Eyes y={-5} dist={7} /><Mouth y={5} /><circle cx="15" cy="15" r="2" fill={theme.light} /></g>);
                    case 21: return (<g><circle cx="-5" cy="-5" r="16" fill={theme.detail} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-5,-5 m-8,0 a 8,8 0 1,0 16,0 a 8,8 0 1,0 -16,0" fill="none" stroke="white" strokeWidth="1.5" opacity="0.5" /><path d="M-10,15 L20,15 Q28,15 25,5 Q22,-5 15,5" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" /><line x1="22" y1="0" x2="28" y2="-8" stroke={strokeColor} strokeWidth={1.5} /><line x1="18" y1="2" x2="20" y2="-8" stroke={strokeColor} strokeWidth={1.5} /><circle cx="28" cy="-8" r="1.5" fill="#333" /><circle cx="20" cy="-8" r="1.5" fill="#333" /></g>);
                    case 22: return (<g><rect x="-22" y="-20" width="44" height="40" rx="8" fill={`url(#${gradId})`} stroke={strokeColor} strokeWidth={strokeWidth} /><path d="M-10,-20 L-15,-28 L-5,-20" fill={theme.dark} stroke={strokeColor} strokeWidth={1} /><path d="M10,-20 L15,-28 L5,-20" fill={theme.dark} stroke={strokeColor} strokeWidth={1} /><circle cx="0" cy="-8" r="4" fill="white" stroke="#333" strokeWidth="1.5"/><circle cx="0" cy="-8" r="1.5" fill="#333"/><Eyes y={0} dist={12} /><Mouth y={12} /></g>);
                    default: return null;
                }
            };

            return (
                <g transform={`translate(${x}, ${y}) rotate(${rotation - 90})`}>
                    <defs>
                        <radialGradient id={gradId} cx="30%" cy="30%" r="80%">
                            <stop offset="0%" stopColor={theme.light} />
                            <stop offset="100%" stopColor={theme.main} />
                        </radialGradient>
                    </defs>

                    <animateTransform attributeName="transform" type="translate" values={`${x}, ${y}; ${x}, ${y-5}; ${x}, ${y}`} dur={`${2 + (type%5)/5}s`} repeatCount="indefinite" additive="replace" />
                    <ellipse cx="0" cy="24" rx="16" ry="5" fill="#000" opacity="0.15">
                        <animate attributeName="rx" values="16;14;16" dur={`${2 + (type%5)/5}s`} repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.15;0.1;0.15" dur={`${2 + (type%5)/5}s`} repeatCount="indefinite" />
                    </ellipse>
                    {renderCreature()}
                    {[20, 22].includes(shapeIndex) ? null : <Highlight />}
                </g>
            );
        };

        const ProtractorGame = () => {
            const [gameState, setGameState] = useState('playing'); 
            const [score, setScore] = useState(0);
            const [targetAngle, setTargetAngle] = useState(45); 
            const [baselineSide, setBaselineSide] = useState('right'); 
            const [inputVal, setInputVal] = useState('');
            const [message, setMessage] = useState('准备射击！');
            const [projectile, setProjectile] = useState(null); 
            const [monsterType, setMonsterType] = useState(0);
            const [explosions, setExplosions] = useState([]);
            const [isMuted, setIsMuted] = useState(false);
            const [baselineMode, setBaselineMode] = useState('random'); // 'random', 'left', 'right'
            const [isSimpleMode, setIsSimpleMode] = useState(false); // Add state

            const canvasRef = useRef(null);

            // 修复 Tailwind 错误：自动注入脚本
            useEffect(() => {
                if (typeof window !== 'undefined' && !window.tailwind) {
                    const script = document.createElement('script');
                    script.src = "https://cdn.tailwindcss.com";
                    script.onload = () => console.log("Tailwind loaded");
                    document.head.appendChild(script);
                }
            }, []);

            // 游戏配置
            const centerX = 400;
            const centerY = 380;
            const radius = 300;
            const angleArcRadius = 50;

            const generateLevel = useCallback(() => {
                let newScreenAngle;
                
                if (isSimpleMode) {
                    // 10, 15, 20, ... 170
                    // (170 - 10) / 5 = 32 steps
                    const randomStep = Math.floor(Math.random() * 33);
                    newScreenAngle = 10 + (randomStep * 5);
                    if (newScreenAngle > 170) newScreenAngle = 170; // safety clamp
                } else {
                    newScreenAngle = Math.floor(Math.random() * 160) + 10;
                }
                
                // 难度控制逻辑
                let side;
                if (baselineMode === 'random') {
                    side = Math.random() > 0.5 ? 'right' : 'left';
                } else {
                    side = baselineMode; // 'left' or 'right'
                }

                setTargetAngle(newScreenAngle);
                setBaselineSide(side);
                setMonsterType(Math.floor(Math.random() * 10000));
                setGameState('playing');
                setInputVal('');
                setMessage(side === 'right' ? '请看内圈 (右边0度)' : '请看外圈 (左边0度)');
                setProjectile(null);
                setExplosions([]);
            }, [baselineMode, isSimpleMode]);

            useEffect(() => {
                generateLevel();
            }, [generateLevel]);

            // 添加重置功能：重置分数为0并生成新关卡
            const handleReset = () => {
                setScore(0);
                generateLevel();
            };

            const handleFire = (e) => {
                e.preventDefault();
                if (gameState !== 'playing' || !inputVal) return;

                const userAngle = parseInt(inputVal);
                const correctAnswer = baselineSide === 'right' ? targetAngle : (180 - targetAngle);

                // 精确打击判定：必须相等才算命中
                if (userAngle === correctAnswer) {
                    setGameState('animation');
                    if (!isMuted) playSound('shoot');

                    let progress = 0;
                    const animate = () => {
                        progress += 0.05;
                        
                        let visualAngle;
                        if (baselineSide === 'right') {
                            visualAngle = userAngle;
                        } else {
                            visualAngle = 180 - userAngle;
                        }

                        const rad = (visualAngle * Math.PI) / 180;
                        const px = centerX + (radius * 1.2 * progress) * Math.cos(-rad); 
                        const py = centerY + (radius * 1.2 * progress) * Math.sin(-rad);

                        setProjectile({ x: px, y: py });

                        if (progress < 1.0) {
                            requestAnimationFrame(animate);
                        } else {
                            handleHit(px, py);
                        }
                    };
                    requestAnimationFrame(animate);
                } else {
                    handleMiss();
                }
            };

            const handleHit = (x, y) => {
                setGameState('won');
                setScore(s => s + 10);
                setMessage('命中目标！+10分');
                if (!isMuted) playSound('hit');
                
                const newExplosions = [];
                const timestamp = Date.now();
                
                // 1. 烟花粒子爆炸 (辐射状)
                const particleCount = 50;
                for(let i=0; i<particleCount; i++) {
                    const angle = (Math.PI * 2 * i) / particleCount; // 均匀分布
                    // 速度/距离随机化，制造层次感
                    const velocity = 0.5 + Math.random() * 0.5; 
                    const dist = 70 * velocity; 
                    
                    newExplosions.push({
                        id: `p-${timestamp}-${i}`,
                        type: 'particle',
                        x: x, 
                        y: y,
                        tx: Math.cos(angle) * dist + 'px',
                        ty: Math.sin(angle) * dist + 'px',
                        // 烟花色：红、金、青、紫、白
                        color: ['#FF5252', '#FFD700', '#00E5FF', '#E040FB', '#FFFFFF'][Math.floor(Math.random()*5)],
                        size: Math.random() * 4 + 2
                    });
                }

                // 2. 冲击波圆环
                newExplosions.push({
                    id: `wave-${timestamp}`,
                    type: 'shockwave',
                    x: x,
                    y: y
                });

                setExplosions(newExplosions);
                
                // 优化后的时间协调：
                // 400ms 后播放胜利音效
                // 1200ms 后切换下一关 (刚好在1.2s烟花播完时切换)
                setTimeout(() => {
                    if (!isMuted) playSound('win');
                    setTimeout(generateLevel, 800); 
                }, 400); 
            };

            const handleMiss = () => {
                setGameState('failed');
                setMessage('打偏了，再仔细看看度数！');
                if (!isMuted) playSound('wrong');
                setTimeout(() => {
                    setGameState('playing');
                    setProjectile(null);
                }, 1500);
            };

            const renderProtractorMarks = () => {
                const marks = [];
                for (let i = 0; i <= 180; i++) {
                    const rad = (i * Math.PI) / 180;
                    const isMajor = i % 10 === 0;
                    const isMedium = i % 5 === 0;
                    const outerLen = isMajor ? 12 : (isMedium ? 8 : 5);
                    const innerLen = isMajor ? 12 : (isMedium ? 8 : 5);
                    const outerR_start = radius - 5; 
                    const ox1 = centerX + outerR_start * Math.cos(-rad);
                    const oy1 = centerY + outerR_start * Math.sin(-rad);
                    const ox2 = centerX + (outerR_start - outerLen) * Math.cos(-rad);
                    const oy2 = centerY + (outerR_start - outerLen) * Math.sin(-rad);
                    marks.push(<line key={`tick-out-${i}`} x1={ox1} y1={oy1} x2={ox2} y2={oy2} stroke="#555" strokeWidth={isMajor ? 1.5 : 0.8} />);
                    const innerR_start = radius - 50; 
                    const ix1 = centerX + innerR_start * Math.cos(-rad);
                    const iy1 = centerY + innerR_start * Math.sin(-rad);
                    const ix2 = centerX + (innerR_start - innerLen) * Math.cos(-rad);
                    const iy2 = centerY + (innerR_start - innerLen) * Math.sin(-rad);
                    marks.push(<line key={`tick-in-${i}`} x1={ix1} y1={iy1} x2={ix2} y2={iy2} stroke="#555" strokeWidth={isMajor ? 1.5 : 0.8} />);
                    if (isMajor) {
                        const textR_outer = radius - 30; 
                        const tx_out = centerX + textR_outer * Math.cos(-rad);
                        const ty_out = centerY + textR_outer * Math.sin(-rad);
                        marks.push(<text key={`txt-out-${i}`} x={tx_out} y={ty_out} fontSize="11" textAnchor="middle" alignmentBaseline="middle" fill="#1976d2" fontWeight="bold">{180 - i}</text>);
                        const textR_inner = innerR_start - 25; 
                        const tx_in = centerX + textR_inner * Math.cos(-rad);
                        const ty_in = centerY + textR_inner * Math.sin(-rad);
                        marks.push(<text key={`txt-in-${i}`} x={tx_in} y={ty_in} fontSize="11" textAnchor="middle" alignmentBaseline="middle" fill="#d32f2f" fontWeight="bold">{i}</text>);
                    }
                }
                return marks;
            };

            return (
                <div className="h-screen w-full bg-[#e8f5e9] flex flex-col items-center overflow-hidden font-sans select-none p-2 box-border">
                    <GlobalStyles />
                    {/* 顶部状态栏 */}
                    <div className="w-full flex justify-between items-center px-4 py-2 bg-white/90 rounded-xl shadow-sm border border-green-200 shrink-0 mb-2">
                        <div className="flex items-center gap-2">
                            <div className="bg-yellow-100 p-1.5 rounded-full">
                                <IconTrophy className="text-yellow-600 w-5 h-5" />
                            </div>
                            <div className="text-2xl font-black text-green-700 font-mono leading-none">{score}</div>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <h1 className="text-lg font-bold text-green-800 tracking-wider hidden sm:block">量角器炮塔游戏</h1>
                            <span className={`text-sm font-bold px-3 py-0.5 rounded-full ${gameState === 'failed' ? 'bg-red-100 text-red-500' : 'bg-blue-50 text-blue-600'}`}>
                                {message}
                            </span>
                        </div>

                        <div className="flex gap-2">
                            {/* 更新重置按钮点击事件 */}
                            <button onClick={handleReset} className="p-2 bg-gray-100 rounded-lg hover:bg-green-100 text-green-700" title="重置分数"><IconRotateCcw className="w-5 h-5" /></button>
                            <button onClick={() => setIsMuted(!isMuted)} className="p-2 bg-gray-100 rounded-lg hover:bg-green-100 text-green-700">{isMuted ? <IconVolumeX className="w-5 h-5" /> : <IconVolume2 className="w-5 h-5" />}</button>
                        </div>
                    </div>

                    {/* 主游戏区域 */}
                    <div className="flex-1 w-full bg-white rounded-2xl shadow-lg border-2 border-green-100 overflow-hidden relative flex flex-col">
                        <div className="flex-1 w-full h-full relative min-h-0">
                            <svg 
                                ref={canvasRef}
                                viewBox="0 0 800 450" 
                                preserveAspectRatio="xMidYMid meet"
                                className="w-full h-full cursor-crosshair block"
                            >
                                <defs>
                                    <linearGradient id="protractorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="rgba(240,250,240,0.4)" />
                                        <stop offset="100%" stopColor="rgba(200,230,200,0.6)" />
                                    </linearGradient>
                                </defs>

                                <path d={`M ${centerX - radius},${centerY} A ${radius} ${radius} 0 0 1 ${centerX + radius},${centerY} Z`} fill="url(#protractorGradient)" stroke="#81c784" strokeWidth="3"/>
                                <circle cx={centerX} cy={centerY} r="5" fill="#333" />
                                <line x1={centerX} y1={centerY-5} x2={centerX} y2={centerY+5} stroke="white" strokeWidth="1" />
                                <line x1={centerX-5} y1={centerY} x2={centerX+5} y2={centerY} stroke="white" strokeWidth="1" />
                                {renderProtractorMarks()}

                                {baselineSide === 'right' ? (
                                    <g>
                                        <line x1={centerX} y1={centerY} x2={centerX + radius + 30} y2={centerY} stroke="#ffcdd2" strokeWidth="8" strokeLinecap="round" opacity="0.5"/>
                                        <line x1={centerX} y1={centerY} x2={centerX + radius + 25} y2={centerY} stroke="#d32f2f" strokeWidth="3" />
                                        <text x={centerX + radius + 40} y={centerY + 5} fill="#d32f2f" fontWeight="bold" fontSize="16">0°</text>
                                        {/* 直角显示优化 */}
                                        {targetAngle === 90 ? (
                                            <path d={`M ${centerX + 30} ${centerY} L ${centerX + 30} ${centerY - 30} L ${centerX} ${centerY - 30}`} fill="none" stroke="#d32f2f" strokeWidth="3" opacity="0.8"/>
                                        ) : (
                                            <path d={`M ${centerX + angleArcRadius} ${centerY} A ${angleArcRadius} ${angleArcRadius} 0 0 0 ${centerX + angleArcRadius * Math.cos(-targetAngle * Math.PI / 180)} ${centerY + angleArcRadius * Math.sin(-targetAngle * Math.PI / 180)}`} fill="none" stroke="#d32f2f" strokeWidth="3" opacity="0.8"/>
                                        )}
                                    </g>
                                ) : (
                                    <g>
                                        <line x1={centerX} y1={centerY} x2={centerX - radius - 30} y2={centerY} stroke="#bbdefb" strokeWidth="8" strokeLinecap="round" opacity="0.5"/>
                                        <line x1={centerX} y1={centerY} x2={centerX - radius - 25} y2={centerY} stroke="#1976d2" strokeWidth="3" />
                                        <text x={centerX - radius - 60} y={centerY + 5} fill="#1976d2" fontWeight="bold" fontSize="16">0°</text>
                                        {/* 直角显示优化 */}
                                        {targetAngle === 90 ? (
                                            <path d={`M ${centerX - 30} ${centerY} L ${centerX - 30} ${centerY - 30} L ${centerX} ${centerY - 30}`} fill="none" stroke="#1976d2" strokeWidth="3" opacity="0.8"/>
                                        ) : (
                                            <path d={`M ${centerX - angleArcRadius} ${centerY} A ${angleArcRadius} ${angleArcRadius} 0 0 1 ${centerX + angleArcRadius * Math.cos(-targetAngle * Math.PI / 180)} ${centerY + angleArcRadius * Math.sin(-targetAngle * Math.PI / 180)}`} fill="none" stroke="#1976d2" strokeWidth="3" opacity="0.8"/>
                                        )}
                                    </g>
                                )}

                                {gameState !== 'won' && (
                                    <CuteMonster type={monsterType} x={centerX + (radius + 25) * Math.cos(-targetAngle * Math.PI / 180)} y={centerY + (radius + 25) * Math.sin(-targetAngle * Math.PI / 180)} rotation={90 - targetAngle}/>
                                )}

                                {explosions.map(exp => {
                                    if (exp.type === 'particle') {
                                        return <circle key={exp.id} cx={exp.x} cy={exp.y} r={exp.size} fill={exp.color} className="anim-firework" style={{"--tx": exp.tx, "--ty": exp.ty}} />;
                                    } else if (exp.type === 'shockwave') {
                                        return <circle key={exp.id} cx={exp.x} cy={exp.y} r="0" fill="none" stroke="white" strokeWidth="4" className="anim-ring" />;
                                    }
                                    return null;
                                })}

                                <circle cx={centerX} cy={centerY} r="25" fill="#455a64" stroke="#37474f" strokeWidth="2"/>
                                <circle cx={centerX} cy={centerY} r="10" fill="#cfd8dc" />
                                <line 
                                    x1={centerX} 
                                    y1={centerY} 
                                    x2={centerX + (radius - 10) * Math.cos(-targetAngle * Math.PI / 180)} 
                                    y2={centerY + (radius - 10) * Math.sin(-targetAngle * Math.PI / 180)} 
                                    stroke="#455a64" 
                                    strokeWidth="2.5" 
                                    strokeDasharray="8 6" 
                                    opacity="0.8"
                                />
                                
                                {projectile && (<g><circle cx={projectile.x} cy={projectile.y} r="6" fill="#212121" /><circle cx={projectile.x-2} cy={projectile.y-2} r="2" fill="white" opacity="0.5" /></g>)}
                                
                                <text x={centerX} y={centerY - 80} textAnchor="middle" fill="#d32f2f" fontSize="14" opacity="0.3" fontWeight="bold">内圈 (红)</text>
                                <text x={centerX} y={centerY - 110} textAnchor="middle" fill="#1976d2" fontSize="14" opacity="0.3" fontWeight="bold">外圈 (蓝)</text>
                            </svg>
                            
                        </div>
                        
                        <div className="bg-gray-50 border-t border-gray-200 p-3 flex flex-wrap items-center justify-center gap-4 shrink-0">
                            {/* 难度设置 - 左侧新增 */}
                            <div className="flex flex-col items-start mr-2 gap-2">
                                <div>
                                    <label className="text-[10px] text-gray-500 font-bold mb-1 block">0刻度位置</label>
                                    <div className="flex bg-gray-200 rounded-lg p-1 gap-1">
                                        <button 
                                            onClick={() => setBaselineMode('left')}
                                            className={`px-2 py-1 rounded text-xs font-bold transition-all ${baselineMode === 'left' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                        >左</button>
                                        <button 
                                            onClick={() => setBaselineMode('random')}
                                            className={`px-2 py-1 rounded text-xs font-bold transition-all ${baselineMode === 'random' ? 'bg-white shadow text-green-600' : 'text-gray-500 hover:text-gray-700'}`}
                                        >随机</button>
                                        <button 
                                            onClick={() => setBaselineMode('right')}
                                            className={`px-2 py-1 rounded text-xs font-bold transition-all ${baselineMode === 'right' ? 'bg-white shadow text-red-600' : 'text-gray-500 hover:text-gray-700'}`}
                                        >右</button>
                                    </div>
                                </div>
                                <label className="flex items-center cursor-pointer select-none">
                                    <input 
                                        type="checkbox" 
                                        checked={isSimpleMode} 
                                        onChange={(e) => setIsSimpleMode(e.target.checked)}
                                        className="w-4 h-4 text-green-600 rounded focus:ring-green-500 border-gray-300"
                                    />
                                    <span className="ml-1 text-xs font-bold text-gray-600">简易模式 (5的倍数)</span>
                                </label>
                            </div>

                            <div className="flex flex-col items-end">
                                <span className={`text-xs font-bold ${baselineSide === 'right' ? 'text-red-600' : 'text-blue-600'}`}>
                                    {baselineSide === 'right' ? '红线在右 → 读内圈' : '蓝线在左 → 读外圈'}
                                </span>
                                <div className="text-gray-400 text-[10px] scale-90 origin-right">请输入度数</div>
                            </div>
                            
                            <form onSubmit={handleFire} className="flex items-center gap-2">
                                <div className="relative">
                                    <input 
                                        type="number" 
                                        value={inputVal}
                                        onChange={(e) => setInputVal(e.target.value)}
                                        className="w-24 h-12 text-center text-2xl font-black text-gray-700 bg-white border-2 border-gray-300 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-all shadow-inner"
                                        placeholder="?"
                                        min="0"
                                        max="180"
                                        autoFocus
                                        disabled={gameState === 'animation'}
                                    />
                                    <span className="absolute right-2 top-2 text-gray-400 font-bold">°</span>
                                </div>
                                
                                <button 
                                    type="submit"
                                    disabled={gameState === 'animation' || !inputVal}
                                    className={`h-12 px-6 rounded-xl font-bold text-lg text-white shadow-md flex items-center gap-2 transition-all transform active:scale-95
                                        ${gameState === 'animation' 
                                            ? 'bg-gray-300 cursor-not-allowed shadow-none' 
                                            : 'bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 hover:shadow-lg hover:-translate-y-0.5'}
                                    `}
                                >
                                    <IconTarget className="w-5 h-5 mr-2" />
                                    开炮
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProtractorGame />);
    </script>
</body>
</html>
