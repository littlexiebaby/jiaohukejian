<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸡兔同笼交互课件</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            background: linear-gradient(125deg, #fff5ee, #f1faf7 52%, #eff6fb);
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            color: #344f47; user-select: none; -webkit-user-select: none;
        }
        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        button, select { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #70bbb0; outline-offset: 2px; }
        button:disabled { cursor: default; opacity: .38; }
        .hidden, [hidden] { display: none !important; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        #course { display: flex; width: 100vw; height: 100vh; height: 100dvh; padding: 12px; gap: 12px; }
        .glass-panel { background: #ffffffc7; border: 1px solid #fff; border-radius: 24px; box-shadow: 0 8px 26px #375f4910; }
        #controls { --control-font: 22px; --action-height: 46px; flex-shrink: 0; width: clamp(200px, 26%, 300px); min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .control-title { margin: 0; font-size: 28px; line-height: 1.2; color: #345a4d; }
        .control-scroll { flex: 1; min-height: 0; overflow: hidden; gap: 12px; padding: 3px; margin: -3px; }
        .control-content { display: flex; flex-direction: column; gap: inherit; transform-origin: 0 0; }
        .control-section { flex-shrink: 0; }
        .section-label { display: block; margin-bottom: 8px; font-size: 19px; font-weight: bold; color: #687f75; line-height: 1.2; }
        .animal-selectors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .animal-selectors select { width: 100%; min-width: 0; height: 42px; padding: 4px 6px; border: 1px solid #d9e6df; border-radius: 12px; background: #fff; font-size: 19px; font-weight: bold; outline-offset: 1px; cursor: pointer; }
        .counters { padding: 5px 10px; border: 1px solid #e0ebe5; border-radius: 16px; background: #fff; }
        .counter-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; height: 48px; }
        .counter-row + .counter-row { border-top: 1px solid #edf2ef; }
        .counter-label { font-size: 19px; font-weight: bold; white-space: nowrap; }
        .number-stepper { display: grid; grid-template-columns: 30px 3ch 30px; align-items: center; justify-content: center; gap: 2px; font-size: 32px; }
        .number-stepper input { appearance: none; width: 100%; min-width: 0; margin: 0; padding: 0; border: 0; background: transparent; font: inherit; font-weight: bold; font-variant-numeric: tabular-nums; text-align: center; outline: none; pointer-events: none; }
        .number-stepper button { display: flex; justify-content: center; align-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 9px; font-size: 27px; font-family: Arial, sans-serif; background: #f3f7f4; color: #689285; transition: background .15s; }
        .number-stepper button:hover { background: #e5f2eb; }
        .number-stepper button:first-child { color: #c45f77; background: #fff0f3; }
        .action-group { display: grid; gap: 8px; }
        .action-btn { width: 100%; min-height: var(--action-height); padding: 7px 10px; border: 1px solid #d8e7e0; border-radius: 13px; font-size: var(--control-font); font-weight: bold; line-height: 1.15; background: #fff; transition: background .15s, border-color .15s; }
        .action-btn:hover { background: #f3f8f5; border-color: #b6d5c6; }
        .action-btn.chicken-action { background: #fff0f4; border-color: #f4cfda; color: #b95371; }
        .action-btn.chicken-action:hover { background: #ffe3eb; }
        .action-btn.rabbit-action { background: #eaf8f4; border-color: #c5e6dc; color: #258674; }
        .action-btn.rabbit-action:hover { background: #d9f2e9; }
        .random-action { min-height: 40px; background: #fff8e7; border-color: #f0e1b7; color: #937336; }
        .utility-grid { flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid #dfece4; }
        .utility-btn { min-width: 0; min-height: 40px; padding: 6px 4px; border: 1px solid #dfe9e3; border-radius: 11px; background: #fff; font-size: 20px; font-weight: bold; line-height: 1.1; }
        .utility-btn:hover { background: #edf7f1; }
        #btn-fullscreen { color: #288674; border-color: #c1ded2; }
        #annotation-controls { flex-shrink: 0; width: 100%; background: #fff; border: 1px solid #e0ebe5; border-radius: 14px; }
        #annotation-controls summary { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-height: 40px; padding: 8px 10px; font-size: 22px; font-weight: bold; cursor: pointer; list-style: none; }
        #annotation-controls summary::-webkit-details-marker { display: none; }
        .fold-label { font-size: 16px; color: #81978b; font-weight: normal; }
        #annotation-controls[open] .when-closed, #annotation-controls:not([open]) .when-open { display: none; }
        .annotation-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 10px 12px; }
        .annotation-tools, #color-picker, #width-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
        #color-picker, #width-picker { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .glass-btn { min-width: 0; min-height: 34px; padding: 4px 2px; border: 1px solid #dbe6df; border-radius: 8px; background: #fff; font-size: 18px; line-height: 1.2; }
        .glass-btn:hover { background: #f1f7f3; }
        .annotations-open .control-scroll { gap: 8px; }
        .annotations-open .control-title { font-size: 26px; }
        .annotations-open .animal-selectors select { height: 36px; font-size: 18px; }
        .annotations-open .counter-row { height: 42px; }
        .annotations-open .action-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .annotations-open .action-btn { min-height: 40px; padding: 6px 4px; font-size: 20px; white-space: nowrap; }
        .annotations-open .random-action { min-height: 36px; }
        .annotations-open .utility-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 8px; gap: 5px; }
        .annotations-open .utility-btn { min-height: 36px; font-size: 18px; padding: 5px 1px; white-space: nowrap; }
        .annotations-open .annotation-tools { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
        .annotations-open .annotation-body { padding: 3px 8px 10px; gap: 8px; }
        .annotations-open .glass-btn { min-height: 32px; white-space: nowrap; }
        .annotations-open #annotation-controls summary { min-height: 36px; font-size: 20px; padding: 7px 9px; }
        .ring-2 { outline: 2px solid currentColor; outline-offset: -1px; background: #edf7f1; }
        .opacity-70 { opacity: .75; } .opacity-50 { opacity: .65; } .opacity-100 { opacity: 1; }
        #stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; position: relative; }
        #data-panel { flex: 0 0 18%; display: flex; justify-content: center; align-items: center; min-width: 0; min-height: 0; padding: clamp(3px, .7vw, 10px); gap: clamp(4px, 1.2vw, 18px); font-size: var(--data-font-size, 32px); font-weight: bold; line-height: 1; overflow: hidden; }
        .data-item { display: flex; flex-shrink: 0; align-items: center; gap: .12em; white-space: nowrap; }
        .data-count { font-size: 1.5em; font-weight: bold; }
        #data-panel .head-svg { width: 1.45em; height: 1.45em; flex-shrink: 0; }
        .data-feet { padding-left: .35em; border-left: 2px solid #e1ece5; }
        .text-macaron-red { color: #db6b89; } .text-macaron-blue { color: #35b5a4; }
        .text-emerald-500 { color: #10b981; } .text-pink-500 { color: #e368a3; }
        .text-gray-500 { color: #858f92; } .data-remaining { color: #d97706; }
        #canvas { position: relative; flex: 1; width: 100%; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
        #foot-zone { position: absolute; pointer-events: none; border-top: 1px dashed #d7e4dd; border-radius: 0 0 20px 20px; background: #eaf5ef25; }
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; touch-action: none; border-radius: 24px; }
        .animal-head-container { position: absolute; width: 86.4px; height: 108px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 10; }
        .animal-leg { position: absolute; width: 60.72px; height: 55.2px; transform: translate(-50%, -50%); z-index: 20; cursor: grab; touch-action: none; filter: drop-shadow(0 4px 4px #00000014); }
        .animal-leg:active { cursor: grabbing; z-index: 100; }
        .virtual-leg { opacity: .8; }
        .leg-svg { width: 100%; height: 100%; pointer-events: none; }
        .head-svg { width: 75.6px; height: 75.6px; pointer-events: none; }
        .body-svg { width: 86.4px; height: 64.8px; margin-top: -21.6px; pointer-events: none; }
        .head-wrapper, .body-wrapper { display: flex; flex-shrink: 0; line-height: 0; }
        .animal-head-container svg { display: block; flex-shrink: 0; }
        .anim-fly { transition: top .1s ease-out, left .1s ease-out, transform .1s ease-out; }
        .anim-fly-slow { transition: top .7s ease-out, left .7s ease-out, transform .7s ease-out; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; background: #233b3259; }
        .help-dialog { width: min(620px, 100%); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); padding: 26px 30px; overflow-y: auto; border-radius: 22px; background: #fff; box-shadow: 0 20px 60px #1c493a29; }
        .help-dialog h2 { margin: 0 0 18px; font-size: 30px; color: #345a4d; }
        .help-dialog p { margin: 12px 0; font-size: 22px; line-height: 1.65; }
        .help-footer { display: flex; justify-content: flex-end; margin-top: 20px; }
        .help-footer button { min-width: 140px; min-height: 44px; border: 0; border-radius: 12px; background: #e1f3eb; color: #2d785f; font-size: 22px; font-weight: bold; }
        #notice { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3000; max-width: 90vw; padding: 12px 20px; border-radius: 12px; background: #345a4d; color: #fff; font-size: 20px; text-align: center; }
        @media (max-height: 600px), (max-width: 760px) {
            #course { padding: 6px; gap: 6px; } #stage { gap: 6px; }
            #controls { --control-font: 19px; --action-height: 38px; width: clamp(160px, 26%, 240px); padding: 10px; gap: 8px; }
            .control-title { font-size: 24px; } .control-scroll { gap: 8px; }
            .section-label { font-size: 17px; margin-bottom: 6px; }
            .animal-selectors { gap: 5px; } .animal-selectors select { height: 34px; font-size: 16px; padding: 3px; }
            .counter-row { height: 42px; } .counter-label { font-size: 17px; }
            .counters { padding: 3px 7px; } .number-stepper { grid-template-columns: 26px 3ch 26px; font-size: 28px; }
            .number-stepper button { width: 26px; height: 26px; font-size: 24px; }
            .random-action { min-height: 34px; }
            #annotation-controls summary { min-height: 34px; font-size: 19px; padding: 6px 8px; }
            .utility-grid { gap: 6px; padding-top: 8px; } .utility-btn { min-height: 34px; font-size: 18px; }
            .glass-btn { font-size: 17px; min-height: 32px; }
        }
        @media (max-width: 450px) and (orientation: landscape) {
            #controls { width: 33%; padding: 6px; }
            .control-title { font-size: 19px; }
            .animal-selectors { grid-template-columns: 1fr; }
            .number-stepper { grid-template-columns: 18px 3ch 18px; font-size: 22px; }
            .number-stepper button { width: 18px; height: 22px; font-size: 20px; }
            .counter-row { flex-direction: column; justify-content: center; height: 56px; gap: 0; }
            .counter-label { font-size: 16px; } .utility-btn { font-size: 16px; }
        }
        @media (max-width: 700px) and (orientation: portrait) {
            #course { position: fixed; top: 0; left: 100%; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: 0 0; }
            #controls { width: 26%; }
            .help-dialog { padding: 20px; }
            .help-dialog p { font-size: 20px; }
        }
        @media (max-height: 450px), (max-width: 700px) and (orientation: portrait) {
            #controls { --control-font: 18px; --action-height: 34px; padding: 8px; gap: 8px; }
            .control-title { font-size: 22px; } .control-scroll { gap: 6px; }
            .section-label { display: none; }
            .animal-selectors select { height: 32px; font-size: 16px; }
            .counters { padding: 3px 5px; } .counter-row { height: 34px; gap: 4px; }
            .counter-label { font-size: 15px; }
            .number-stepper { grid-template-columns: 20px 3ch 20px; font-size: 24px; }
            .number-stepper button { width: 20px; height: 24px; font-size: 20px; }
            .action-group { gap: 6px; } .random-action { min-height: 32px; }
            #annotation-controls summary { min-height: 32px; font-size: 18px; padding: 6px; }
            .utility-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-top: 8px; }
            .utility-btn, .annotations-open .utility-btn { min-height: 32px; padding: 4px 0; font-size: 15px; }
            .annotations-open .control-title { font-size: 22px; }
            .annotations-open .control-content { gap: 6px; }
            .annotations-open .animal-selectors select { height: 30px; font-size: 16px; }
            .annotations-open .counters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; gap: 4px; }
            .annotations-open .counter-row { flex-direction: column; justify-content: center; height: 50px; gap: 0; }
            .annotations-open .counter-row + .counter-row { border-top: 0; border-left: 1px solid #edf2ef; }
            .annotations-open .number-stepper { grid-template-columns: 16px 3ch 16px; font-size: 20px; }
            .annotations-open .number-stepper button { width: 16px; height: 20px; font-size: 18px; }
            .annotations-open .action-btn { min-height: 32px; font-size: 17px; padding: 4px 2px; }
            .annotations-open #annotation-controls summary { min-height: 30px; font-size: 18px; padding: 6px; }
            .annotations-open .annotation-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 2px 6px 8px; }
            .annotations-open .annotation-tools { grid-column: 1 / -1; gap: 4px; }
            .annotations-open #color-picker, .annotations-open #width-picker { gap: 3px; }
            .annotations-open .glass-btn { min-height: 28px; font-size: 16px; padding: 2px 0; }
        }
        @media (max-width: 450px) and (orientation: landscape) {
            .annotations-open .utility-grid, .utility-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .annotations-open .utility-btn { font-size: 16px; }
        }
</style>
</head>
<body>
    <main id="course">
        <aside id="controls" class="glass-panel" aria-label="控制区">
            <h1 class="control-title">鸡兔同笼</h1>
            <div class="control-scroll"><div class="control-content">
                <section class="control-section">
                    <span class="section-label">动物选择</span>
                    <div class="animal-selectors">
                        <select id="select-animal1" aria-label="第一种动物" onchange="changeAnimals()">
                            <option value="chicken" selected>鸡</option><option value="rabbit">兔</option><option value="ant">蚂蚁</option><option value="octopus">章鱼</option>
                        </select>
                        <select id="select-animal2" aria-label="第二种动物" onchange="changeAnimals()">
                            <option value="chicken">鸡</option><option value="rabbit" selected>兔</option><option value="ant">蚂蚁</option><option value="octopus">章鱼</option>
                        </select>
                    </div>
                </section>
                <section class="control-section counters">
                    <div class="counter-row"><span class="counter-label">总头数</span><div class="number-stepper">
                        <button aria-label="减少总头数" onclick="changeHeads(-1)">−</button>
                        <input id="input-heads" aria-label="总头数" type="text" inputmode="numeric" readonly value="8">
                        <button aria-label="增加总头数" onclick="changeHeads(1)">+</button>
                    </div></div>
                    <div class="counter-row"><span class="counter-label">总脚数</span><div class="number-stepper">
                        <button aria-label="减少总脚数" onclick="changeLegs(-2)">−</button>
                        <input id="input-legs" aria-label="总脚数" type="text" inputmode="numeric" readonly value="26">
                        <button aria-label="增加总脚数" onclick="changeLegs(2)">+</button>
                    </div></div>
                </section>
                <div class="control-section action-group">
                    <button id="btn-add-1" onclick="animateAddLegs(1)" class="action-btn chicken-action">各装2只脚</button>
                    <button id="btn-add-2" onclick="animateAddLegs(2)" class="action-btn rabbit-action">各装4只脚</button>
                </div>
                <button onclick="generateRandomProblem()" class="control-section action-btn random-action">随机出题</button>
                <details id="annotation-controls">
                    <summary>批注<span class="fold-label"><span class="when-closed">展开</span><span class="when-open">收起</span></span></summary>
                    <div class="annotation-body">
                        <div class="annotation-tools">
                            <button id="tool-cursor" onclick="selectTool('cursor')" class="glass-btn ring-2" aria-pressed="true">拖拽</button>
                            <button id="tool-pen" onclick="selectTool('pen')" class="glass-btn opacity-70" aria-pressed="false">画笔</button>
                            <button id="tool-eraser" onclick="selectTool('eraser')" class="glass-btn opacity-70" aria-pressed="false">橡皮</button>
                            <button onclick="clearCanvas()" class="glass-btn">清空</button>
                        </div>
                        <div id="color-picker" class="hidden">
                            <button onclick="selectColor('#EF4444', this)" style="color:#EF4444" class="glass-btn color-btn ring-2" aria-label="红色">红</button>
                            <button onclick="selectColor('#3B82F6', this)" style="color:#3B82F6" class="glass-btn color-btn" aria-label="蓝色">蓝</button>
                            <button onclick="selectColor('#10B981', this)" style="color:#10B981" class="glass-btn color-btn" aria-label="绿色">绿</button>
                        </div>
                        <div id="width-picker" class="hidden">
                            <button onclick="selectWidth(3, this)" class="glass-btn width-btn opacity-50">细</button>
                            <button onclick="selectWidth(8, this)" class="glass-btn width-btn opacity-100 ring-2">中</button>
                            <button onclick="selectWidth(16, this)" class="glass-btn width-btn opacity-50">粗</button>
                        </div>
                    </div>
                </details>
            </div></div>
            <div class="utility-grid">
                <button id="btn-undo" onclick="undoAction()" class="utility-btn" disabled>撤销</button>
                <button onclick="resetProblem()" class="utility-btn">重置</button>
                <button id="btn-fullscreen" onclick="toggleFullscreen()" class="utility-btn" aria-pressed="false">全屏</button>
                <button id="btn-help" onclick="showHelp()" class="utility-btn" aria-haspopup="dialog">说明</button>
            </div>
        </aside>
        <section id="stage" aria-label="展示区">
            <div id="data-panel" class="glass-panel" aria-live="polite"></div>
            <div id="canvas" class="glass-panel"></div>
            <canvas id="draw-layer" class="pointer-events-none"></canvas>
        </section>
    </main>
    <div id="help-modal" class="modal-backdrop" hidden>
        <section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
            <h2 id="help-title">课件说明</h2>
            <p>设置动物种类、总头数和总脚数，也可以点击“随机出题”。</p>
            <p>每对脚有2只。把脚拖到身体下方，或点击“各装”按钮自动装脚。脚数符合所选动物时，就会显示对应的动物。</p>
            <p>实线脚来自题目，虚线脚表示借用。观察上方的“余”和“借”，思考怎样调整。</p>
            <p>“撤销”返回上一步，包括批注。“重置”恢复8个头、26只脚的鸡兔题目。展开“批注”可以画写、擦除和清空，“全屏”方便课堂展示。</p>
            <div class="help-footer"><button id="btn-close-help" onclick="hideHelp()">知道了</button></div>
        </section>
    </div>
