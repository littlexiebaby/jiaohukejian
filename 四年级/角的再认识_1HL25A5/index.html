<div class="modal-shade" id="helpModal" hidden><section class="modal help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><button class="close" id="closeHelp" aria-label="关闭说明">×</button><h2 id="helpTitle">课件说明</h2><div class="help-list">
<p><strong>画角</strong>点出顶点，再依次拖出两条边。</p>
<p><strong>调角</strong>拖边转动，拖末端伸缩，拖顶点移动。</p>
<p><strong>量角器</strong>整体可拖，外沿可转。中心对顶点，0°线对边。</p>
<p><strong>按度数画角</strong>画射线 → 对准 → 标点 → 拖线经过标点。</p>
<p><strong>角的分类</strong>“转一转”观察，“分一分”作答。</p>
<p><strong>双人对战</strong>设分数和倍数后开始，各用各的键盘。点击结束可重新设置。</p>
</div></section></div>
