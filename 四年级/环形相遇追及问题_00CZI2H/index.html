<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环形跑道追及相遇问题</title>
    <script src="_site/math/daohang/ku/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macaron: { 
                            pink: '#FFB6C1', blue: '#40E0D0', green: '#98FB98', 
                            yellow: '#FFFACD', purple: '#E6E6FA', red: '#FF6B81', gray: '#F0F4F8'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.1)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.5)'
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.1);
        }
        
        .glass-button { transition: all 0.2s ease; }
        .glass-button:active { transform: scale(0.95); }
        .glass-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .drag-ghost {
            position: fixed; pointer-events: none; z-index: 1000; opacity: 0.9;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.3)); display: flex;
            align-items: center; justify-content: center;
        }

        body {
            background: linear-gradient(135deg, #E6E6FA 0%, #FFB6C1 50%, #40E0D0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        input[type="range"] { accent-color: #FF6B81; }

        /* 跑步精细动画 CSS */
        @keyframes anim-run-leg-l { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(45deg); } }
        @keyframes anim-run-leg-r { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(-45deg); } }
        @keyframes anim-run-arm-l { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(-45deg); } }
        @keyframes anim-run-arm-r { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(45deg); } }
        @keyframes anim-bounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        @keyframes anim-pigtail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }

        .is-running .anim-leg-l { animation: anim-run-leg-l var(--run-speed, 0.4s) infinite ease-in-out; }
        .is-running .anim-leg-r { animation: anim-run-leg-r var(--run-speed, 0.4s) infinite ease-in-out; }
        .is-running .anim-arm-l { animation: anim-run-arm-l var(--run-speed, 0.4s) infinite ease-in-out; }
        .is-running .anim-arm-r { animation: anim-run-arm-r var(--run-speed, 0.4s) infinite ease-in-out; }
        .is-running .character-wrap { animation: anim-bounce calc(var(--run-speed, 0.4s) / 2) infinite ease-in-out; }
        .is-running .anim-pigtail-l { animation: anim-pigtail calc(var(--run-speed, 0.4s) / 2) infinite ease-in-out; }
        .is-running .anim-pigtail-r { animation: anim-pigtail calc(var(--run-speed, 0.4s) / 2) infinite ease-in-out reverse; }
    </style>
</head>
<body class="w-screen h-[100dvh] flex flex-row p-2 pb-[5px] gap-2 box-border">

    <!-- 控制区 (左侧占20%) -->
    <div class="w-[20%] min-w-[210px] h-full glass-panel rounded-2xl p-3 flex flex-col relative shrink-0">
        <div class="flex-1 flex flex-col gap-3 h-full overflow-y-auto hide-scroll pb-2">
            
            <!-- 跑道形状设置 -->
            <div class="flex flex-col gap-2 bg-white/60 p-3 rounded-xl border border-indigo-100 shadow-sm shrink-0">
                <label class="text-sm font-bold text-indigo-800 flex items-center gap-1">🏟️ 跑道定制</label>
                <!-- 跑道形态切换器 -->
                <div class="flex items-center bg-indigo-100/60 rounded-full p-1 cursor-pointer w-full border border-indigo-200 shadow-inner relative" id="shape-toggle">

                </div>

                <!-- 圆形参数区 -->

                </div>
            </div>

            <!-- 👦 小明控制面板 -->
            <div class="flex flex-col gap-2 bg-white/60 p-3 rounded-xl border border-teal-100 shadow-sm shrink-0">
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-bold text-teal-800">👦 速度: <span id="boy-speed-val" class="text-teal-600">80</span></label>

                </div>
                <div class="flex flex-col gap-1.5 mt-1">
                    <label class="text-sm font-bold text-teal-800">起点位置(米): <span id="boy-start-val" class="text-teal-600">0</span></label>
                    <input type="range" id="boy-start" min="0" max="400" step="5" value="0" list="tens-snap" class="w-full h-1.5 cursor-pointer" oninput="document.getElementById('boy-start-val').innerText = this.value; applyStartPositions();">
                </div>
                <div class="flex flex-col gap-1.5 mt-1">
                    <div class="flex items-center bg-teal-100/60 rounded-full p-1 cursor-pointer w-full border border-teal-200 shadow-inner relative" id="boy-dir-toggle">
                        <div class="w-1/2 text-center text-xs font-bold py-1.5 rounded-full bg-teal-500 text-white shadow-sm transition-all z-10" data-val="1">顺时针 ↻</div>
                        <div class="w-1/2 text-center text-xs font-bold py-1.5 rounded-full text-teal-700 hover:bg-teal-200/50 transition-all z-10" data-val="-1">逆时针 ↺</div>
                        <input type="hidden" id="boy-dir" value="1">
                    </div>
                </div>
            </div>

            <!-- 👧 小红控制面板 -->
            <div class="flex flex-col gap-2 bg-white/60 p-3 rounded-xl border border-pink-100 shadow-sm shrink-0">
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-bold text-pink-800">👧 速度: <span id="girl-speed-val" class="text-pink-600">60</span></label>
                    <input type="range" id="girl-speed" min="5" max="200" step="5" value="60" list="tens-snap" class="w-full h-1.5 cursor-pointer" oninput="document.getElementById('girl-speed-val').innerText = this.value">
                </div>
                <div class="flex flex-col gap-1.5 mt-1">
                    <label class="text-sm font-bold text-pink-800">起点位置(米): <span id="girl-start-val" class="text-pink-600">0</span></label>
                    <input type="range" id="girl-start" min="0" max="400" step="5" value="0" list="tens-snap" class="w-full h-1.5 cursor-pointer" oninput="document.getElementById('girl-start-val').innerText = this.value; applyStartPositions();">
                </div>
                <div class="flex flex-col gap-1.5 mt-1">
                    <div class="flex items-center bg-pink-100/60 rounded-full p-1 cursor-pointer w-full border border-pink-200 shadow-inner relative" id="girl-dir-toggle">
                        <div class="w-1/2 text-center text-xs font-bold py-1.5 rounded-full text-pink-700 hover:bg-pink-200/50 transition-all z-10" data-val="1">顺时针 ↻</div>
                        <div class="w-1/2 text-center text-xs font-bold py-1.5 rounded-full bg-pink-500 text-white shadow-sm transition-all z-10" data-val="-1">逆时针 ↺</div>
                        <input type="hidden" id="girl-dir" value="-1">
                    </div>
                </div>
            </div>

            <!-- 动作按钮组 (控制区仅保留重置按钮，置于底部) -->
            <div class="flex flex-col gap-2 mt-auto shrink-0 pt-2">
                <button id="btn-reset" class="glass-button bg-macaron-red hover:bg-red-300 text-red-900 font-bold py-3 rounded-xl shadow-md border border-white text-lg">🔄 停止重置</button>
            </div>
        </div>
    </div>

    <!-- 展示区 (右侧) -->
    <div id="display-area" class="flex-1 flex flex-col min-w-0 h-full gap-2 relative">
        <!-- 1. 主跑道与路程分析合并区 -->
        <div class="flex-[2] shrink-0 glass-panel rounded-2xl relative overflow-hidden flex items-center justify-center p-2 min-h-[45%] shadow-sm">
            
            <div id="main-view" class="w-full h-full transition-all duration-700 relative">
                <div class="absolute top-3 left-4 bg-white/90 px-4 py-2 rounded-full shadow-sm text-sm font-bold text-gray-700 z-10 border-2 border-white">

                </div>
                <div class="absolute top-3 right-4 bg-white/90 px-4 py-2 rounded-full shadow-sm text-sm font-bold text-gray-700 z-10 border-2 border-white">

                <!-- 跑步控制按钮位于主屏左下角 -->
                <div class="absolute bottom-4 left-4 flex gap-3 z-30">
                    <button id="btn-start" class="glass-button bg-macaron-green hover:bg-green-300 text-green-900 font-bold px-6 py-3 rounded-full shadow-md border-2 border-white text-lg">▶ 开始跑步</button>
                    <button id="btn-pause" class="glass-button bg-macaron-yellow hover:bg-yellow-300 text-yellow-900 font-bold px-6 py-3 rounded-full shadow-md border-2 border-white hidden text-lg">⏸ 暂停</button>
                </div>

                <div class="svg-container w-full h-full" id="svg-wrapper">
                    <svg id="track-svg" width="100%" height="100%" viewBox="0 -60 1000 560" preserveAspectRatio="xMidYMid meet">
                        <!-- 动态草坪外围背景 -->
                        <path id="track-bg-grass" fill="#98FB98" opacity="0.3" stroke="none" />

                        <path id="track-surface" fill="none" stroke="#F28C8C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
                        
                        <!-- 用于人物路径吸附的隐形层 -->
                        <path id="track-path-hidden" fill="none" stroke="transparent" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
                        
                        <!-- 动态虚线辅助线 -->

                        <!-- 卡通人物，放大100% -->

                                        <path class="anim-arm-r" d="M 50 65 L 65 85" stroke="#FFDAB9" stroke-width="9" stroke-linecap="round" transform-origin="50 65"/>
                                    </g>
                                </svg>
                            </g>
                        </g>
                        <g id="girl-pos">
                            <g id="girl-scale">
                                <svg id="girl-avatar" x="-60" y="-150" width="120" height="160" viewBox="0 0 100 120" class="overflow-visible drop-shadow-md">
                                    <g class="character-wrap">
                                        <path class="anim-arm-l" d="M 50 65 L 35 85" stroke="#FFE4E1" stroke-width="8" stroke-linecap="round" transform-origin="50 65"/>
                                        <path class="anim-leg-l" d="M 50 85 L 40 115" stroke="#9B59B6" stroke-width="10" stroke-linecap="round" transform-origin="50 85"/>
                                        <path d="M 40 55 L 60 55 L 75 92 L 25 92 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="3" stroke-linejoin="round"/>
                                        <g transform-origin="50 55">
                                            <circle cx="50" cy="35" r="22" fill="#FFE4E1"/>
                                            <path class="anim-pigtail-l" d="M 30 30 Q 15 20 18 50" fill="none" stroke="#FFD700" stroke-width="10" stroke-linecap="round" transform-origin="30 30"/>
                                            <path class="anim-pigtail-r" d="M 70 30 Q 85 20 82 50" fill="none" stroke="#FFD700" stroke-width="10" stroke-linecap="round" transform-origin="70 30"/>
                                            <path d="M 28 35 C 28 5 72 5 72 35 C 68 15 32 15 28 35 Z" fill="#FFD700"/>
                                            <circle cx="60" cy="32" r="3" fill="#333"/>
                                            <circle cx="48" cy="32" r="3" fill="#333"/>
                                            <path d="M 52 42 Q 55 46 58 42" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

                                    </g>
                                </svg>
                            </g>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- 路程分析区浮层 -->
            <div id="calc-area-overlay" class="absolute inset-1 z-30 hidden flex-col items-center justify-center bg-white/60 backdrop-blur-[6px] rounded-2xl border-[4px] border-macaron-yellow border-dashed shadow-2xl transition-all duration-300">

    <!-- 弹窗提示区 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="glass-panel bg-white/95 p-8 rounded-3xl max-w-sm w-full text-center transform scale-95 transition-transform duration-300 shadow-2xl border-4 border-white" id="modal-box">
            <div id="modal-icon" class="text-7xl mb-4 drop-shadow-md">🎉</div>

                知道啦

        </div>

    <!-- 注入：用于滑块整十数吸附的隐形数据列表 -->
