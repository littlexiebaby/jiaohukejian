<body>
<div id="app">
  <header class="header"><h1>多边形面积</h1><div class="utilities">
    <button data-action="help" data-icon="info">说明</button><button data-action="annotate" id="annotateBtn" data-icon="pen">批注</button><button data-action="undo" id="undoBtn" data-icon="undo">撤销</button><button data-action="redo" id="redoBtn" data-icon="redo">重做</button><button data-action="reset" data-icon="reset">重置</button><button data-action="fullscreen" id="fullscreenBtn" data-icon="fullscreen">全屏</button>
  </div></header>
  <main class="workspace"><section class="stage" id="stage">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" aria-label="多边形探究画布"></svg>
    <div class="action-shelf"><button class="object-action" data-action="copy" data-icon="copy">复制</button><button class="object-action" data-action="left" data-icon="left">左转</button><button class="object-action" data-action="right" data-icon="right">右转</button><button class="object-action" data-action="flipH" data-icon="flipH">水平翻转</button><button class="object-action" data-action="flipV" data-icon="flipV">垂直翻转</button><button class="object-action danger" data-action="delete" data-icon="delete">删除</button></div>
  </section><aside class="inspector"><div class="shape-controls"><button class="shape-add" data-shape="parallelogram" data-icon="parallelogram">平行四边形</button><button class="shape-add" data-shape="triangle" data-icon="triangle">三角形</button><button class="shape-add" data-shape="trapezoid" data-icon="trapezoid">梯形</button></div><div class="tool-rail"><button data-tool="move" class="active" id="moveBtn" data-icon="move">移动</button><button data-tool="cut" id="cutBtn" data-icon="cut">切割</button><button data-tool="height" id="heightBtn" data-icon="height">画高</button></div><div class="button-set view-controls"><button id="gridBtn" data-action="grid" data-icon="grid" class="active">网格</button><button id="blocksBtn" data-action="blocks" data-icon="blocks">格块</button><button id="yingxuBtn" data-action="yingxu" data-icon="ghost">盈虚</button></div><h2 id="inspectorTitle">图形参数</h2><div class="parameter-area" id="parameters"></div>
  <div class="color-palette" id="palette"></div><div class="button-set capture-controls"><button class="primary" id="photoBtn" data-action="photo" data-icon="camera">拍照</button><button data-action="compare" data-icon="compare">对比<span class="compare-count" id="photoCount">0</span></button></div><div class="inspector-foot"><button data-action="clearHeights" data-icon="height">清高线</button><button data-action="clear" class="danger" data-icon="clear">清空</button></div></aside></main>
  <div class="ink-bar" id="inkBar"><button data-inkmode="pen" class="active" id="penBtn">画笔</button><button data-inkmode="eraser" id="eraserBtn">橡皮</button><button class="ink-color" data-inkcolor="#f4475b" style="background:#f4475b" aria-label="红笔"></button><button class="ink-color" data-inkcolor="#246bff" style="background:#246bff" aria-label="蓝笔"></button><button class="ink-color" data-inkcolor="#a33fe4" style="background:#a33fe4" aria-label="紫笔"></button><input class="ink-width" id="inkWidth" type="range" min="2" max="7" value="4" aria-label="笔宽"><button data-action="clearInk">清笔迹</button><button data-action="exitInk">完成</button></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="shade" id="exportModal"><div class="export-box"><div class="export-head"><span>长按图片保存</span><button data-action="closeExport" data-icon="close">返回</button></div><img id="exportImage" class="export-image" alt="可长按保存的图片"></div></div>
  <div class="shade" id="helpModal"><div class="help-box"><h2>课件说明</h2><p>点击右侧图形可添加。拖动图形平移，拖动顶点变形，拖动圆形手柄旋转。</p><p>平行四边形拖点时四边长度不变；参数面板可调整底和高。三角形靠近等边、直角时吸附，梯形上底可合并成顶点。</p><p>选择“切割”后划线段，两端须到达图形边界或外侧。切成功自动回到移动，切空可继续切。</p><p>“格块”可拆成网格小块，再次点击还原整图。“盈虚”显示移走的实块为盈、原位置虚影为虚。</p><p>“画高”从顶点或边上拖向另一条边。批注可用三色画笔；拍照后进入对比，也能自由批注并保存图片。</p><div class="close-row"><button class="primary" data-action="closeHelp">知道了</button></div></div></div>
