 <header><h1>阴影部分周长</h1><div class="utilities"><button id="helpBtn">说明</button><button id="penBtn">批注</button><button id="undoBtn" disabled>撤销</button><button id="resetBtn">重置</button><button id="fullBtn">全屏</button></div></header>
 <div class="body">
  <aside class="rail"><div class="rail-title">题目</div><nav class="questions" id="questionNav" aria-label="选择题目"></nav><div class="bank-pages"><button id="bankPrevBtn" aria-label="上一页题目">上页</button><span id="bankPage"></span><button id="bankNextBtn" aria-label="下一页题目">下页</button></div><div class="legend"><span><i></i>圆弧</span><span><i class="blue"></i>线段</span></div></aside>
  <main>
   <div class="question-head"><h2 id="questionTitle"></h2><div class="head-actions"><button id="cutBtn" hidden>对折剪开</button><button id="dataBtn" aria-pressed="false">显示数据</button><button id="randomBtn">随机出题</button></div></div>
    <div class="board-wrap"><svg id="board" viewBox="0 0 1120 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="沿边界描出圆弧或线段，再拖动、旋转和拼接"><g id="sourceLayer"></g><g id="auxLayer"></g><g id="traceLayer"></g><g id="pieceLayer"></g><g id="dimensionLayer"></g><g id="handleLayer"></g><g id="snapLayer"></g><g id="gestureLayer"></g><g id="inkLayer"></g></svg><div id="angleBadge"></div></div>
   <div class="footer"><div class="tools"><button id="selectAllBtn">全部选边</button><button id="rotateBtn" disabled>旋转</button><button id="flipBtn" disabled>翻面</button><button id="homeBtn" disabled>归位</button><button id="demoBtn" class="primary">一键演示</button></div><label class="demo-progress" title="拖动可暂停并查看演示的任意一步"><span class="progress-label">演示进度</span><input id="demoProgress" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="一键演示进度"><output id="demoProgressValue" for="demoProgress">0%</output></label><div class="paging"><button id="prevBtn">上一题</button><button id="nextBtn">下一题</button></div></div>
  </main>
 </div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="penbar"><button class="pen-color active" data-color="#f34473" style="background:#f34473" aria-label="粉红色批注"></button><button class="pen-color" data-color="#f2aa18" style="background:#f2aa18" aria-label="金黄色批注"></button><button class="pen-color" data-color="#8c53ee" style="background:#8c53ee" aria-label="紫色批注"></button><button id="inkUndoBtn" class="text">撤笔</button><button id="inkClearBtn" class="text">清空</button><button id="penDoneBtn" class="text">完成</button></div>
 <div id="helpModal" class="modal-shade" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="modal"><h3 id="helpTitle">课件说明</h3><p>沿边界描边会自动吸附：圆弧变红，线段变蓝；轻点不会选边。</p><p>每笔描同一圆或同一直线。圆弧可描四分之一圆、半圆或整圆，松手后吸附到完整部分。</p><p>拖动已描好的边可拼接；拖旋转柄可转圈，点击端点可设为旋转中心。</p><p>“旋转”每次转45°，“翻面”翻转当前边。“归位”平滑放回当前边，演示后可全部归位。</p><p>拖动演示进度滑块可暂停查看中间过程，再次点击“一键演示”会从头播放。</p><p>“随机出题”更换数据并显示数据。“重置”恢复当前题的原始数据和图形。</p><button id="closeHelpBtn" class="primary">开始操作</button></div></div>
</div>
