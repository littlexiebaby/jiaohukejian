<main id="stage" aria-label="认识立体图形互动课件">
  <header class="header">
    <h1 class="title">认识立体图形</h1>
    <nav class="tools" aria-label="课件工具">
      <button class="tool" id="helpBtn"><span data-icon="info"></span>说明</button>
      <button class="tool" id="penBtn" aria-pressed="false"><span data-icon="pen"></span>批注</button>
      <button class="tool" id="undoBtn"><span data-icon="undo"></span>撤销</button>
      <button class="tool" id="resetBtn"><span data-icon="reset"></span>重置</button>
      <button class="tool" id="fullBtn"><span data-icon="full"></span><span id="fullLabel">全屏</span></button>
    </nav>
    <nav class="steps" aria-label="学习步骤">
      <button id="sortStep" class="step active">分一分</button>
      <button id="abstractStep" class="step">变一变</button>
      <button id="observeStep" class="step">看一看</button>
      <button id="practiceStep" class="step">练一练</button>
    </nav>
  </header>
  <section id="sortView" aria-label="自由分类">
    <div class="zones" id="zones"></div>
    <div class="action-row"><p class="hint">拖一拖，分一分</p><button class="primary" id="finishBtn">分好了</button></div>
    <div id="objectTray" class="object-tray" aria-label="待分类物品"></div>
  </section>
  <section id="abstractView" aria-label="逐件抽象">
    <div class="abstract-panel"><h2 class="abstract-title" id="abstractTitle"></h2><div class="abstract-grid" id="abstractGrid"></div></div>
    <nav class="group-nav" id="groupNav" aria-label="选择分类组"></nav>
    <div class="abstract-footer"><button class="secondary" id="backSortBtn">返回分类</button><p class="hint" id="abstractHint">点一点，变一变</p><button class="primary" id="nextGroupBtn">下一组</button></div>
  </section>
  <section id="practiceView" aria-label="立体图形收集大赛"></section>
  <div id="helpOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="dialog help-dialog"><h2 class="dialog-title" id="helpTitle">课件说明</h2>
      <p>分一分：把下方物品拖入上方四个区域。可以分成2～4组，空着的区域不用管。物品可以拖回，也可以换组。</p>
      <p>变一变：点击“分好了”，选一组，逐件点击物品，看看它们变成什么立体图形。</p>
      <p>看一看：再点已经变好的图形，放大观察。拖动可以自由旋转，点面可以编号；同一个面重复点击不重复数。</p>
      <p>先描黑线，再填中性色。数面时，点到的面才着色，相同形状、相同大小的面同色。圆柱和球观察平面、曲面。</p>
      <p>右上角可批注、撤销、重置和全屏。批注可选3种颜色，支持撤笔和清空。</p>
      <button class="primary" data-close="helpOverlay">知道了</button>
    </div>
  </div>
  <div id="modelOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
    <div class="dialog model-dialog"><h2 class="dialog-title" id="modelTitle"></h2><button class="close-top" id="closeModelTop" aria-label="关闭观察"><span data-icon="close"></span></button>
      <div class="model-viewport" id="modelViewport"></div>
      <aside class="observation" id="observation"></aside>
      <div class="model-footer"><button class="secondary" id="zoomInBtn">放大</button><button class="secondary" id="zoomOutBtn">缩小</button><button class="secondary" id="homeModelBtn">复位</button><button class="secondary" id="clearFacesBtn">清除编号</button><span class="model-tip">拖动旋转 · 点面编号</span><button class="primary" id="closeModelBtn">返回</button></div>
    </div>
  </div>
  <div id="resetOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="重新开始"><div class="dialog reset-dialog"><p>重新开始分一分？</p><div class="confirm-buttons"><button class="secondary" data-close="resetOverlay">继续学习</button><button class="primary" id="confirmResetBtn">重新开始</button></div></div></div>
  <canvas id="inkCanvas" width="1600" height="900" aria-label="批注画布"></canvas>
  <div id="penTools" class="pen-tools"><button class="pen-color active" style="--pen:#f23d64" data-color="#f23d64" aria-label="玫红色批注"></button><button class="pen-color" style="--pen:#0b9dff" data-color="#0b9dff" aria-label="亮蓝色批注"></button><button class="pen-color" style="--pen:#f1a900" data-color="#f1a900" aria-label="金黄色批注"></button><button class="pen-action" id="inkUndoBtn">撤笔</button><button class="pen-action" id="inkClearBtn">清空</button><button class="pen-action" id="penDoneBtn">完成</button></div>
  <div id="toast" role="status" aria-live="polite"></div>
