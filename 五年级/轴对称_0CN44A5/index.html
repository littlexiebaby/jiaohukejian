<main class="app" id="app">
 <header class="header"><h1>轴对称</h1><div class="utilities">
 <button id="helpBtn">说明</button>
 <button id="penBtn">批注</button>
 <button id="undoBtn">撤销</button>
 <button id="resetBtn">重置</button>
 <button id="fullBtn"><span>全屏</span></button>
 </div></header>
 <section class="workspace">
 <div class="board-wrap"><svg id="board" class="board" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" aria-label="轴对称方格操作区"><g id="gridLayer"></g><g id="shapeLayer"></g><g id="axisLayer" pointer-events="none"></g><g id="helperLayer" pointer-events="none"></g><g id="answerLayer"></g><g id="linePreviewLayer" pointer-events="none"></g><g id="foldLayer" pointer-events="none"></g><g id="handleLayer"></g></svg><div id="boardNote" class="board-note"></div><div class="board-legend"><span><i class="dot"></i>原图</span><span><i class="dot answer"></i><b id="answerLegend" style="font-weight:normal">作答</b></span></div></div>
 <aside class="rail">
 <nav class="nav" aria-label="题目分类"><button data-group="book" class="active">教材例题</button><button data-group="extra">拓展练习</button><button data-group="custom">自定义</button><div class="select-wrap"><select id="lessonSelect" aria-label="切换题目"></select><button id="randomBtn" class="hidden">换一题</button></div></nav>
 <h2 id="taskTitle">补全轴对称图形</h2><p id="taskNote" class="task-note">找对应点，再连起来。</p>
 <div id="solveTools" class="tools"><button data-tool="point" class="active">找点</button><button data-tool="line">连线</button></div>
 <div id="customBlock" class="custom-block hidden"><div class="custom-stage"><button data-edit="axis">设置轴</button><button data-edit="draw">画图</button></div><select id="axisSelect" aria-label="对称轴方向"></select><p id="editTip" class="edit-tip"></p><div class="secondary-row"><button id="closeShapeBtn">闭合图形</button><button id="deleteVertexBtn">删除点</button></div><div id="invalidNote" class="invalid-note"></div></div>
 <div id="toggleBlock" class="toggles"><label class="toggle">辅助垂线<input id="helperToggle" type="checkbox" checked><span class="switch"></span></label><label class="toggle">显示距离<input id="distanceToggle" type="checkbox"><span class="switch"></span></label></div>
 <div id="pointArea" class="point-area"><div class="point-heading"><span>待找点</span><span id="selectedLetter" class="selected-letter">—</span></div><div id="pointChips" class="point-chips"></div><select id="pointSelect" aria-label="选择待画的对应点" class="hidden" style="width:100%;font-size:17px;min-height:27px;padding:3px 7px"></select></div>
 <div id="judgeBlock" class="judge-block hidden"><div class="fill-row"><span>点 A 到轴</span><span><button data-fill="A" class="num-field" aria-label="填写点A到轴的格数">?</button> 格</span></div><div class="fill-row"><span>点 B 到轴</span><span><button data-fill="B" class="num-field" aria-label="填写点B到轴的格数">?</button> 格</span></div><div class="judge-choice"><button data-verdict="yes">是轴对称</button><button data-verdict="no">不是轴对称</button></div></div>
 <div id="progress" class="progress"><span>已落点</span><span><strong id="pointCount">0</strong> / <span id="pointTotal">4</span></span></div>
 <div class="bottom"><button id="foldBtn" class="primary fold">对折验证</button><div class="secondary-row"><button id="clearBtn">清空作答</button><button id="editQuestionBtn" class="hidden">修改题目</button><button id="deletePointBtn">删除点</button></div></div>
 </aside></section>
 <svg id="penOverlay" class="pen-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
 <div id="penTools" class="pen-tools hidden"><button class="color-btn active" data-color="#ffab00" style="background:#ffab00" aria-label="黄色批注"></button><button class="color-btn" data-color="#f52e91" style="background:#f52e91" aria-label="粉色批注"></button><button class="color-btn" data-color="#08a9ef" style="background:#08a9ef" aria-label="蓝色批注"></button><button id="penUndo">撤笔</button><button id="penClear">清空</button><button id="penEnd">结束</button></div>
 <div id="toast" class="toast" aria-live="polite"></div>
 <div id="helpModal" class="modal-mask hidden"><div class="modal" role="dialog" aria-modal="true" aria-label="课件说明"><h3>课件说明</h3><p>1. 找点连线：点格点找对应点，再切换“连线”，从一个点拖到另一个点。</p><p>2. 辅助垂线：点原图的 A、B 点，一次画到轴，再点延伸，第三次收起；距离可开关。</p><p>3. 对折验证：画完后对折，观察两边能否重叠。点错可删除或撤销。</p><p>4. 换题出题：拓展题点“换一题”；自定义先设轴，再画半边，点“开始作答”。绿色格点可用。</p><div class="close-row"><button class="primary" id="helpClose">知道了</button></div></div></div>
 <div id="numberModal" class="modal-mask hidden"><div class="modal number-modal" role="dialog" aria-modal="true" aria-label="填写距离"><h3 id="numberTitle">点 A 到轴几格？</h3><div id="numberValue" class="number-value"></div><div id="keypad" class="keypad"></div><div class="close-row" style="gap:8px"><button id="numberCancel">取消</button><button class="primary" id="numberOK">确定</button></div></div></div>
