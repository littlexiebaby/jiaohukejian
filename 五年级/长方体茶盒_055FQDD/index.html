            </button>

                    <h3 class="text-pink-700 font-black text-sm m-0 mb-1 border-b-2 border-pink-200 pb-1">茶盒尺寸</h3>
                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-700 w-4">长</span><input type="range" id="tea-x" min="1" max="50" value="20" class="flex-1 h-1"><span id="val-tea-x" class="text-xs font-bold w-4 text-right">20</span></div>

                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-gray-700 w-4">高</span><input type="range" id="con-y" min="1" max="50" value="30" class="flex-1 h-1"><span id="val-con-y" class="text-xs font-bold w-4 text-right">30</span></div>
