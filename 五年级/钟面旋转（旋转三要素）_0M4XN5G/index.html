.victory-cup{display:block;width:76px;height:76px;margin:14px auto 6px}.victory-title{font-size:44px;color:var(--winner);margin:8px 0 10px;line-height:1.2}
.victory-result{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:0;color:#efaa25}.victory-result strong{font-size:68px;line-height:1}.victory-result span{font-size:28px}.victory-note{font-size:24px;margin:16px 0 22px;color:#55758a}
.victory-actions{display:flex;justify-content:center;gap:14px}.victory-actions button{font-size:24px;padding:12px 22px;border-radius:12px;border:1px solid #cddfea;background:#eff6fa;white-space:nowrap}.victory-actions .primary{background:var(--winner);color:white;border-color:var(--winner)}
.victory-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:24px}.victory-confetti i{position:absolute;top:-18px;width:8px;height:14px;background:#ffd257;animation:victory-confetti 2.1s ease-in forwards}.victory-confetti i:nth-child(3n){background:var(--winner)}.victory-confetti i:nth-child(3n+1){background:#ed887b}
@keyframes victory-in{from{opacity:0;transform:scale(.85) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes victory-confetti{0%{opacity:0;transform:translateY(-20px) rotate(0)}12%,82%{opacity:1}100%{opacity:0;transform:translateY(430px) rotate(340deg)}}
@media(max-height:640px),(orientation:portrait) and (max-width:640px){.victory-card{width:470px;padding:18px 25px}.victory-team{font-size:21px}.victory-cup{width:54px;height:54px;margin:8px auto 4px}.victory-title{font-size:35px;margin:5px 0 7px}.victory-result strong{font-size:53px}.victory-result span{font-size:23px}.victory-note{font-size:20px;margin:10px 0 16px}.victory-actions button{font-size:21px;padding:10px 18px}}
@media(max-height:440px),(orientation:portrait) and (max-width:440px){.victory-wrap{padding:9px}.victory-card{width:400px;padding:12px 22px;border-radius:20px}.victory-team{font-size:18px;padding:3px 20px}.victory-cup{width:40px;height:40px;margin:5px auto 2px}.victory-title{font-size:29px;margin:3px 0 5px}.victory-result strong{font-size:44px}.victory-result span{font-size:20px}.victory-note{font-size:18px;margin:7px 0 12px}.victory-actions button{font-size:19px;padding:8px 15px}}
@media(prefers-reduced-motion:reduce){.victory-card{animation:none}.victory-confetti{display:none}}

</style>

 <p><b>1.</b> 点击空框填写指令：中心需再点钟面O，方向选文字箭头，角度用数字键盘。标签逐项显现。</p>
 <p><b>2.</b> 点“执行”瞄准怪兽。缺方向会反转，缺中心绕指针中点转，缺角度不转。等效指令都有效，绕O转180度可省方向。</p>
 <p><b>3.</b> 单人首题顺时针90度，之后随机。PK默认选O，左右题目不同；每答对一题20分，可重试，先答对5题得100分者获胜。</p>
 <p><b>4.</b> “大格题”可切到6度小格题。右上角可静音、批注、撤销、重置、全屏；切题保留得分，重置恢复默认。</p>
