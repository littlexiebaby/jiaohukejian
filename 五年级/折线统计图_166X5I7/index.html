      margin-top: 1px;

    /* 萌萌红晕 */
    .blush {
      position: absolute;
      bottom: 10px;
      width: 5px;
      height: 3px;
      background-color: #FDA4AF; /* 软粉色腮红 */
      border-radius: 50%;
      opacity: 0.85;
      filter: blur(0.5px);
      z-index: 3;
    }
    .blush.blush-l {
      left: 5px;
    }
    .blush.blush-r {
      right: 5px;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); box-shadow: 0 0 4px #0EA5E9; }
      100% { transform: scale(1.1); box-shadow: 0 0 10px #38BDF8; }
    }
    @keyframes ringPulse {
      0% { opacity: 0.4; transform: rotateX(70deg) rotateY(15deg) scale(0.96); }
      100% { opacity: 0.8; transform: rotateX(70deg) rotateY(15deg) scale(1.04); }
    }
    @keyframes blinky {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* 机器人上方对话框气泡 - 定位在机器人正上方，向右偏置防裁剪，箭头向下指向机器人中心 */
    .spirit-bubble {
      position: absolute;
      bottom: 66px;
      left: 0;
      width: 220px;
      background: rgba(255, 255, 255, 0.98);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: bold;
      color: var(--text-main);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.12);
      opacity: 0;
      transform: translateY(12px) scale(0.85);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 1.4;
      z-index: 1001;
      word-break: break-word;
      word-wrap: break-word;
    }

    .spirit-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 23px; /* 60px宽度的容器，箭头中心对准30px (23 + 7 = 30) */
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.98) transparent;
      display: block;
      width: 0;
    }

    .spirit-bubble::before {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 22px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--primary) transparent;
      display: block;
      width: 0;
      z-index: -1;
    }

    .water-spirit-container.show-bubble .spirit-bubble {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* AI 载入动画 */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      align-self: flex-start;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: wave 1.2s infinite ease-in-out;
      opacity: 0.6;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* 动画定义 */
    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bounce-animation {
      animation: spiritBounce 0.6s cubic-bezier(0.25, 0.8, 0.25, 1.4);
    }

    @keyframes spiritBounce {
      0%, 100% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.1, 0.85) translateY(0); }
      50% { transform: scale(0.92, 1.08) translateY(-15px); }
      70% { transform: scale(1.02, 0.98) translateY(0); }
    }

    /* 滚动条美化 */
    .chat-messages::-webkit-scrollbar,
    .table-card::-webkit-scrollbar {
      width: 5px;
      height: 4px;
    }
    .chat-messages::-webkit-scrollbar-track,
    .table-card::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb,
    .table-card::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }

    /* 响应式样式 */
    @media (max-width: 1024px) {
      .main-container {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
      }
      html, body {
        height: auto;
        overflow-y: auto;
      }
      .table-card {
        max-height: none;
        overflow: auto;
      }
      .chart-container {
        min-height: 320px;
      }
      .canvas-wrapper {
        flex-direction: column;
        height: auto;
        gap: 12px;
      }
      .chart-canvas-box {
        height: 280px;
        flex: none;
        width: 100%;
      }
      /* 保持移动端多行表格美观 */
      #tableContainer {
        gap: 10px;
      }
      .spirit-bubble {
        bottom: 66px;
        width: 180px;
        left: 0;
      }
    }

    /* 防止触屏一体机上频繁点击导致文字被选中，优化交互体感 */
    .control-btn, .cute-pill-btn, .mic-btn, .send-btn, .template-pill, .water-spirit-container {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
  </style>

  <!-- 背景粒子 -->
  <div class="bg-shapes">

          <div class="table-title">📊 数据表</div>
        </div>
        <div style="overflow-x: auto; width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 2px 2px 4px 2px;" id="tableContainer">
          <!-- 动态分行渲染多个 table -->
        </div>

        <div class="cute-pills-container">
          <span class="cute-pills-label">🎈 数据个数:</span>
          <div class="cute-pills" id="dataCountPills">
            <button class="cute-pill-btn" data-value="5" onclick="changeDataCount(5)">5个</button>

            <button class="cute-pill-btn" data-value="12" onclick="changeDataCount(12)">12个</button>
            <button class="cute-pill-btn" data-value="15" onclick="changeDataCount(15)">15个</button>
          </div>
        </div>
      </div>

      <!-- 图表卡片 (在下方) -->
      <div class="glass-card chart-container">
        <div class="chart-title-area">
          <span class="chart-title-text" id="chartTitle">加载中...</span>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
          <div class="chart-canvas-box" id="boxChart">
            <canvas id="mathChart"></canvas>
          </div>
          <div class="chart-canvas-box" id="boxCompare" style="display: none;">
            <canvas id="mathChartCompare"></canvas>
          </div>
        </div>
        <!-- 图表切换与数值显示控制 -->
        <div class="chart-controls">
          <button id="btnLineChart" class="control-btn active" onclick="switchChartType('line')">
            折线统计图
          </button>
          <button id="btnBarChart" class="control-btn" onclick="switchChartType('bar')">
            条形对比图
          </button>
          <button id="btnBothChart" class="control-btn" onclick="switchChartType('both')">
            📊 同屏对比
          </button>
          <button id="btnToggleLabels" class="control-btn" onclick="toggleDataLabels()">
            🏷️ 显示数值
          </button>
        </div>
      </div>
    </section>

    <!-- 右侧：AI对话区 (30%) -->
    <section class="control-section">
      <!-- 对话卡片 -->
      <div class="glass-card chat-card">
        <div class="chat-header">
          <div class="chat-title">数学小助手</div>
        </div>

        <!-- 对话历史 -->
        <div class="chat-messages" id="chatMessages">
          <div class="message message-ai">
            你好！我是你的智能数学小助手**小Q** 🤖！<br><br>
            点击下方的快捷例题按钮，或者用语音 🎙️、打字告诉我你想画什么统计图，我来帮你画吧！
          </div>
        </div>

        <!-- 底部控制与互动区 -->
        <div class="chat-bottom-section">
          <!-- 上排：左侧机器人，右侧快捷例题 -->
          <div class="bot-and-templates-row">
            <!-- 智能机器人形象放置在麦克风正上方，对齐麦克风 -->
             <div class="water-spirit-container" id="waterSpirit" onclick="clickSpirit()">
               <div class="spirit-bubble" id="spiritBubble">点我跟我说话，我帮你画统计图！🤖</div>
               
               <!-- 浅蓝色科技可爱球体 -->
               <div class="tech-orb">
                 <!-- 天线 -->
                 <div class="antenna">
                   <div class="antenna-line"></div>
                   <div class="antenna-glow"></div>
                 </div>
                 <!-- 左右小耳朵 -->
                 <div class="robot-ear ear-l"></div>
                 <div class="robot-ear ear-r"></div>
                 <!-- 科技光圈 -->
                 <div class="tech-ring"></div>
                 <!-- 面罩 -->
                 <div class="face-visor">
                   <div class="eyes">
                     <div class="eye" id="leftEye">
                       <div class="pupil" id="leftPupil"></div>
                     </div>
                     <div class="eye" id="rightEye">
                       <div class="pupil" id="rightPupil"></div>
                     </div>
                   </div>
                   <div class="smile"></div>
                 </div>
                 <!-- 萌萌红晕 -->
                 <div class="blush blush-l"></div>
                 <div class="blush blush-r"></div>
               </div>
             </div>
            <!-- 右侧快捷例题 -->
            <div class="quick-templates">
              <button class="template-pill" onclick="loadStaticExample(1)">👥 例1: 全国人口数统计</button>
              <button class="template-pill" onclick="loadStaticExample(2)">🚄 例2: 高铁营业里程统计</button>
              <button class="template-pill" onclick="loadStaticExample(3)">🌡️ 例3: 杭州2月气温变化</button>
            </div>
          </div>
          <!-- 下排：输入与语音控制条 -->
          <div class="chat-input-area">
            <button id="micBtn" class="mic-btn" onclick="toggleListening()" title="语音输入">🎙️</button>
            <input type="text" id="chatInput" class="chat-input" placeholder="例如：画一张我国高铁营业里程统计图..." onkeydown="handleInputKeydown(event)">
            <button class="send-btn" onclick="sendMessage()">生成</button>
          </div>
        </div>
      </div>
    </section>
