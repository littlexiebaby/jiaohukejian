<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>观察物体（三）——交互课件</title>
    
    <!-- 本地依赖库引入 (离线兼容支持) -->
    <script src="_site/math/daohang/ku/three.min.js"></script>
    <script src="_site/math/daohang/ku/OrbitControls.js"></script>

    <script>
        const mcTextures = (function() {
            function create(type) {
                const c = document.createElement('canvas');
                const ctx = c.getContext('2d');
                if (type === 'steve_face') {
                    c.width = 8; c.height = 8;
                    ctx.fillStyle = '#f0b08a'; ctx.fillRect(0,0,8,8);
                    ctx.fillStyle = '#593a2e'; ctx.fillRect(0,0,8,2); ctx.fillRect(0,2,1,1); ctx.fillRect(7,2,1,1);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(1,4,2,1); ctx.fillRect(5,4,2,1);
                    ctx.fillStyle = '#3e3ab8'; ctx.fillRect(2,4,1,1); ctx.fillRect(5,4,1,1);
                    ctx.fillStyle = '#b5654b'; ctx.fillRect(3,5,2,1);
                    ctx.fillStyle = '#804020'; ctx.fillRect(2,6,4,1);
                    return c.toDataURL();
                }

                c.width = 16; c.height = 16;
                if (type === 'grass_top') {
                    ctx.fillStyle = '#659c35'; ctx.fillRect(0,0,16,16);
                    for(let i=0;i<40;i++){
                        ctx.fillStyle = Math.random()>0.5?'#578a2a':'#72b03c';
                        ctx.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),1,1);
                    }
                } else if(type === 'dirt') {
                    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0,0,16,16);
                    for(let i=0;i<40;i++){
                        ctx.fillStyle = Math.random()>0.5?'#704620':'#9e6b36';
                        ctx.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),1,1);
                    }
                } else if(type === 'stone_tile') {
                    ctx.fillStyle = '#6b6b6b'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#4f4f4f'; ctx.fillRect(0,0,16,1); ctx.fillRect(0,0,1,16);
                    ctx.fillStyle = '#8c8c8c'; ctx.fillRect(15,1,1,15); ctx.fillRect(1,15,15,1);
                    for(let i=0;i<12;i++){
                        ctx.fillStyle = Math.random()>0.5?'#5c5c5c':'#7a7a7a';
                        ctx.fillRect(Math.floor(Math.random()*14)+1,Math.floor(Math.random()*14)+1,1,1);
                    }
                } else if(type === 'log_side') {
                    ctx.fillStyle = '#5c4033'; ctx.fillRect(0,0,16,16);
                    for(let i=0; i<16; i++) {
                        ctx.fillStyle = Math.random()>0.5 ? '#4a332a' : '#6b4d3f';
                        ctx.fillRect(i, 0, 1, 16);
                    }
                } else if(type === 'log_top') {
                    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#d2b48c'; ctx.fillRect(2,2,12,12);
                    ctx.fillStyle = '#c2a47c'; ctx.fillRect(4,4,8,8);
                } else if(type === 'leaves') {
                    ctx.fillStyle = '#3d7a3d'; ctx.fillRect(0,0,16,16);
                    for(let i=0; i<60; i++) {
                        ctx.fillStyle = Math.random()>0.5 ? '#2d5a2d' : '#4d9a4d';
                        ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
                    }
                    for(let i=0; i<20; i++) {
                        ctx.fillStyle = 'rgba(0,0,0,0.2)'; 
                        ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
                    }
                }
                return c.toDataURL();
            }
            return { 
                dirt: create('dirt'), 
                stoneTile: create('stone_tile'),
                steveFace: create('steve_face'),
                grassTop: create('grass_top'),
                logSide: create('log_side'),
                logTop: create('log_top'),
                leaves: create('leaves')
            };
        })();

        document.documentElement.style.setProperty('--mc-dirt', 'url(' + mcTextures.dirt + ')');
    </script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: "KaiTi", "STKaiti", "SimKai", "Microsoft YaHei", sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            color: #1e293b;
            touch-action: manipulation;
        }

        #main-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 左侧控制区：占总宽 22%，一屏紧凑设计，上下按钮锁定，中间自适应 */
        #left-panel {
            width: 22%;
            min-width: 165px;
            max-width: 280px;
            height: 100%;
            background: #ffffff;
            border-right: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 6px 7px;
            gap: 2px;
            z-index: 10;
            overflow: hidden; /* 防止面板整体外溢产生混乱滚动 */
            box-sizing: border-box;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.04);
        }

        #left-panel::-webkit-scrollbar {
            width: 4px;
        }
        #left-panel::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        /* 顶部导航辅助按钮：严格锁定顶部，绝不被遮挡 */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .btn-nav {
            height: 25px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #e0e7ff;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 2px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .btn-help { 
            flex: 1.3;
            background-color: #e0f2fe; 
            border-color: #bae6fd; 
            color: #0369a1;
        } 
        .btn-help:active { 
            background-color: #0284c7; 
            color: #ffffff; 
        }
        .btn-scenery {
            flex: 1;
            background-color: #fef3c7; 
            border-color: #fde047; 
            color: #b45309;
        }
        .btn-scenery:active {
            background-color: #f59e0b; 
            color: #ffffff;
        }
        .btn-fullscreen {
            flex: 0.9;
            background-color: #ede9fe; 
            border-color: #ddd6fe; 
            color: #6d28d9;
        }
        .btn-fullscreen:active {
            background-color: #7c3aed; 
            color: #ffffff;
        }

        .panel-divider {
            width: 100%;
            height: 1px;
            background-color: #e2e8f0;
            margin: 2px 0;
            flex-shrink: 0;
        }
        
        .panel-label {
            font-size: 13px;
            color: #334155;
            font-weight: bold;
            align-self: center;
            flex-shrink: 0;
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        /* 中部核心三视图观测板块：弹性收缩，在矮屏下内部平滑自适应，绝不向上/向下遮挡 */
        .views-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            flex: 1 1 0;
            min-height: 0;
            justify-content: space-evenly;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1px 0;
        }
        .views-container::-webkit-scrollbar {
            width: 3px;
        }
        .views-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        .view-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex: 1 1 0;
            min-height: 0;
            max-height: 31%;
        }

        /* 视角切换按钮：大字号、醒目 */
        .view-btn {
            width: 96%;
            height: 23px;
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .view-btn:hover {
            background-color: #e0f2fe;
            border-color: #7dd3fc;
            color: #0369a1;
        }
        .view-btn:active {
            background-color: #bae6fd;
            border-color: #38bdf8;
            transform: translateY(1px);
        }
        
        /* 6列5行网格 (30格)：圆角长方形容器，内部绝对防止溢出 */
        .grid-2d {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            width: 96%;
            max-width: 175px;
            max-height: calc(100% - 25px);
            aspect-ratio: 6 / 5;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            padding: 3px;
            overflow: hidden; /* 核心：彻底防止小方格溢出圆角边框 */
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
            flex-shrink: 1;
            min-height: 0;
        }

        /* 错误闪烁提示 */
        .grid-error {
            animation: flashRedBorder 0.4s infinite alternate;
        }
        @keyframes flashRedBorder {
            from { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.7); }
            to { border-color: #cbd5e1; box-shadow: none; }
        }
        
        /* 小正方格：严格保持在网格容器内，去除min-height硬编码，避免撑破容器 */
        .grid-cell {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 2px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.12s ease;
            min-width: 0;
            min-height: 0;
        }
        .grid-cell:hover {
            background-color: #f8fafc;
        }
        
        /* 点选激活状态：与展示区正方体泥土材质与颜色一致 */
        .grid-cell.active {
            border: 1.5px solid #3d2314;
            background-image: var(--mc-dirt);
            background-size: 100% 100%;
            image-rendering: pixelated;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        /* 三视图判断按钮 (归属于三视图观测板块内部) */
        .btn-check {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); 
            color: #ffffff; 
            border: none;
            border-radius: 7px;
            height: 30px !important;
            font-size: 14px !important;
            font-weight: bold;
            width: 96% !important;
            line-height: 1;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
            transition: all 0.15s ease;
            margin-top: 1px;
            flex-shrink: 0;
        }
        .btn-check:hover {
            background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 100%);
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.45);
        }
        .btn-check:active {
            transform: translateY(1px);
            box-shadow: 0 1px 3px rgba(245, 158, 11, 0.3);
        }

        /* 底部控制区：4个积木按钮 (严格锁定底部，绝不被遮挡) */
        .bottom-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .btn-row-tight {
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 5px;
        }

        .btn-tight {
            flex: 1;
            height: 25px;
            font-size: 12px;
            font-weight: bold;
            border: 1.5px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-build { 
            background-color: #dcfce7; 
            border-color: #86efac; 
            color: #15803d;
        }
        .btn-build:active, .btn-build.active {
            background-color: #22c55e; 
            border-color: #16a34a; 
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        .btn-delete { 
            background-color: #fee2e2; 
            border-color: #fca5a5; 
            color: #b91c1c;
        }
        .btn-delete:active, .btn-delete.active {
            background-color: #ef4444; 
            border-color: #dc2626; 
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        .btn-undo {
            background-color: #fef3c7; 
            border-color: #fde047; 
            color: #b45309;
        }
        .btn-undo:active {
            background-color: #f59e0b; 
            border-color: #d97706; 
            color: #ffffff;
        }

        .btn-reset {
            background-color: #f1f5f9; 
            border-color: #cbd5e1; 
            color: #475569;
        }
        .btn-reset:active {
            background-color: #64748b; 
            color: #ffffff;
        }

        /* 右侧展示区 */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            cursor: crosshair;
            touch-action: none; 
            background-color: #78a7ff; 
            overflow: hidden;
        }
        
        #canvas-container canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* 全屏烟花画布 */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        /* 超大字号、精美马卡龙卡通弹窗 (字号放大80%) */
        #universal-modal {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999; 
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #ffffff;
            padding: 0 0 30px 0; 
            border-radius: 28px;
            border: 4px solid #38bdf8;
            box-shadow: 0 30px 60px -12px rgba(2, 132, 199, 0.45), 0 0 0 6px #e0f2fe;
            text-align: center;
            width: 92%;
            max-width: 660px; 
            max-height: 88vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            animation: popModal 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popModal {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-header-bar {
            background: linear-gradient(135deg, #bae6fd 0%, #fef08a 100%);
            padding: 20px 28px;
            border-bottom: 3px solid #7dd3fc;
        }
        .modal-title {
            font-size: 36px;
            font-weight: bold;
            color: #0369a1;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }
        .modal-message {
            font-size: 32px; 
            font-weight: bold;
            color: #1e293b;
            margin: 24px 30px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            text-align: left;
            flex: 1; 
            overflow-y: auto; 
            padding-right: 10px; 
        }
        .modal-message.long-text {
            font-size: 26px;
            font-weight: normal;
            line-height: 1.75;
        }
        .modal-message::-webkit-scrollbar { width: 8px; }
        .modal-message::-webkit-scrollbar-thumb { background-color: #38bdf8; border-radius: 4px; }
        .modal-btns { display: flex; justify-content: center; gap: 24px; padding: 0 30px; }
        .modal-btn {
            padding: 12px 42px; 
            border-radius: 18px; 
            border: none; 
            cursor: pointer;
            font-weight: bold; 
            font-size: 24px; 
            font-family: inherit;
            transition: all 0.15s ease;
        }
        .modal-confirm { 
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
            color: #ffffff; 
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45);
        }
        .modal-confirm:hover {
            background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
        }
        .modal-confirm:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4); }
        .modal-cancel { 
            background: #f1f5f9; 
            color: #64748b; 
            border: 2px solid #cbd5e1;
        }
        .modal-cancel:active { background: #e2e8f0; }
        
        @media (max-width: 768px) {
            #left-panel { width: 26%; min-width: 150px; padding: 4px 4px; }
            .view-btn { font-size: 12px; height: 20px; }
            .btn-tight { height: 22px; font-size: 11px; }
            .btn-check { height: 26px !important; font-size: 13px !important; }
            .modal-title { font-size: 26px; }
            .modal-message { font-size: 22px; margin: 16px 18px; }
            .modal-message.long-text { font-size: 18px; }
            .modal-btn { font-size: 18px; padding: 8px 24px; border-radius: 12px; }
        }

        /* 触屏一体机非全屏 / 标准高度自适应 (780px及以下) */
        @media (max-height: 780px) {
            #left-panel { padding: 4px 5px; gap: 2px; }
            .panel-label { font-size: 12px; margin-bottom: 1px; }
            .view-btn { height: 21px; font-size: 12px; }
            .grid-2d { padding: 2px; gap: 1.5px; }
            .btn-check { height: 28px !important; font-size: 13px !important; }
            .btn-tight { height: 23px; font-size: 11px; }
            .btn-nav { height: 23px; font-size: 11px; }
        }

        /* 触屏一体机带工具栏/非全屏窗口 (660px及以下) */
        @media (max-height: 660px) {
            #left-panel { padding: 3px 4px; gap: 1px; }
            .panel-label { font-size: 11px; letter-spacing: 1px; margin-bottom: 0; }
            .panel-divider { margin: 1px 0; }
            .views-container { gap: 2px; }
            .view-block { gap: 1px; }
            .view-btn { height: 19px; font-size: 11.5px; }
            .grid-2d { padding: 1.5px; gap: 1px; }
            .btn-check { height: 25px !important; font-size: 12px !important; }
            .bottom-controls { gap: 2px; }
            .btn-tight { height: 21px; font-size: 11px; }
            .btn-nav { height: 21px; font-size: 11px; }
            .modal-content { max-height: 94vh; padding: 0 0 16px 0; }
            .modal-header-bar { padding: 10px 16px; }
            .modal-title { font-size: 22px; }
            .modal-message { font-size: 20px; margin: 12px 16px; }
            .modal-message.long-text { font-size: 16px; }
            .modal-btn { font-size: 16px; padding: 6px 20px; }
        }

        /* 极端矮屏窗口 (560px及以下) */
        @media (max-height: 560px) {
            .panel-label { display: none; }
            .panel-divider { display: none; }
            .view-btn { height: 18px; font-size: 11px; }
            .btn-check { height: 22px !important; font-size: 11px !important; }
            .btn-tight { height: 19px; font-size: 10.5px; }
            .btn-nav { height: 19px; font-size: 10.5px; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- 左侧控制区：占总宽 22%，一屏无缝展示 -->
        <div id="left-panel">
            <!-- 顶部导航辅助区：课件说明书、背景控制、全屏 -->
            <div class="top-nav">
                <button class="btn-nav btn-help" id="help-btn">课件说明书</button>
                <button class="btn-nav btn-scenery" id="scenery-btn">隐藏背景</button>
                <button class="btn-nav btn-fullscreen" id="fullscreen-btn">全屏</button>
            </div>

            <div class="panel-divider"></div>

            <!-- 核心突出的三视图观测板块 -->
            <div class="panel-label">三视图观测</div>

            <div class="views-container">
                <!-- 正面视图 -->
                <div class="view-block">
                    <button class="view-btn" id="view-front-btn" title="点击对齐正前方视角">从正面看</button>
                    <div class="grid-2d" id="grid-front"></div>
                </div>

                <!-- 左面视图 -->
                <div class="view-block">
                    <button class="view-btn" id="view-left-btn" title="点击对齐正左方视角">从左面看</button>
                    <div class="grid-2d" id="grid-left"></div>
                </div>

                <!-- 上面视图 -->
                <div class="view-block">
