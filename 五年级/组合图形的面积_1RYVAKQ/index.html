    <title>组合图形的面积</title>
    <style>

        margin: 0;
        width: 100%;
        height: 100%;

      button,

      }
      button:disabled {
        opacity: 0.36;
        cursor: default;
      }
      button.active,
      button.primary {
        background: #237c78;
        border-color: #237c78;
        color: #fff;
      }
      button.active:hover,
      button.primary:hover {
        background: #1d6966;
      }
      button.soft {
        color: #237c78;
        border-color: #acd5d0;
        background: #edf8f6;
      }
      button.small {
        font-size: 19px;
        padding: 8px 12px;
        min-height: 37px;
      }
      button.icon-only {
        font-size: 26px;
        min-width: 42px;
        padding: 5px 10px;
      }
      input,
      select,
      textarea {
        border: 1px solid #b9c9ce;
        background: white;
        border-radius: 7px;
        padding: 8px 12px;
        font-size: 22px;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      select {
        max-width: 400px;
        min-height: 41px;
      }
      textarea {
        resize: none;
        line-height: 1.55;
      }
      svg {
        display: block;
      }
      #app {
        position: absolute;
        left: 0;

      .toast {

      .compact .header {

      .compact .question-grid {

    </style>

  <body>
    <div id="app">
      <header class="header">
        <h1>组合图形的面积</h1>
        <div class="utilities">
          <button data-action="help">说明</button>
          <button id="inkButton" data-action="ink">批注</button>
          <button id="undoButton" data-action="undo">撤销</button>
          <button data-action="reset">重置</button>
          <button id="fullscreenButton" data-action="fullscreen">全屏</button>
        </div>
      </header>
      <main class="main">
        <div class="stage-shell">
          <div id="canvasWrap" class="canvas-wrap">
            <div id="questionTitle">字母 A</div>
            <svg
              id="board"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 1200 640"
              role="application"
              aria-label="组合图形割补操作区"
            >
              <g id="ghostLayer" pointer-events="none"></g>
              <g id="transitionLayer" pointer-events="none"></g>
              <g id="shapeLayer" pointer-events="none"></g>
              <g id="dimensionLayer" pointer-events="none"></g>
              <g id="inkLayer" pointer-events="none"></g>
              <rect id="eventSurface" x="0" y="0" width="1200" height="640" fill="transparent" />
              <g id="previewLayer" pointer-events="none"></g>
            </svg>
            <div class="stage-actions">
              <button data-action="record">记录方法</button>
              <button id="compareButton" data-action="compare">对比</button>
            </div>
          </div>
          <aside id="formulaPanel" class="formula-panel">
            <div class="formula-heading">
              <span>列式</span>
              <button data-action="closeFormula" aria-label="关闭列式">×</button>
            </div>
            <div id="formulaLines" class="formula-lines"></div>
          </aside>
        </div>
      </main>
      <footer class="bottom" aria-label="控制区">
        <div class="control-group">
          <button data-action="questions">选题</button>
          <button id="dataButton" data-action="data">显示数据</button>
          <button data-action="random">换数据</button>
        </div>
        <nav class="control-group tool-controls" aria-label="割补工具">
          <button id="moveButton" data-tool="move" class="active">移动</button>
          <button id="cutButton" data-tool="cut">割</button>
          <button id="addButton" data-tool="add">补</button>
          <button id="copyButton" data-action="copy">复制</button>
          <button id="deleteButton" data-action="delete">删除</button>
        </nav>
        <div class="control-group">
          <button id="demoButton" data-action="demo" class="primary">一键演示</button>
          <button id="formulaButton" data-action="formula">列式</button>
        </div>
      </footer>
      <div id="inkBar" class="ink-bar">
        <button
          class="swatch"
          data-ink="#ef263f"
          style="--ink: #ef263f; background: #ef263f"
          aria-label="红笔"
        ></button>
        <button
          class="swatch"
          data-ink="#155fff"
          style="--ink: #155fff; background: #155fff"
          aria-label="蓝笔"
        ></button>
        <button
          class="swatch"
          data-ink="#ab27ee"
          style="--ink: #ab27ee; background: #ab27ee"
          aria-label="紫笔"
        ></button>
        <button data-action="inkUndo">撤销笔迹</button>
        <button data-action="inkClear">清空笔迹</button>
        <button data-action="exitInk">完成</button>
      </div>
      <div id="questionsModal" class="shade">
        <section class="dialog question-dialog">
          <div class="dialog-head">
            <h2>选题</h2>
            <button data-close="questionsModal">关闭</button>
          </div>
          <div id="categoryTabs" class="category-tabs"></div>
          <div id="questionGrid" class="question-grid"></div>
          <div class="question-pager">
            <button id="prevQuestionsButton" data-action="prevQuestions">上一页</button>
            <span id="questionPage"></span>
            <button id="nextQuestionsButton" data-action="nextQuestions">下一页</button>
          </div>
        </section>
      </div>
      <div id="helpModal" class="shade">
        <section class="dialog help-dialog">
          <div class="dialog-head">
            <h2>课件说明</h2>
            <button data-close="helpModal">关闭</button>
          </div>
          <p>1. “选题”切换图形，“显示数据”查看尺寸，“换数据”生成新题。</p>
          <p>2. “一键演示”观看割补过程，“列式”显示或收起算式。</p>
          <p>3. “割”划线分块，“补”描边补齐缺口。“移动”拖动或旋转，“复制”复制选中图形。</p>
          <p>4. “记录方法”后可对比、批注。“撤销”回退操作，“重置”恢复本题初始状态。</p>
        </section>
      </div>
      <section id="compareModal" class="compare">
        <header class="compare-head">
          <div class="left">
            <h2 id="compareTitle">方法对比</h2>
            <select id="dataGroupSelect" aria-label="选择已记录的数据组"></select>
          </div>
          <div class="right">
            <button id="comparePenButton" data-action="comparePen">批注</button>
            <button data-action="inkUndo">撤销</button>
            <button data-action="inkClear">清空笔迹</button>
            <button data-action="closeCompare">返回</button>
          </div>
        </header>
        <div id="compareArea" class="compare-area">
          <div id="recordGrid" class="record-grid"></div>
          <svg
            id="compareInk"
            class="compare-ink"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1200 640"
          ></svg>
        </div>
        <footer class="compare-foot">
          <button id="prevRecordsButton" data-action="prevRecords">上一页</button>
          <span id="recordPage"></span>
          <button id="nextRecordsButton" data-action="nextRecords">下一页</button>
        </footer>
      </section>
      <div id="toast" class="toast" role="status"></div>
    </div>
