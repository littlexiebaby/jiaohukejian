<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="assets/">
  <script>document.addEventListener("DOMContentLoaded",function(){if(window.parent!==window&&typeof window.parent.__coursewareReady==="function")window.parent.__coursewareReady(window);});</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9f7ff">
<title>乘除法竞速赛</title>
<script defer src="assets/vendor/gsap.min.js"></script>
<script defer src="assets/scripts/math-engine.js"></script>
<script defer src="assets/scripts/audio.js"></script>
<script defer src="assets/scripts/app.js"></script>
<link rel="stylesheet" href="assets/styles/main.css">
<link rel="icon" href="assets/images/flag.png">
</head>
<body>
<main id="shell" aria-label="乘除法竞速赛">
  <header class="header">
    <h1><img src="assets/images/flag.png" alt="" draggable="false"><span>乘除法竞速赛</span></h1>
    <nav class="scenes" aria-label="切换场景"><button data-action="scene" data-scene="seaside" class="selected" aria-pressed="true" aria-label="海滨"><svg class="scene-symbol" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="25" cy="42" rx="21" ry="5" fill="#f3d487"/><path d="M20 41q10-13 5-29l6-1q5 21-5 31z" fill="#a86a35"/><path d="M27 13Q9-3 3 14q12-5 24 2Q10 10 9 29q8-10 20-14Q37 1 46 15q-12-4-18 2Q42 13 44 30q-9-12-17-13Q30-2 18 2q7 5 9 12z" fill="#23924a"/><path d="m25 16 4 1" stroke="#126e33" stroke-width="4" stroke-linecap="round"/></svg>海滨</button><button data-action="scene" data-scene="forest" aria-pressed="false" aria-label="森林"><svg class="scene-symbol" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="43" rx="20" ry="4" fill="#c5ddbf"/><path d="M21 29h7v14h-7z" fill="#8e633c"/><path d="M24 3 9 21h7L5 32h9L2 40h44L33 31h8L30 20h7z" fill="#157642"/><path d="m24 3 1 36H9l8-8h-5l10-11h-7z" fill="#268e57"/></svg>森林</button></nav>
    <button id="start" class="start" data-action="start">开始</button>
    <button class="rules" data-action="rules">规则</button>
    <div class="tools" id="tools"></div>
  </header>
  <section class="arena seaside" id="arena" aria-label="赛车区域">
    <div class="scene-horizon" aria-hidden="true"></div><div class="scene-road" aria-hidden="true"></div><div class="scene-front" aria-hidden="true"></div>
    <div class="lane-area" id="lanes"></div>
    <img class="finish-strip" src="assets/images/finish.png" alt="终点" draggable="false">
    <div id="race-banner" class="race-banner" hidden></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </section>
  <section class="players" id="players" aria-label="选手答题区"></section>
  <div id="ink-bar" class="ink-bar" hidden><button data-action="ink-color" data-color="#ff3656" class="color-dot selected" style="background:#ff3656" aria-label="红色批注"></button><button data-action="ink-color" data-color="#02baff" class="color-dot" style="background:#02baff" aria-label="蓝色批注"></button><button data-action="ink-color" data-color="#ffd526" class="color-dot" style="background:#ffd526" aria-label="黄色批注"></button><button data-action="ink-undo">撤销笔迹</button><button data-action="ink-clear">清空</button><button data-action="ink-close">完成</button></div>
  <canvas id="ink-canvas" hidden aria-label="教师批注画布"></canvas>
  <div id="modal-shade" class="modal-shade" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="dialog-head"><h2 id="modal-title"></h2><button data-action="modal-close" class="close" aria-label="关闭">×</button></header><div id="modal-body" class="modal-body"></div><footer id="modal-footer" class="modal-footer"></footer></section></div>
  <section id="results" class="results seaside" hidden aria-label="比赛领奖台"></section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</main>
<noscript>请在支持JavaScript的浏览器中打开本课件。</noscript>
</body>
</html>
