  <title>表内除法交互课件</title>
  <script src="_site/math/daohang/ku/tailwindcss.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    html, body {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'SimKai', serif;
      touch-action: none !important;
      overscroll-behavior: none !important;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #EAF5F0;
      color: #1B4332;
    }
    body.pseudo-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 99999 !important;
      margin: 0 !important;
      padding: 4px !important;
      background: #EAF5F0 !important;
    }
    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    /* 📱 手机竖持 90° 强制横屏与响应式自适应 */
    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #app-root {
        width: calc(100vh - 8px) !important;
        height: calc(100vw - 8px) !important;
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(90deg) !important;
        transform-origin: center center !important;
        overflow: hidden !important;
      }
    }

    #draw-canvas {
      touch-action: none !important;
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: auto !important;
    }

    #lesson-board {
      position: absolute;
      width: 980px;
      height: 520px;
      transform-origin: 0 0;
      touch-action: none;
    }

    /* 拖拽物品通用基础样式（移除高消耗GPU滤镜，依靠SVG内嵌投影保证极致流畅） */
    .item-draggable {
      width: 44px;
      height: 52px;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .item-draggable:hover {
      transform: scale(1.08);
    }
    .item-draggable.source-dragging {
      opacity: 0.15;
    }

    /* 拖拽跟随镜像（绝对定位、完全受坐标控制） */
    .drag-ghost {
      position: absolute !important;
      left: 0;
      top: 0;
      margin: 0 !important;
      pointer-events: none !important;
      z-index: 1000 !important;
      cursor: grabbing !important;
      transition: none !important;
      animation: none !important;
      will-change: left, top !important;
      transform: scale(1.15) !important;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)) !important;
    }

    /* 优雅极简瓷盘（相对定位参与 flex 布局） */
    .plate-slot {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFCFB 100%);
      border: 3px solid #A7F3D0;
      box-shadow: 0 4px 14px rgba(16,185,129,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px 6px 6px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .plate-slot.active-target {
      border-color: #FBBF24;
      background: linear-gradient(180deg, #FFFDF0 0%, #FEF9C3 100%);
      box-shadow: 0 0 0 4px rgba(251,191,36,0.3), 0 6px 16px rgba(251,191,36,0.18);
    }
    .plate-slot.completed-target {
      border-color: #34D399;
      background: linear-gradient(180deg, #F0FDF4 0%, #ECFDF5 100%);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.25), 0 4px 12px rgba(16,185,129,0.1);
    }

    /* 余数区托盘 */
    .remainder-slot {
      position: relative;
      border-radius: 24px;
      background: linear-gradient(180deg, #FFFDF5 0%, #FFFBEB 100%);
      border: 2.5px dashed #F59E0B;
      box-shadow: 0 4px 12px rgba(245,158,11,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px 6px 6px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .remainder-slot.active-target {
      border-color: #D97706;
      background: #FEF3C7;
      box-shadow: 0 0 0 4px rgba(245,158,11,0.3);
    }

    /* 算式填空槽位 */
    .target-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px dashed #F59E0B;
      border-radius: 12px;
      background: #FFFDF0;
      color: #B45309;
      font-size: 26px;
      font-weight: 900;
      transition: all 0.2s ease;
    }
    .target-slot.filled {
      border: 2.5px solid #10B981;
      background: #ECFDF5;
      color: #065F46;
    }

    /* 候选数字卡片 */
    .answer-card {
      position: relative;
      width: 50px;
      height: 48px;
      background: #FFFFFF;
      border: 2px solid #F59E0B;
      border-radius: 12px;
      color: #B45309;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(245,158,11,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }
    .answer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(245,158,11,0.25);
    }
    .answer-card.source-dragging {
      opacity: 0.2;
    }

    /* 底部加减步进器按钮 */
    .step-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      color: #1E293B;
    }
    .step-btn:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
      transform: scale(1.05);
    }
    /* 含义对比专属卡片与高对比度色彩槽位样式 */
    .compare-card {
      position: relative;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .compare-subbox {
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .compare-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 2px dashed #94A3B8;
      border-radius: 10px;
      background: #FFFFFF;
      color: #1E293B;
      font-size: 22px;
      font-weight: 900;
      transition: all 0.2s ease;
      cursor: pointer;
      vertical-align: middle;
      margin: 0 2px;
      user-select: none;
    }
    .compare-slot:hover {
      transform: scale(1.08);
    }

    /* 1. 总数槽位 (靛蓝色系) */
    .compare-slot.slot-type-total {
      border-color: #3B82F6;
      background: #EFF6FF;
      color: #1D4ED8;
    }
    .compare-slot.slot-type-total.filled {
      border: 2.5px solid #2563EB;
      background: #DBEAFE;
      color: #1E40AF;
      box-shadow: 0 2px 8px rgba(37,99,235,0.2);
    }

    /* 2. 份数槽位 (高对比翠绿色系 - 突出显示份数) */
    .compare-slot.slot-type-parts {
      border-color: #10B981;
      background: #ECFDF5;
      color: #047857;
    }
    .compare-slot.slot-type-parts.filled {
      border: 2.5px solid #059669;
      background: #D1FAE5;
      color: #065F46;
      box-shadow: 0 2px 8px rgba(5,150,105,0.25);
    }

    /* 3. 每份数槽位 (高对比暖橙色系 - 突出显示每份数) */
    .compare-slot.slot-type-per {
      border-color: #F59E0B;
      background: #FFFDF0;
      color: #B45309;
    }
    .compare-slot.slot-type-per.filled {
      border: 2.5px solid #D97706;
      background: #FEF3C7;
      color: #92400E;
      box-shadow: 0 2px 8px rgba(217,119,6,0.25);
    }
  </style>

<body class="h-screen w-full flex flex-col p-2 sm:p-3 text-[#1B4332] pseudo-fullscreen">

  <!-- 主架构 App Root -->
  <div id="app-root" class="w-full h-full flex flex-col gap-2 relative">

    <!-- 1. 顶栏 (大标题居左、题目居中、按钮居右) -->
    <header class="h-[46px] sm:h-[50px] flex items-center justify-between shrink-0 gap-2 px-1">
      
      <!-- 1.1 大标题（纯文字深绿楷体） -->
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-2xl sm:text-3xl font-black text-[#154D35] tracking-wide">表内除法</span>
      </div>

      <!-- 1.2 中间题目陈述 -->
      <div class="flex-1 flex items-center justify-center min-w-0 px-2">
        <div id="header-problem-desc" class="text-base sm:text-lg md:text-xl font-black text-[#154D35] truncate text-center">
          把 12 个橘子平均分成 3 份，每份有几个？
        </div>
      </div>

      <!-- 1.3 右侧白色药丸按钮（含义对比切换、全屏、重置） -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="view-toggle-btn" onclick="toggleView()" class="px-3.5 py-1.5 rounded-full bg-[#1D6F42] hover:bg-[#154D35] font-black text-xs sm:text-sm text-white shadow-xs active:scale-95 transition-all cursor-pointer">
          <span id="view-toggle-text">含义对比</span>
        </button>
        <button onclick="toggleFullscreen()" class="px-3.5 py-1.5 rounded-full bg-white hover:bg-emerald-50 border border-emerald-200 font-black text-xs sm:text-sm text-[#154D35] shadow-xs active:scale-95 transition-all cursor-pointer">
          <span id="fs-text">全屏</span>
        </button>
        <button onclick="resetDistribution()" class="px-3.5 py-1.5 rounded-full bg-white hover:bg-amber-50 border border-amber-200 font-black text-xs sm:text-sm text-[#B45309] shadow-xs active:scale-95 transition-all cursor-pointer">
          重置
        </button>
      </div>
    </header>

    <!-- 2. 中间主展示区 (唯一的白底大卡片容器) -->
    <main class="flex-1 w-full bg-white rounded-3xl shadow-sm border border-emerald-100 flex flex-col overflow-hidden relative min-h-0">
      
      <!-- 轻量提示反馈 Toast (纯文字极简风格，无图标和勾号) -->
      <div id="center-toast-box" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 pointer-events-none transition-all duration-300 opacity-0 scale-95 flex items-center justify-center" role="status" aria-live="polite">
        <div id="center-toast-badge" class="px-5 py-2 rounded-full font-bold text-sm sm:text-base shadow-lg text-white whitespace-nowrap bg-emerald-600">
          <span id="center-toast-text">分好啦！</span>
        </div>
      </div>

      <!-- Canvas 与 DOM 交互板（全尺寸铺满整个展示区） -->
      <div id="canvas-container" class="flex-1 w-full h-full relative overflow-hidden">
        <canvas id="draw-canvas" class="w-full h-full block"></canvas>
        <div id="lesson-board" aria-label="除法交互板"></div>
      </div>
    </main>

    <!-- 3. 底部控制区 (直接排布在页面背景上：物品切换 + 参数调节 + 分法模式) -->
    <footer class="h-[52px] sm:h-[56px] flex items-center justify-center gap-3 sm:gap-6 shrink-0 px-2 overflow-x-auto text-[#154D35]">
      
      <!-- 3.1 物品模型切换 (饼干 / 橘子 / 糖果) -->
      <nav class="bg-white/95 rounded-full p-1 shadow-xs border border-emerald-100 flex items-center gap-1 shrink-0" aria-label="物品选择">
        <button id="item-btn-biscuit" onclick="switchItem('biscuit')" class="px-3 py-1 rounded-full text-xs sm:text-sm font-bold transition-all cursor-pointer text-[#2D5A46] hover:bg-emerald-50">
          🍪 饼干
        </button>
        <button id="item-btn-orange" onclick="switchItem('orange')" class="px-3 py-1 rounded-full text-xs sm:text-sm font-black transition-all cursor-pointer bg-[#2D8B68] text-white shadow-xs">
          🍊 橘子
        </button>
        <button id="item-btn-candy" onclick="switchItem('candy')" class="px-3 py-1 rounded-full text-xs sm:text-sm font-bold transition-all cursor-pointer text-[#2D5A46] hover:bg-emerald-50">
          🍬 糖果
        </button>
      </nav>

      <!-- 3.2 参数调节胶囊组 (总数 & 份数/每份) -->
      <div class="bg-white/95 rounded-full px-4 py-1.5 shadow-xs border border-emerald-100 flex items-center gap-4 shrink-0">
        <!-- 总数调节 -->
        <div class="flex items-center gap-1 text-xs sm:text-sm font-bold">
          <span class="text-gray-600">总数:</span>
          <button onclick="adjustTotal(-1)" class="step-btn text-emerald-800" title="减少总数">-</button>
          <span id="label-total-count" class="font-black text-sm sm:text-base text-[#154D35] min-w-[24px] text-center">12</span>
          <button onclick="adjustTotal(1)" class="step-btn text-emerald-800" title="增加总数">+</button>
        </div>

        <div class="h-4 w-[1px] bg-gray-200"></div>

        <!-- 份数或每份调节 -->
        <div class="flex items-center gap-1 text-xs sm:text-sm font-bold">
          <span id="divisor-label" class="text-gray-600">分几份:</span>
          <button onclick="adjustDivisor(-1)" class="step-btn text-amber-800" title="减少">-</button>
          <span id="label-divisor-count" class="font-black text-sm sm:text-base text-[#B45309] min-w-[24px] text-center">3 盘</span>
          <button onclick="adjustDivisor(1)" class="step-btn text-amber-800" title="增加">+</button>
        </div>
      </div>

      <!-- 3.3 分法模式切换药丸组 -->
      <div class="bg-white/95 rounded-full p-1 shadow-xs border border-emerald-100 flex items-center gap-1 shrink-0">
        <button id="mode-btn-equal" onclick="switchMode('equal')" class="px-3.5 py-1 rounded-full text-xs sm:text-sm font-black transition-all cursor-pointer bg-[#2D8B68] text-white shadow-xs">
          按份数分（平均分）
        </button>
        <button id="mode-btn-contain" onclick="switchMode('contain')" class="px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold transition-all cursor-pointer text-[#2D5A46] hover:bg-emerald-50">
          按每份分（包含除）
        </button>
      </div>

    </footer>

  </div>

  <!-- 烟花 Canvas -->
